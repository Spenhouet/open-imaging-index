# yaml-language-server: $schema=../schema/license.schema.json
id: LicenseRef-NIHCC-ChestXray
name: NIH Clinical Center ChestX-ray dataset terms (FAQ)
short_name: NIH CC ChestX-ray terms
url: https://nihcc.app.box.com/v/ChestXray-NIHCC/file/249502714403
version: FAQ_CHESTXRAY.pdf as updated 2017-12-14 (per LOG_CHESTXRAY.pdf), read 2026-10-07
summary: >-
  Not a formal license. The NIH Clinical Center's FAQ states that use is unrestricted, but asks users to link to
  the original download site, acknowledge the NIH Clinical Center and cite the CVPR 2017 paper.
purpose: any
rules:
  commercial_use:
    value: 'yes'
    note: The FAQ does not name commercial use, but places no restriction on use of any kind.
    quote: The usage of the data set is unrestricted.
  model_training:
    value: 'yes'
    note: The README presents the dataset for training deep neural networks; the FAQ places no restriction on use.
    quote: The usage of the data set is unrestricted.
  derivatives:
    value: 'yes'
    quote: >-
      Parties who use this public dataset are encouraged to share their “updated” image labels and/or new
      bounding boxes in their own studied later, maybe through manual annotation.
    source: https://nihcc.app.box.com/v/ChestXray-NIHCC/file/220660789610
  publication:
    value: 'yes'
    quote: >-
      If you find the dataset useful for your research projects, please cite our CVPR 2017 paper:
    source: https://nihcc.app.box.com/v/ChestXray-NIHCC/file/220660789610
  redistribute_original:
    value: unspecified
    note: >-
      The FAQ speaks of usage and does not say whether the images may be re-hosted. It asks users to link to the
      original download site.
  redistribute_derivatives:
    value: 'yes'
    quote: >-
      Parties who use this public dataset are encouraged to share their “updated” image labels and/or new
      bounding boxes in their own studied later, maybe through manual annotation.
    source: https://nihcc.app.box.com/v/ChestXray-NIHCC/file/220660789610
  share_model_weights:
    value: unspecified
  attribution:
    value: 'yes'
    quote: >-
      But you should provide the link to our original download site, acknowledge the NIH Clinical Center and
      provide a citation to our CVPR 2017 paper.
  share_alike:
    value: 'no'
  signed_agreement:
    value: 'no'
    note: The files are downloaded from a public Box folder without registration.
  ethics_approval:
    value: 'no'
    note: >-
      The terms set no such condition. Your institution or local law may still require it for data about people.
  publication_review:
    value: 'no'
  code_release:
    value: 'no'
  return_results:
    value: 'no'
    note: Sharing improved labels is encouraged, not required.
  delete_after_use:
    value: 'no'
  no_reidentification:
    value: unspecified
  geographic_restriction:
    value: 'no'
verified:
  date: '2026-10-07'
  by: claude-research

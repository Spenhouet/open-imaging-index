id: LicenseRef-API-GS2-DUA
name: Alzheimer's Prevention Initiative Generation Study 2 (GS2) Data Use Agreement
short_name: API GS2 DUA
url: https://ida.loni.usc.edu/collaboration/access/appApply.jsp?project=GS2
version: 'Text of the LONI IDA application page, read 2026-10-11'
summary: >-
  Access is requested for scientific investigation, teaching or planning clinical research. The request is passed to
  the Generation Program team, which follows up with further steps, and approved requests need a formally executed
  Data Transfer Agreement whose terms are not published.
purpose: approved_project
rules:
  commercial_use:
    value: unspecified

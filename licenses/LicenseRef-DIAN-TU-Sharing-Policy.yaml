# yaml-language-server: $schema=../schema/license.schema.json
id: LicenseRef-DIAN-TU-Sharing-Policy
name: DIAN-TU Data and Biospecimen Sharing, Publication, Authorship and Citation Policies
short_name: DIAN-TU sharing policy
url: https://dian.wustl.edu/app/uploads/2026/07/DIANTUResourceSharePublAuthorPolicy_Ver2.1_20July2026_Final.pdf
version: 'Version 2.1, 20 July 2026'
summary: >-
  Qualified researchers get de-identified trial data for research approved by DIAN-TU, with Industry Collaborators
  able to review requests and manuscripts. Requires IRB or ethics documentation and a Data Use Agreement; no sharing
  with third parties; data destroyed after analysis; every publication or presentation is reviewed and approved by
  DIAN-TU first.
purpose: approved_project
rules:
  commercial_use:
    value: unspecified
    quote: The data will only be used for research purposes, and the recipient will not attempt to identify any
      individual participant.
    note: The policy neither allows nor forbids commercial use. It limits use to research approved by DIAN-TU, and
      Industry Collaborators may review requests that concern their study drug.
  product_validation:
    value: unspecified
    note: The text limits use to research approved by DIAN-TU but does not address testing or validating a product.
  model_training:
    value: unspecified
    note: The policy does not mention machine learning.
  derivatives:
    value: conditional
    quote: Recipients of DIAN-TU data and/or biospecimens agree to only use the data/biospecimens in accordance with
      the ways approved by the DIAN-TU.
    note: Only the analyses approved in the data request. Where sharing the data risks trial integrity, the DIAN-TU
      Biostatistics Core may run the analyses instead of releasing the data.
  publication:
    value: conditional
    quote: All communications must be requested, reviewed, and approved by the DIAN-TU before they are published,
      presented, or appear in public.
    note: Only after DIAN-TU approval, with the required authorship, acknowledgements and data display rules.
  redistribute_original:
    value: 'no'
    quote: No sharing of data or biospecimens with a third party are allowed.
  redistribute_derivatives:
    value: unspecified
    quote: No sharing of data or biospecimens with a third party are allowed.
    note: The policy does not say whether derived data such as labels count as DIAN-TU data.
  share_model_weights:
    value: unspecified
  attribution:
    value: 'yes'
    quote: Manuscripts, abstracts, posters, and lecture presentations must adhere to the acknowledgment requirements
      defined in Section IV Authorship and Citation Policy and the Data Use Agreement, including acknowledgement of
      National Institute on Aging (NIA) of the National Institutes of Health (NIH) support using the NIA-NIH grant
      numbers for the DIAN-TU, the other financial sponsors of the DIAN-TU, and the DIAN-TU Study Team.
  share_alike:
    value: 'no'
  signed_agreement:
    value: 'yes'
    quote: 'Required after approval, but prior to receipt of data and/or biospecimens: a. Fully executed Data Use
      Agreement'
  ethics_approval:
    value: 'yes'
    quote: Provide documentation of Institutional Review Board (IRB) or Ethics Committee (EC) approval valid for the
      analysis of DIAN-TU Trial data or Non-Human Subjects Exemption
    note: An IRB or ethics approval, or an IRB statement that analysing coded data is not human subjects research.
  publication_review:
    value: 'yes'
    quote: Manuscripts must be submitted to the DIAN-TU at least 60* days prior to submission to a journal to allow
      time for review and response to recommended edits.
    note: 90 days for manuscripts with MK-6240 tau PET data. Industry Collaborators review publications that include
      their study drug data.
  code_release:
    value: conditional
    quote: The requestor will provide the statistical code to the DIAN-TU Biostatistics Core for reproducibility
      purposes.
    note: The code goes to the DIAN-TU Biostatistics Core, not to the public.
  return_results:
    value: conditional
    quote: Data generated by recipients of DIAN-TU biospecimens must be provided back to the DIAN- TU to support the
      NIH requirements of reproducibility of findings and to further enhance the DIAN-TU database.
    note: Applies to data generated from biospecimens. Accepted publications must also be sent to DIAN-TU.
  delete_after_use:
    value: 'yes'
    quote: All data provided by the DIAN-TU will be destroyed when analyses are complete.
  no_reidentification:
    value: 'yes'
    quote: The data will only be used for research purposes, and the recipient will not attempt to identify any
      individual participant.
  geographic_restriction:
    value: 'no'
    note: The policy names no countries or regions where the data may be used.
verified:
  date: '2026-10-08'
  by: Spenhouet-agent

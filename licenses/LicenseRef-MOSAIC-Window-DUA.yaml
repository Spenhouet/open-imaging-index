# yaml-language-server: $schema=../schema/license.schema.json
id: LicenseRef-MOSAIC-Window-DUA
name: MOSAIC Window Data Use Agreement
short_name: MOSAIC Window DUA
url: https://www.mosaic-research.com/website-policies/data-use-agreement
version: 'Last updated August 21, 2026'
summary: >-
  Not-for-profit academic research only, for one project approved by the MOSAIC Window Data Access Committee, within
  the applying organisation and its country. No passing the data on, no re-identification, deletion at the end.
  Results must be published, shared results go out under CC BY-NC-SA 4.0, and publications carry a fixed
  acknowledgement.
purpose: noncommercial_research
rules:
  commercial_use:
    value: 'no'
    quote: >-
      (e) DUO:0000046 NCU (non-commercial use only); The use of the MOSAIC Window Resources by Organisation is limited
      to not-for-profit use.
  product_validation:
    value: 'no'
    quote: >-
      “Commercial Use” shall mean any use primarily intended for commercial advantage and/or monetary compensation,
      including without limiting the foregoing any research project conducted for and/or on behalf of an industrial
      and/or commercial third party.
    note: >-
      Validating a company's product would be a project on behalf of a commercial party, which the agreement counts as
      commercial use.
  model_training:
    value: unspecified
    note: The agreement does not mention machine learning. Any training must stay within the approved academic project.
  derivatives:
    value: conditional
    quote: >-
      Any Result obtained by the Organisation using the MOSAIC Window Resources, is and remains owned by the
      Organisation which may use them solely for internal academic research purposes excluding any Commercial Use of
      such Results.
    note: >-
      Results belong to the user, for academic use only. Corrections or improvements of the MOSAIC data itself remain
      Owkin's.
  publication:
    value: 'yes'
    quote: >-
      The Organisation undertakes to publish the Results, and at the latest, following the end of the Project to make
      them available to the scientific community.
    note: Publishing is required, with the fixed acknowledgement, and Owkin gets a copy of every publication.
  redistribute_original:
    value: 'no'
    quote: >-
      duplicating, transferring, distributing or providing MOSAIC Window Resources to a third party, except to third
      parties who need to have access to it for the conduct of the Project and in compliance with Applicable Laws and
      Regulations and the Agreement, as specified in Exhibit 1;
    note: Only third parties named for the approved project may get access.
  redistribute_derivatives:
    value: conditional
    quote: >-
      To disclose such Results and make it available to the scientific community, the Organisation shall use the CC
      BY-NC-SA 4.0 (“Attribution-NonCommercial-ShareAlike 4.0 International”) licence
    note: Results may be shared under CC BY-NC-SA 4.0.
  share_model_weights:
    value: unspecified
    note: >-
      The agreement does not mention models. If trained weights count as Results, they could be shared under CC BY-NC-SA
      4.0 but not sold.
  attribution:
    value: 'yes'
    quote: >-
      In addition, the Organisation must acknowledge the MOSAIC consortium using the following wording: “This study
      makes use of data generated by the MOSAIC consortium (Owkin, Charité – Universitätsmedizin Berlin, Lausanne
      University Hospital - CHUV, Erlangen Hospital, Gustave Roussy Institute, University of Pittsburgh) and made
      available through the MOSAIC Window initiative.
  share_alike:
    value: 'yes'
    quote: >-
      To disclose such Results and make it available to the scientific community, the Organisation shall use the CC
      BY-NC-SA 4.0 (“Attribution-NonCommercial-ShareAlike 4.0 International”) licence
  signed_agreement:
    value: 'yes'
    quote: >-
      The Parties acknowledge that the performance of the Project and the access to the MOSAIC Window Resources cannot
      be granted until the: express approval of the Data Access Committee regarding the Project that the Organisation
      would like to perform; and signature of this Agreement by both Parties.
  ethics_approval:
    value: conditional
    quote: >-
      it has and will maintain the necessary rights, authorisations, statements and consents required and carries out
      the necessary regulatory and ethical procedures required to perform the Project and/or to process the MOSAIC
      Window Resources in accordance with the Applicable Laws and Regulations.
    note: Ethics procedures as required by the law that applies to the project.
  publication_review:
    value: 'no'
    quote: The Organisation shall provide Owkin with a copy of all the publication done on the Project and/or the Results.
    note: Owkin gets a copy of each publication but does not review it beforehand.
  code_release:
    value: 'no'
  return_results:
    value: conditional
    quote: >-
      If for any particular reason, the Organisation is not able to publish its Results, then the Organisation shall
      notify it by writing to Owkin explaining to Owkin the reasons of the impossibility to publish them and a summary
      of the Results which have been obtained.
    note: Only a summary, and only when the results cannot be published.
  delete_after_use:
    value: 'yes'
    quote: >-
      any use of MOSAIC Window Resources by the Organisation shall be terminated and the Organisation shall delete
      MOSAIC Window Resources.
  no_reidentification:
    value: 'yes'
    quote: attempt to re-identify, by any way whatsoever, the data subject from which comes from the MOSAIC Window Data;
  geographic_restriction:
    value: 'yes'
    quote: >-
      “Territory”: shall mean the country(ies) in which the Organisation has its registered office and/or in which the
      Project is conducted.
    note: The licence to use the data is granted in the Territory only.
commercial_license:
  available: unspecified
  note: >-
    The agreement offers no commercial license. Owkin sells access to the full MOSAIC cohort through its K Pro platform,
    under terms it does not publish.
verified:
  date: '2026-10-23'
  by: Spenhouet-agent

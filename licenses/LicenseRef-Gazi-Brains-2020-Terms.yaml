      Except for commercial uses, open-access data is available to researchers/experts within the scope of the original
      license.
  product_validation:
    value: unspecified
    note: The statement excludes commercial use but does not address testing or validating a product.
  model_training:
    value: unspecified
    note: >-
      The statement does not mention model training. The same paper trains and publishes deep learning benchmarks on
      the data.
  derivatives:
    value: unspecified
  publication:
    value: unspecified
  redistribute_original:
    value: unspecified
  redistribute_derivatives:
    value: unspecified
  share_model_weights:
    value: unspecified
  attribution:
    value: unspecified
    note: The statement does not ask for a citation.
  share_alike:
    value: 'no'
  signed_agreement:
    value: 'no'
    note: The statement asks for no agreement. Downloading from Synapse or Kaggle needs a free account.
  ethics_approval:
    value: 'no'
    note: The terms set no such condition. Your institution or local law may still require it for data about people.
  publication_review:
    value: 'no'
  code_release:
    value: 'no'
  return_results:
    value: 'no'
  delete_after_use:
    value: 'no'
  no_reidentification:
    value: 'no'

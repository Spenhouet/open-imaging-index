id: LicenseRef-Gazi-Brains-2020-Terms
name: Gazi Brains 2020 data availability statement (Sagiroglu et al., PeerJ Computer Science 2025)
short_name: Gazi Brains 2020 terms
url: https://doi.org/10.7717/peerj-cs.2920
version: Sagiroglu et al. 2025, section "Benchmark dataset", read 2026-10-12
summary: >-
  Not a formal license. The creators' data descriptor states that the open-access data are available to researchers
  and experts except for commercial use, within the scope of the original license. The Synapse project page states no
  further terms.
purpose: noncommercial
rules:

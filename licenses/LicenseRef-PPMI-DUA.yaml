# yaml-language-server: $schema=../schema/license.schema.json
id: LicenseRef-PPMI-DUA
name: PPMI Data Use Agreement
short_name: PPMI DUA
url: https://www.ppmi-info.org/sites/default/files/docs/ppmi-data-use-agreement.pdf
version: 'Version 5.0, April 2026, with Appendix A on AI tools'
summary: >-
  Access for scientific investigation, teaching or planning clinical research after an online application reviewed
  by the PPMI Data and Publications Committee. No disclosure beyond the approved use, a review of every manuscript
  before submission, a required data acknowledgement, and no IP claims on the data or on inventions arising from it.
  Model training is allowed, but not on third-party AI services that retain inputs.
purpose: research
rules:
  commercial_use:
    value: unspecified
    quote: I request access to data collected by the Parkinson’s Precision Medicine Initiative (PPMI) for the purpose
      of scientific investigation, teaching, or the planning of clinical research studies and agree to the following
      terms
    note: The agreement neither allows nor forbids commercial use. It limits the purpose to research, teaching and
      trial planning, and bars any IP claim on the data or on inventions arising from it.
  product_validation:
    value: unspecified
    note: The text limits use to scientific investigation, teaching or the planning of clinical research studies but
      does not address testing or validating a product.
  model_training:
    value: conditional
    quote: The use of PPMI data in training models is both permitted and encouraged, provided that the process is
      carried out in compliance with the DUA and as outlined above.
    note: Training must not use computational or AI resources of third parties that retain user content or use it to
      train public models; an opt-out from such retention is explicitly not enough.
  derivatives:
    value: 'yes'
    quote: I understand that PPMI study leadership may choose to incorporate raw or derived data into the PPMI
      database.
    note: Analysis and derived data are expected; PPMI may ask for derived data to be submitted back.
  publication:
    value: conditional
    quote: If I seek to publish manuscripts using data from PPMI, I agree to follow the guidelines established and
      written out in the PPMI Publications Policy, including sending manuscripts to the PPMI Data and Publications
      Committee (DPC) for administrative review.
    note: Allowed after the administrative review, with the data acknowledgement and funding text from the Publications
      Policy.
  redistribute_original:
    value: 'no'
    quote: I will not further disclose these data beyond the uses outlined in this agreement and my data use
      application.
  redistribute_derivatives:
    value: conditional
    quote: All participant-level data generated by PPMI can only be distributed via PPMI-approved repository, e.g.,
      LONI.
    note: Participant-level data, even processed or without PPMI subject codes, may only be shared through a
      PPMI-approved repository. Summary results may be published.
  share_model_weights:
    value: conditional
    quote: As such, any model that has been trained using participant-level data may only be shared through
      MJFF-approved methods.
    note: Weights of a model trained on participant-level data cannot be published freely; release needs an MJFF-approved
      route, and users are asked to consider whether the model could reconstruct parts of the data.
  attribution:
    value: 'yes'
    quote: In manuscripts utilizing PPMI data, I will acknowledge the work by PPMI personnel that went into
      accumulating the data, as well as funding of the study in accordance with the guidelines outlined within the
      PPMI Publications Policy.
  share_alike:
    value: 'no'
  signed_agreement:
    value: 'yes'
    quote: Investigators will be asked to sign this agreement electronically at
      https://ida.loni.usc.edu/collaboration/access/appLicense.jsp
  ethics_approval:
    value: conditional
    quote: I will comply with any rules and regulations imposed by my institution and its institutional review board
      in requesting these data.
    note: The agreement does not itself require IRB approval, only compliance with whatever your institution's IRB
      requires.
  publication_review:
    value: 'yes'
    quote: If I seek to publish manuscripts using data from PPMI, I agree to follow the guidelines established and
      written out in the PPMI Publications Policy, including sending manuscripts to the PPMI Data and Publications
      Committee (DPC) for administrative review.
  code_release:
    value: 'no'
  return_results:
    value: conditional
    quote: To promote further scholarly productivity, I acknowledge that PPMI study leadership may request that I
      submit data generated from analyses of PPMI data upon completion of my analyses.
    note: Only on request of PPMI study leadership, and then the user must comply. Users also agree to answer annual requests to update their information, and to try to upload abstracts,
      posters and other non-manuscript outputs to the DPC and to a public platform.
  delete_after_use:
    value: 'no'
  no_reidentification:
    value: 'yes'
    quote: I will receive de-identified data and will not attempt to establish the identity of or attempt to contact
      any of the PPMI subjects.
  geographic_restriction:
    value: 'no'
    note: The agreement names no countries or regions.
verified:
  date: '2026-10-09'
  by: Spenhouet-agent

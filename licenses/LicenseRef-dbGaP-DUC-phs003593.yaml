# yaml-language-server: $schema=../schema/license.schema.json
id: LicenseRef-dbGaP-DUC-phs003593
name: NIH Data Use Certification Agreement for dbGaP study phs003593 (Framingham Heart Study-Cohort Imaging)
short_name: dbGaP DUC phs003593
url: https://dbgap.ncbi.nlm.nih.gov/aa/wga.cgi?view_pdf&stacc=phs003593.v2.p1
version: 'Data Use Certification Agreement ver. January 25, 2025, with the phs003593.v2.p1 study addendum (HMB-IRB-MDS, HMB-IRB-NPU-MDS)'
summary: >-
  NIH controlled-access terms for Framingham Heart Study echocardiogram and CT images on dbGaP. A senior investigator
  and their institution request access for a described health-related project with local IRB approval, renewed
  yearly. Methods development such as software or algorithms is allowed; one consent group is limited to
  not-for-profit organizations. No redistribution, no sale, no re-identification or stigmatizing research, and
  destruction of the data at project close-out.
purpose: approved_project
rules:
  commercial_use:
    value: conditional
    quote: >-
      there is no restriction on development of commercial products resulting from the knowledge gained from the
      research project.
    note: >-
      Applies to consent group 1 (HMB-IRB-MDS). For consent group 2 (HMB-IRB-NPU-MDS) the addendum states "Use of the
      data is limited to not-for-profit organizations." Use must stay within the approved health research project, and
      the data and Data Derivatives "may not be sold to any individual at any point in time for any purpose."
  product_validation:
    value: conditional
    quote: >-
      there is no restriction on development of commercial products resulting from the knowledge gained from the
      research project.
    note: >-
      Only as part of an approved health research project, and only for consent group 1. Consent group 2 is limited to
      not-for-profit organizations.
  model_training:
    value: conditional
    quote: Use of the data includes methods development research (e.g., development of software or algorithms).
    note: From the data use limitation of both consent groups. Training must fall within the approved project and its
      health/medical/biomedical purpose.
  derivatives:
    value: conditional
    quote: >-
      The Requester and Approved Users acknowledge NIH’s expectation that they have reviewed and agree to manage the
      requested controlled-access data and any Data Derivatives according to NIH’s expectations set forth in the
      current NIH Security Best Practices for Users of Controlled-Access Data and the Requester’s IT security
      requirements and policies.
    note: Derived data may be created within the approved project but are bound by the same terms and destroyed at
      close-out.
  publication:
    value: 'yes'
    quote: >-
      Approved Users are strongly encouraged to publish their results in peer-reviewed journals and to present research
      findings at scientific meetings.
  redistribute_original:
    value: 'no'
    quote: >-
      The Requester and Approved Users agree not to distribute controlled-access data and any Data Derivates to any
      entity or individual not identified in the approved request without appropriate written approvals from the NIH.
    note: Collaborators at other institutions need their own approved request.
  redistribute_derivatives:
    value: 'no'
    quote: >-
      The Requester and Approved Users agree not to distribute controlled-access data and any Data Derivates to any
      entity or individual not identified in the approved request without appropriate written approvals from the NIH.
    note: Only with written approval from the NIH.
  share_model_weights:
    value: unspecified
    note: >-
      The agreement does not mention models. Its definition of Data Derivatives ("Data derived from controlled-access
      datasets") may cover them.
  attribution:
    value: 'yes'
    quote: >-
      Please cite/reference the use of dbGaP data by including the dbGaP accession phs000007.v33.p14. Additionally,
      please use the acknowledgement statement in phs000007.v33.p14.
    note: From the study addendum. The agreement also asks to acknowledge the submitting investigators, the funder and
      the repository.
  share_alike:
    value: 'no'
  signed_agreement:
    value: 'yes'
    quote: >-
      A request submitted by a Principal Investigator to a NIH Data Access Committee for access to controlled-access
      data from a NIH-designated data repository. The DAR is signed by the PI requesting the data and their
      Institutional Signing Official.
    note: The principal investigator must be at the level of a tenure-track professor or senior scientist. Access lasts
      one year and must be renewed or closed out. The Data Access Committee is the NHLBI DAC.
  ethics_approval:
    value: 'yes'
    quote: Requestor must provide documentation of local IRB approval.
    note: From the data use limitation of both consent groups. The addendum adds that only full or expedited approvals
      are accepted.
  publication_review:
    value: 'no'
  code_release:
    value: 'no'
  return_results:
    value: conditional
    quote: >-
      In instances where NIH provides written notification that Data Derivatives should be transferred to a NIH
      controlled-access data repository, the transfer must be completed prior to Project Close-out.
    note: Also yearly progress updates listing publications and any intellectual property derived from the data.
  delete_after_use:
    value: 'yes'
    quote: >-
      Upon Project Close-out, the Requester and Approved Users agree to destroy all copies, versions, and Data
      Derivatives of the data retrieved from NIH-designated data repositories
    note: Encrypted copies of the minimum data needed for retention policies or to support published findings may be
      kept.
  no_reidentification:
    value: 'yes'
    quote: >-
      Approved Users agree to make no attempt to identify or contact, either directly or indirectly, individual
      participants or their families.
    note: The addendum also bars investigating pedigree structures or genotypes to identify individuals or families,
      topics that could stigmatize an individual or group, and outcomes not related to health or disease.
  geographic_restriction:
    value: 'yes'
    quote: >-
      As of April 4, 2025, NIH began prohibiting access to and ending any remaining ongoing projects involving NIH
      Controlled-Access Data Repositories (CADRs) and associated data by researchers and institutions located in
      countries of concern.
    source: https://www.cancerimagingarchive.net/nih-controlled-data-access-policy/
    note: The countries named are China (including Hong Kong and Macau), Russia, Iran, North Korea, Cuba and Venezuela.
verified:
  date: '2026-10-12'
  by: Spenhouet-agent

    source: https://fcon_1000.projects.nitrc.org/
  model_training:
    value: unspecified
    note: The terms do not mention machine learning. Any use is limited to non-commercial purposes.
  derivatives:
    value: conditional
    quote: This license lets others remix, tweak, and build upon your work non-commercially, and although their new
      works must also acknowledge you and be non-commercial, they don’t have to license their derivative works on the
      same terms.
    note: Only non-commercially and with credit.
  publication:
    value: unspecified
    note: The terms do not mention publishing results.
  redistribute_original:
    value: unspecified
    note: >-
      The NITRC license description covers building upon the work, not passing on the original data. The INDI page
      requires each user to register before access.
  redistribute_derivatives:
    value: conditional
    quote: This license lets others remix, tweak, and build upon your work non-commercially, and although their new
      works must also acknowledge you and be non-commercial, they don’t have to license their derivative works on the
      same terms.
    note: Derived works must credit the source and be non-commercial.
  share_model_weights:

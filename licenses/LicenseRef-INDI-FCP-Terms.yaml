id: LicenseRef-INDI-FCP-Terms
name: 1000 Functional Connectomes Project / INDI terms (Creative Commons Attribution Non-Commercial, no version stated)
short_name: FCP/INDI terms
url: https://www.nitrc.org/projects/fcon_1000/
version: >-
  License field "Attribution Non-Commercial" on the NITRC fcon_1000 project page (no Creative Commons version named)
  and the access statement on the INDI home page, read 2026-10-08
summary: >-
  Non-commercial use only, after registering with the 1000 Functional Connectomes Project on NITRC. The NITRC project
  lists a Creative Commons Attribution Non-Commercial license without a version: derived works must credit the
  source and stay non-commercial but need not use the same license.
purpose: noncommercial

    quote: This license lets others remix, tweak, and build upon your work non-commercially, and although their new
      works must also acknowledge you and be non-commercial, they don’t have to license their derivative works on the
      same terms.
  share_alike:
    value: 'no'
    quote: This license lets others remix, tweak, and build upon your work non-commercially, and although their new
      works must also acknowledge you and be non-commercial, they don’t have to license their derivative works on the
      same terms.
  signed_agreement:
    value: conditional
    quote: Given the increased amount of information provided in the INDI datasets, we are requiring that individuals
      register with the 1000 Functional Connectomes Project website on NITRC to gain access to the INDI datasets.
    source: https://fcon_1000.projects.nitrc.org/
    note: Registration with NITRC is required. No separate agreement text is published.
  ethics_approval:
    value: 'no'
  publication_review:
    value: 'no'
  code_release:
    value: 'no'
  return_results:

id: glioblastoma-mgmt-multicenter
name: Multi-Institutional Glioblastoma MRI with MGMT (ds007045)
full_name: >-
  Real-world Multi-Institutional Glioblastoma MRI Dataset with Standardized Preprocessing, Expert-Validated
  Segmentation, and MGMT Promoter Profiling
summary: >-
  Preoperative brain MRI (T1w, contrast T1w, T2w, FLAIR) of 363 adults with IDH-wildtype glioblastoma from eight
  hospitals in Italy, Germany, Russia and Spain, with neuroradiologist-checked tumor masks and MGMT promoter
  methylation status for every patient, under CC0.

  url: https://zenodo.org/records/16916830
  note: >-
    One zip archive with a folder per participant holding eleven preprocessed parametric maps (seven NII-derived and
    four DTI-derived) registered to MNI 152 space, plus a spreadsheet of demographics and symptom scores. The raw
    diffusion-weighted images are not part of the release.

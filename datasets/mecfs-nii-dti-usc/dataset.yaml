id: mecfs-nii-dti-usc
name: ME/CFS diffusion neuroinflammation imaging maps (UniSC)
full_name: >-
  Dataset of preprocessed NII- and DTI-derived metrics from patients with ME/CFS and health controls with sedentary
  lifestyles
summary: >-
  Per-subject white matter diffusion MRI maps (neuroinflammation imaging and tensor metrics) of adults with myalgic
  encephalomyelitis/chronic fatigue syndrome (ME/CFS) and matched sedentary controls, shared to replicate a study of
  white matter neuroinflammation and its links to symptoms.

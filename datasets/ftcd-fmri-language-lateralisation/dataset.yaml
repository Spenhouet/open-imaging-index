name: Language lateralisation fMRI and fTCD (ds004073)
full_name: Comparing language lateralisation using fMRI and fTCD
summary: >-
  Task fMRI and structural brain MRI of healthy left- and right-handed adults performing six language tasks, collected
  to test how well laterality indices from functional transcranial Doppler ultrasound (fTCD) agree with fMRI. Two UK
  sites, with fTCD laterality indices per participant.

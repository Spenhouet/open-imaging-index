id: ahead-3-45
name: AHEAD 3-45 screening data
full_name: AHEAD 3-45 Study (A3 and A45 trials of lecanemab in preclinical Alzheimer's disease), screening data
summary: >-
  Screening data of the AHEAD 3-45 lecanemab prevention trials in cognitively unimpaired adults aged 55 to 80: 16,835
  North American screens with amyloid PET imaging and cognitive testing. Post-randomization data are not shared.

id: humanitas-met-pet-lgg
name: Methionine PET in lower-grade glioma (Humanitas)
full_name: >-
  Dataset related to article "Preoperative [11C]methionine PET to personalize treatment decisions in patients with
  lower-grade gliomas"
summary: >-
  Amino acid PET/CT and brain MRI before surgery in adults with newly diagnosed grade 2 or 3 glioma, used to relate
  [11C]methionine uptake to tumour type, tumour extent and progression-free survival. 153 patients from one Italian
  centre. Data on request.

id: speech-noise-aging
name: Brain Aging and Speech Perception in Noise
full_name: >-
  Brain aging and speech perception in noise: effects of background noise and talker variability
summary: >-
  Task fMRI and structural and diffusion MRI of healthy younger and older adults, collected to study how age, background
  noise and talker variability affect syllable discrimination. Scans are not public; group surface maps and task
  stimuli are open under CC BY-NC 4.0.
homepage: https://doi.org/10.5683/SP2/SNW3YO
doi: 10.5683/SP2/SNW3YO
year: 2021
creators:
  - name: Speech Neuroscience Laboratory, CERVO Brain Research Center and Université Laval (Pascale Tremblay)
    url: https://www.speechneurolab.ca
modalities: [MR]
contrasts: [bold, dwi]
anatomy: [brain]
conditions: [healthy]
countries: [CA]
size_gb: 0.25
access:
  type: not_shared
  url: https://doi.org/10.5683/SP2/SNW3YO
  note: >-
    The Borealis deposit (CC BY-NC 4.0) holds the auditory stimuli, the Presentation experiment files, a FreeSurfer
    group average surface of the 32 MRI participants and group-level cortical thickness and BOLD maps in AFNI/SUMA
    surface formats. The deposit states that individual behavioural and MRI data cannot be shared because participants
    did not consent to individual data sharing.
licenses:
  - license: CC-BY-NC-4.0
    applies_to: Stimuli, experiment files and group-level surface maps on Borealis
    url: https://doi.org/10.5683/SP2/SNW3YO
  - license: LicenseRef-No-Published-Terms
    applies_to: Participants' MRI scans, which are not shared
    note: The deposit states that individual data cannot be shared; no terms are given for them.

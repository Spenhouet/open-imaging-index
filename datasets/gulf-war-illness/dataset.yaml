id: gulf-war-illness
name: Gulf War Illness MRI (SFVAMC)
full_name: Gulf War Illness
summary: >-
  Structural brain MRI of US veterans of the 1991 Gulf War with and without Gulf War illness, from a study testing
  whether the illness brings brain changes not explained by post-traumatic stress disorder, alcohol use or depression.
  T1-weighted, proton density and T2-weighted images.

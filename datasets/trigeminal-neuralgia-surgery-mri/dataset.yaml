full_name: >-
  A large-scale dataset of pre- and post-surgical MRI data in patients with chronic trigeminal neuralgia
summary: >-
  Brain MRI with diffusion and resting-state fMRI of patients with primary trigeminal neuralgia and healthy controls,
  collected to find imaging markers of facial pain and of the outcome of microvascular decompression or percutaneous
  surgery, with post-surgical follow-up scans.

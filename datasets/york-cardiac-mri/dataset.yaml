id: york-cardiac-mri
name: York Cardiac MRI Dataset
full_name: York University Cardiac MRI Dataset
summary: >-
  Short-axis cine cardiac MRI of 33 children and adolescents from the Hospital for Sick Children, Toronto, mostly with
  heart abnormalities: 7980 images over 20 frames per subject, with manual LV endocardial and epicardial contours on
  5011 images.
homepage: http://jtl.lassonde.yorku.ca/software/datasets/
doi: 10.1016/j.media.2007.12.003
year: 2008
status: active
creators:
  - name: Alexander Andreopoulos and John K. Tsotsos, York University
    url: http://jtl.lassonde.yorku.ca/
  - name: Department of Diagnostic Imaging, Hospital for Sick Children, Toronto (image data)
species: human
modalities: [MR]
contrasts: [cine]
anatomy: [heart]
conditions: [healthy, arrhythmogenic_right_ventricular_cardiomyopathy, left_ventricular_hypertrophy, myocardial_infarction]
tasks: [segmentation]
formats: [MAT]
countries: [CA]
vendors: [ge]
size_gb: 0.44

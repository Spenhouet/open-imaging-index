    Andreopoulos A, Tsotsos JK. Efficient and Generalizable Statistical Models of Shape and Appearance for Analysis
    of Cardiac MRI. Medical Image Analysis 12(3), 335-357 (2008). doi:10.1016/j.media.2007.12.003
sources:

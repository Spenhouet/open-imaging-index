full_name: The NIMH Healthy Research Volunteer Dataset
summary: >-
  Brain MRI and magnetoencephalography (MEG) of healthy adult volunteers with clinical, cognitive and laboratory
  screening data, collected to characterize a healthy reference cohort for intramural studies of psychiatric illness.
  251 participants have imaging out of 1,859 screened.

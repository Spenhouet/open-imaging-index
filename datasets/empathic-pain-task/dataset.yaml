name: Empathic Pain Task (ds006243)
full_name: 'Empathic Pain Task: fMRI after loving-kindness meditation or muscle relaxation training'
summary: >-
  Preprocessed task fMRI of adults who completed four weeks of loving-kindness meditation or progressive muscle
  relaxation, scanned while they received or watched a partner receive pressure pain, to test how loneliness relates to
  neural empathy. Shared as MNI-space BOLD with event timings.

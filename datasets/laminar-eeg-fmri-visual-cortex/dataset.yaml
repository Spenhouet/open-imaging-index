id: laminar-eeg-fmri-visual-cortex
name: Laminar EEG-fMRI of Visual Features (Clausner et al.)
full_name: >-
  Frequency and Laminar Profile of Feature Specific and nonspecific Neural Activity in Human Visual Cortex Revealed by
  Interleaved EEG-fMRI
summary: >-
  Submillimetre visual cortex fMRI with simultaneous EEG from healthy young adults viewing oriented gratings, collected
  to relate alpha and gamma oscillations to orientation-specific BOLD signals across cortical layers. Includes
  T1-weighted scans and receptive field mapping runs.

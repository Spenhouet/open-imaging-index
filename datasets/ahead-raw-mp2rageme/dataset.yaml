full_name: Quantitative motion-corrected 7T sub-millimeter raw MRI database of the adult lifespan
summary: >-
  Raw multi-coil brain k-space of an ultra-high-field multi-echo MP2RAGE scan in adults across the life span, with
  coil sensitivity maps, for reconstruction and quantitative T1, T2* and susceptibility mapping research. 7 T,
  fat-navigator motion corrected, defaced per coil.

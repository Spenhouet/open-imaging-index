name: Younger and Older Adults Resting-State (ds003871)
full_name: Resting-state for 34 younger and 28 older adults
summary: >-
  Structural brain MRI and resting-state fMRI of healthy younger and older adults, collected to test whether
  default mode network connectivity predicts how well people tell studied objects from similar lures. 62
  participants from Greensboro, North Carolina, in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds003871
doi: 10.18112/openneuro.ds003871.v1.1.0

    url: https://doi.org/10.1016/j.neuroimage.2009.09.043
    kind: paper
  vetsa-researchers-page:
    title: VETSA website, For Researchers page
    url: https://psychiatry.ucsd.edu/research/programs-centers/vetsa/researchers.html
    kind: website
  nacda-38836:

id: derivate-icm
name: DERIVATE-ICM registry
full_name: >-
  CarDiac MagnEtic Resonance for Primary Prevention Implantable CardioVerter DebrillAtor ThErapy (DERIVATE) registry,
  ischemic cardiomyopathy cohort
summary: >-
  Cardiac MRI of patients with ischemic cardiomyopathy and chronic heart failure, collected to test whether MRI
  improves the choice of who should receive a preventive implantable cardioverter-defibrillator compared with
  echocardiography. Multicenter, with arrhythmic outcomes over follow-up. Access restricted.
homepage: https://zenodo.org/records/7978794
doi: 10.5281/zenodo.7978794
# Year the restricted Zenodo record and the paper were published.
year: 2023
creators:
  - name: DERIVATE investigators, Centro Cardiologico Monzino IRCCS
    url: https://clinicaltrials.gov/study/NCT03352648
species: human
modalities: [MR]
contrasts: [cine, lge]
anatomy: [heart]
conditions: [cardiomyopathy, heart_failure]
tasks: [survival]
access:
  type: on_request
  url: https://zenodo.org/records/7978794
  note: >-
    The Zenodo record is restricted and lists no files. It describes its content as raw data related to the article
    and states no access conditions or license; access is at the discretion of the record owners. Whether CMR images
    are part of it is not stated.
licenses:

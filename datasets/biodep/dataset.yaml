    url: https://static-content.springer.com/esm/art%3A10.1038%2Fs41380-021-01272-1/MediaObjects/41380_2021_1272_MOESM1_ESM.pdf
    kind: paper
  schubert2021:
    title: Schubert et al. 2021, Biological Psychiatry Cognitive Neuroscience and Neuroimaging (PMC8264953)
    url: https://doi.org/10.1016/j.bpsc.2020.12.017
    kind: paper
  chamberlain2019:

  text: >-
    Kinahan P, Muzi M, Bialecki B, Herman B, Coombs L. (2019). Data from ACRIN-DSC-MR-Brain [Data set]. The Cancer
    Imaging Archive. https://doi.org/10.7937/tcia.2019.zr1pjf4i. Publication: Boxerman JL, Zhang Z, Safriel Y, et al.
    Early post-bevacizumab progression on contrast-enhanced MRI as a prognostic marker for overall survival in

id: met-pet-dwi-glioma-humanitas
name: 11C-methionine PET and DWI in operated gliomas (Humanitas)
full_name: >-
  Dataset related to article "The role of 11C-methionine PET in patients with negative diffusion-weighted magnetic
  resonance imaging: correlation with histology and molecular biomarkers in operated gliomas"
summary: >-
  Preoperative amino acid PET and diffusion-weighted brain MRI of glioma patients from one Milan-area centre, used to
  compare methionine uptake and diffusion for grading, molecular profiling and progression-free survival against
  histopathology. 124 patients. Access restricted.
homepage: https://zenodo.org/records/4536016
doi: 10.5281/zenodo.4536016
# Year the restricted Zenodo record was published; the article appeared in 2020.
year: 2021
creators:
  - name: Humanitas Clinical and Research Hospital IRCCS
    url: https://zenodo.org/records/4536016
species: human
modalities: [PT, MR]

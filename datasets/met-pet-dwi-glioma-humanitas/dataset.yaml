  url: https://zenodo.org/records/4536016
  note: >-
    The Zenodo record is restricted and lists no files. Access is requested through the record's form; its stated
    condition is that the raw data are accessible on request because they include sensitive data. Whether the record
    holds PET and MR images or only the visual and semiquantitative readings is not stated.

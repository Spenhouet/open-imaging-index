name: Caltech Conte Center (ds003798)
full_name: Caltech Conte Center - A multimodal data resource for exploring social cognition and decision-making
summary: >-
  Structural, resting-state and movie-viewing brain MRI of healthy adults with in-depth psychological testing,
  collected to study how individual differences in brain structure and function relate to social cognition and
  decision-making. Some participants were rescanned over several years.
homepage: https://openneuro.org/datasets/ds003798
doi: 10.18112/openneuro.ds003798.v1.0.5

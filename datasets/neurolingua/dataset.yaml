# yaml-language-server: $schema=../../schema/dataset.schema.json
id: neurolingua
name: NEUROLINGUA (ds007111)
full_name: >-
  NEUROLINGUA: A Neuroimaging Database Tailored to Unraveling the Complexity of Multilingual Comprehension
summary: >-
  Brain fMRI of healthy adults performing a language localizer in Spanish, Basque or English, pooled to study how
  the language comprehension network varies with bilingual and multilingual profiles. Includes structural MRI
  derivatives and sociolinguistic and cognitive measures.
homepage: https://openneuro.org/datasets/ds007111
doi: 10.18112/openneuro.ds007111.v1.1.1
year: 2025
updated: 2026
version: 1.1.1
status: active
creators:
  - name: Basque Center on Cognition, Brain and Language (BCBL), Donostia-San Sebastian (Quiñones I, Carrión-Castillo A, et al.)
    url: https://www.bcbl.eu/DataSharing/Neurolingua/
species: human
modalities: [MR]
contrasts: [bold, T1w]
anatomy: [brain]
conditions: [healthy]
tasks: [normative]
formats: [BIDS, NIfTI]
countries: [ES]
vendors: [siemens]
field_strengths: [3]
size_gb: 252.3
access:
  type: open
  url: https://openneuro.org/datasets/ds007111/versions/1.1.1
  note: >-
    The BOLD runs, events files, stimuli, CAT12 structural derivatives, SPM12 group atlases and phenotype tables are
    an open download on OpenNeuro. The original T1-weighted images are not in the OpenNeuro release; BCBL shares
    them only for justified requests through a web form, after acceptance of a BCBL data use agreement.

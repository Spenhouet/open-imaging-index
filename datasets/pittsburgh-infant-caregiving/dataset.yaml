id: pittsburgh-infant-caregiving
name: Infant caregiving brain MRI (NDA 2340)
full_name: Impact of Maternal Caregiving on Brain-Behavior Relationships in Infants
summary: >-
  Brain MRI of 3-month-old infants scanned in natural sleep, with mother questionnaires and observed caregiving,
  collected to relate early emotion circuitry to infant emotional behavior at 3 and 9 months and to maternal
  caregiving. Infants of young mothers from the Pittsburgh Girls Study.
homepage: https://nda.nih.gov/edit_collection.html?id=2340
doi: 10.15154/ccnw-sq97
year: 2019
status: active

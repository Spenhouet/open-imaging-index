# yaml-language-server: $schema=../../schema/dataset.schema.json
id: j-adni
name: J-ADNI
full_name: Japanese Alzheimer's Disease Neuroimaging Initiative
summary: >-
  Japanese multicentre longitudinal study of 537 older adults with normal cognition, late amnestic MCI or mild
  Alzheimer's dementia, with structural MRI (1.5 T and 3 T), FDG and amyloid PET (PiB or BF-227), CSF, blood and cognitive data, run with
  protocols harmonised to ADNI.
homepage: https://humandbs.dbcls.jp/en/hum0043-latest
# Year of the first release on the NBDC Human Database (hum0043-v1, 29 January 2016).
year: 2016
status: active
creators:
  - name: J-ADNI study group (PI Takeshi Iwatsubo, University of Tokyo)
    url: https://humandbs.dbcls.jp/en/hum0043-latest
species: human
modalities: [MR, PT]
contrasts: [T1w]
tracers: [fdg, pib, bf227]
anatomy: [brain]
conditions: [healthy, mci, alzheimers]
tasks: [classification, regression, longitudinal]
formats: [NIfTI, ANALYZE]
countries: [JP]
vendors: [ge, philips, siemens]
field_strengths: [1.5, 3]
size_gb: 310
access:
  type: application
  url: https://humandbs.dbcls.jp/en/dataset/JGAD000051
licenses:
  - license: LicenseRef-NBDC-Controlled-Access
    note: Dataset JGAD000051 is controlled-access with Type I (standard) security.
citation:
  text: >-
    State the dataset accession number (JGAD000051) and acknowledge the J-ADNI project and the NBDC Human Database as
    the NBDC guidelines require. Cohort reference: Iwatsubo T, et al. Japanese and North American Alzheimer's Disease
    Neuroimaging Initiative studies: Harmonization for international trials. Alzheimer's & Dementia 14(8):1077-1087
    (2018). doi:10.1016/j.jalz.2018.03.009

name: Social Media Addiction Time Perception fMRI
full_name: Neural mechanisms of aberrant time perception in individuals with social media addiction
summary: >-
  Task fMRI of adults with social media addiction and healthy controls judging time intervals, collected to study how
  time perception and its brain basis differ in this group. Raw images are not shared; per-subject t maps are public.

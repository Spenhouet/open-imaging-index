id: bean-gonogo-fmri
name: BEAN Go/No-Go fMRI
full_name: 'Psychosocial adversity and inhibitory control: an fMRI study of children growing up in extreme poverty'
summary: >-
  Brain MRI and Go/No-Go task fMRI of young children from a low-income neighbourhood of Dhaka, Bangladesh, collected to
  study how psychosocial adversity relates to the neural basis of inhibitory control. Includes adversity and maternal
  mental health scores.
homepage: https://openneuro.org/datasets/ds005504
doi: 10.18112/openneuro.ds005504.v1.1.0

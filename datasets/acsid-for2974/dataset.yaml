id: acsid-for2974
name: ACSID (FOR2974)
full_name: 'FOR2974: Affective and cognitive mechanisms of specific Internet-use disorders (ACSID)'
summary: >-
  German multi-site DFG research unit on gaming, pornography, buying-shopping and social-networks use disorders. Some
  subprojects add task fMRI, e.g. an appetitive conditioning and extinction study in 83 men on 3 T Siemens MRI.
  Images are not public; data on request.
homepage: https://osf.io/n5cd7/
# The imaging data have no public release; year of the first paper found that reports fMRI data of the research unit.
year: 2024
status: active

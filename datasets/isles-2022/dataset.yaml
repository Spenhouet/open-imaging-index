    url: https://zenodo.org/records/7960856
    kind: data
  zenodo-7960856-center-ids:
    title: center_ids.xlsx from Zenodo record 7960856 (CC BY 4.0), rows counted per value of the center column
    url: https://zenodo.org/records/7960856/files/center_ids.xlsx
    kind: computed

id: cephalonauts-one
name: Cephalonauts One
full_name: 'Cephalonauts One: a deep fMRI dataset for decoding naturalistic speech in the human brain'
summary: >-
  Brain fMRI of healthy adults listening to French podcasts for about 30 hours each, recorded to train and benchmark
  models that decode heard speech from brain activity. 3 native French speakers, 72 sessions and 358 runs at 3 T, with
  time-aligned transcripts and audio and text features.
homepage: https://karavela.ai/en/research/cephalonauts-one

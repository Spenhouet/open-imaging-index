id: openneuro-ds007907
name: Skull Bone Marrow TSPO PET in Chronic Pain (ds007907)
full_name: Elevated translocator protein in skull bone marrow is linked to human chronic pain
summary: >-
  Head PET of the immune marker translocator protein (TSPO) and T1-weighted brain MRI of people with chronic low back
  pain or knee osteoarthritis and healthy controls, collected to study immune activation in skull bone marrow in
  chronic pain. Includes skull masks and SUV maps.
homepage: https://openneuro.org/datasets/ds007907

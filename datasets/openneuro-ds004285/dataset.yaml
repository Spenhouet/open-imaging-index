id: openneuro-ds004285
name: Motion feedback word repetition fMRI (ds004285)
full_name: Listening task
summary: >-
  Task fMRI with T1- and T2-weighted brain MRI of young and older adults who repeated spoken words heard in noise,
  collected to test whether real-time head motion feedback reduces motion. 78 participants from St. Louis at 3T, in BIDS
  under CC0.
homepage: https://openneuro.org/datasets/ds004285
doi: 10.18112/openneuro.ds004285.v1.0.0

    van der Plas MC, Koemans EA, Schipper MR, et al. One-Year Radiologic Progression in Sporadic and Hereditary
    Cerebral Amyloid Angiopathy. Neurology 104(9) (2025). doi:10.1212/WNL.0000000000213546

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: focas
name: FOCAS (Leiden sporadic CAA cohort)
full_name: The Follow-up in sporadic Cerebral Amyloid Angiopathy Study (FOCAS), Leiden University Medical Center
summary: >-
  Prospective Leiden cohort of 126 participants with sporadic cerebral amyloid angiopathy seen at yearly research visits
  with 3 T SWI brain MRI, 7 T MRI, CSF and clinical follow-up, including semi-automatic siderosis masks for a small
  subset. Data on request from the authors.
homepage: https://www.lumc.nl/patientenzorg/meedoen-aan-wetenschappelijk-onderzoek/focas/
# Start of the study (February 2018); the data have not been publicly released.
year: 2018
creators:
  - name: Departments of Neurology and Radiology, Leiden University Medical Center
    url: https://www.lumc.nl/
species: human
modalities: [MR]
contrasts: [swi, T1w, T2w, bold]
anatomy: [brain]
conditions: [cerebral_amyloid_angiopathy, cerebral_microbleeds, superficial_siderosis, intracerebral_hemorrhage]
tasks: [longitudinal, segmentation]
countries: [NL]
vendors: [philips]
field_strengths: [3, 7]
access:
  type: on_request
  url: https://doi.org/10.1212/WNL.0000000000213546
  note: >-
    Papers from the cohort state that the data are available from the corresponding author on (reasonable) request.
    No access procedure or terms are published.
licenses:
  - license: LicenseRef-No-Published-Terms
citation:

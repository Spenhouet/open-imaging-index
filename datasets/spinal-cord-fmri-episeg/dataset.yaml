id: spinal-cord-fmri-episeg
name: Spinal Cord fMRI Segmentation Database (ds005143)
full_name: Spinal Cord fMRI Segmentation Database (Multi-subject)
summary: >-
  Mean functional MRI images of the spinal cord from healthy adults and people with cervical myelopathy or
  fibromyalgia, shared with spinal cord masks to train automatic cord segmentation on fMRI. Multi-site, two vendors,
  in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds005143
doi: 10.18112/openneuro.ds005143.v1.3.1

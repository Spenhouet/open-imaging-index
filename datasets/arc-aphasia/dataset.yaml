id: arc-aphasia
name: Aphasia Recovery Cohort (ARC)
full_name: Aphasia Recovery Cohort (ARC) Dataset
summary: >-
  Longitudinal brain MRI of chronic left-hemisphere stroke survivors with aphasia, pooled from treatment and recovery
  studies to support lesion mapping and prediction of language impairment, with structural, diffusion, resting-state
  and naming-task scans, expert lesion masks and aphasia test scores.
homepage: https://openneuro.org/datasets/ds004884
doi: 10.18112/openneuro.ds004884.v1.0.2

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: breast-mri-nact-pilot
name: Breast-MRI-NACT-Pilot
full_name: >-
  Single site breast DCE-MRI data and segmentations from patients undergoing neoadjuvant chemotherapy
  (Breast-MRI-NACT-Pilot)
summary: >-
  Longitudinal 1.5 T sagittal breast DCE-MRI of 64 women with stage II or III breast cancer, scanned up to four times
  during neoadjuvant chemotherapy at UCSF, with threshold-based tumor and breast tissue segmentations, SER maps and
  recurrence-free survival data.
homepage: https://www.cancerimagingarchive.net/collection/breast-mri-nact-pilot/
doi: 10.7937/K9/TCIA.2016.QHsyhJKy

full_name: 'TractoInferno: A large-scale, open-source, multi-site database for machine learning dMRI tractography'
summary: >-
  Processed brain MRI of 284 healthy adults from six 3T sites: T1w, single-shell diffusion, DTI maps, fODFs, tissue
  masks and reference tractograms of 30 white matter bundles, split for training and benchmarking machine learning
  tractography. CC0 on OpenNeuro.

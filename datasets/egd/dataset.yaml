    Bent MJ, French PJ, Klein S, Smits M. The Erasmus Glioma Database (EGD): Structural MRI scans, WHO 2016 subtypes,
    and segmentations of 774 patients with glioma. Data in Brief 37, 107191 (2021).
    https://doi.org/10.1016/j.dib.2021.107191

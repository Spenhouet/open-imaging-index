id: lge-cmr-dose-san-donato
name: LGE gadobutrol dose CMR in chronic MI (San Donato)
full_name: >-
  Image quality of late gadolinium enhancement in cardiac magnetic resonance with different doses of contrast material
  in patients with chronic myocardial infarction
summary: >-
  Cardiac MRI with cine and late gadolinium enhancement of 79 patients with chronic transmural myocardial infarction,
  scanned after 0.10, 0.15 or 0.20 mmol/kg gadobutrol, with scar segmentation and SNR/CNR measures. One Italian centre.
  Access on request.

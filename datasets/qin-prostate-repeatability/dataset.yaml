name: QIN-PROSTATE-Repeatability
summary: >-
  Test-retest multiparametric prostate MRI of 15 men with confirmed or suspected prostate cancer, scanned twice within
  2 weeks at 3 T, with manual segmentations of gland, peripheral zone and suspected tumor and volume and ADC
  measurements, all as DICOM.

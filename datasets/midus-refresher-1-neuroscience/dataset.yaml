id: midus-refresher-1-neuroscience
name: MIDUS Refresher 1 Neuroscience
full_name: 'Midlife in the United States (MIDUS Refresher 1): Neuroscience Project, 2012-2016'
summary: >-
  Brain MRI of US adults from the MIDUS Refresher cohort, collected to study individual differences in emotional
  reactivity and regulation and their links to health. 138 participants; T1w, task and resting-state fMRI, diffusion
  and ASL in BIDS. Raw images by application.
homepage: https://midus.wisc.edu/midus-neuroscience-repository/
doi: 10.3886/ICPSR37094
# Year the ICPSR study (summary and behavioral variables, no images) was issued. The release date of the raw imaging
# data on the restricted repository is not published.
year: 2018
status: active

    kind: website
  github-gbm-dir-qa:
    title: GBM-DIR-QA GitHub repository README (dataset guidance)
    url: https://github.com/deshanyang/GBM-DIR-QA
    kind: website
related: []
keywords:
  [deformable image registration, landmark pairs, vessel bifurcation, longitudinal glioblastoma, tumor recurrence]

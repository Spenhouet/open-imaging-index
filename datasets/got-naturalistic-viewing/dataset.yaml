id: got-naturalistic-viewing
name: Game of Thrones naturalistic viewing
full_name: Game of Thrones - A naturalistic viewing dataset
summary: >-
  Brain fMRI of adults with developmental prosopagnosia (face blindness) and healthy controls watching Game of Thrones
  clips, collected to study how familiarity with people and places shapes brain responses. Includes a face and scene
  localiser, T1w anatomy and fieldmaps.
homepage: https://openneuro.org/datasets/ds004848
doi: 10.18112/openneuro.ds004848.v1.0.1

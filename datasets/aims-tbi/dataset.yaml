# yaml-language-server: $schema=../../schema/dataset.schema.json
id: aims-tbi
name: AIMS-TBI
full_name: Automated Identification of Moderate-Severe Traumatic Brain Injury Lesions (AIMS-TBI) challenge dataset
summary: >-
  MICCAI challenge data from the ENIGMA paediatric and adult moderate-severe TBI working groups: 892 defaced
  T1-weighted brain MRI scans from 13 sites (2025 release) with manual binary lesion masks, shared after signing a
  University of Utah data use agreement.
homepage: https://aims-tbi26.grand-challenge.org/
doi: 10.5281/zenodo.19731996
# The first edition ran at MICCAI 2024. The 2025 data were reused in 2026 with extra training modalities.
year: 2024
updated: 2026
version: '2025 dataset (reused for the 2026 challenge)'
creators:
  - name: University of Utah (Emily Dennis, Elisabeth Wilde and colleagues)
    url: https://aims-tbi26.grand-challenge.org/
  - name: ENIGMA Consortium, Pediatric and Adult Moderate-Severe TBI working groups
modalities: [MR]
contrasts: [T1w]
anatomy: [brain]
conditions: [traumatic_brain_injury]
tasks: [segmentation, detection]
vendors: [ge, siemens, philips]
field_strengths: [1.5, 3]
access:
  type: signed_agreement
  url: https://aims-tbi26.grand-challenge.org/
licenses:
  - license: LicenseRef-AIMS-TBI-DUA
    applies_to: All challenge data (T1w MRI, lesion masks and demographics), under the agreement signed in the data
      access form.
  - license: CC-BY-NC-ND-4.0
    applies_to: All challenge data, as declared in the "Data usage agreement" section of the 2026 challenge design
      document. The document says "CC BY-NC-ND" without a version.
citation:
  text: >-
    Deutscher E, Tustison N, Onicas A, Wilde EA, Pease MW, Bakas S, Dennis EL. Automated Identification of
    Moderate-to-Severe Traumatic Brain Injury Lesions (AIMS-TBI) 2025 MICCAI Challenge. Lecture Notes in Computer
    Science, Springer (2026). doi:10.1007/978-3-032-16370-7_24
sources:
  aims-tbi-design-2026:
    title: Dennis et al. 2026, AIMS-TBI structured challenge design document (Zenodo, CC BY 4.0)
    url: https://doi.org/10.5281/zenodo.19731996
    kind: paper
  aims-tbi25-site:
    title: AIMS-TBI 2025 challenge website (grand-challenge.org)
    url: https://aims-tbi25.grand-challenge.org/
    kind: website
related: []
keywords: [traumatic brain injury, lesion segmentation, MICCAI challenge, ENIGMA, T1-weighted MRI]
verified:
  date: '2026-10-08'
  by: Spenhouet-agent

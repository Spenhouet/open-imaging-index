id: opal
name: OPAL
full_name: OPAL – The Oxygen-15 PET/MR Cerebral Perfusion Atlas
summary: >-
  Brain perfusion imaging on a simultaneous PET/MRI system with oxygen-15 water in healthy controls and Moyamoya
  patients, shared to develop and test non-invasive perfusion methods. 120 participants with PET CBF maps, ASL, DSC
  and diffusion MRI around acetazolamide. Non-commercial research use.
homepage: https://stanford.redivis.com/datasets/2mah-d6525pvn2
doi: 10.57761/2g6b-bm61
year: 2026
version: '1.0'
status: active

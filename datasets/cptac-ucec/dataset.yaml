# yaml-language-server: $schema=../../schema/dataset.schema.json
id: cptac-ucec
name: CPTAC-UCEC
full_name: >-
  The Clinical Proteomic Tumor Analysis Consortium Uterine Corpus Endometrial Carcinoma Collection (CPTAC-UCEC)
summary: >-
  Standard-of-care CT, MRI, PET and ultrasound of 90 patients and whole-slide pathology images of 250 patients from the
  NCI CPTAC uterine corpus endometrial carcinoma cohort, linked by patient ID to proteomic, genomic and clinical data.
homepage: https://www.cancerimagingarchive.net/collection/cptac-ucec/
doi: 10.7937/k9/tcia.2018.3r3juisw
year: 2018
updated: 2025
version: '13'
status: active
creators:
  - name: National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)
    url: https://proteomics.cancer.gov/programs/cptac
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [CT, MR, PT, US, SM]
anatomy: [uterus]
conditions: [endometrial_carcinoma]
formats: [DICOM, SVS]
size_gb: 234.24
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/cptac-ucec/
  note: >-
    DICOM radiology is downloaded with the TCIA Data Retriever from a manifest file, slides through IBM Aspera. No
    account is needed. Clinical, proteomic and genomic data are in the Proteomic and Genomic Data Commons.
licenses:
  - license: CC-BY-4.0
    url: https://www.cancerimagingarchive.net/collection/cptac-ucec/
citation:
  text: >-
    National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC). (2019). The Clinical Proteomic
    Tumor Analysis Consortium Uterine Corpus Endometrial Carcinoma Collection (CPTAC-UCEC) (Version 13) [dataset]. The
    Cancer Imaging Archive. https://doi.org/10.7937/k9/tcia.2018.3r3juisw. Acknowledgement: "Data used in this
    publication were generated by the National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)."
sources:
  tcia-cptac-ucec:
    title: TCIA CPTAC-UCEC collection page (version 13, updated 2025/04/15)
    url: https://www.cancerimagingarchive.net/collection/cptac-ucec/
    kind: website
  tcia-api-cptac-ucec-series:
    title: >-
      TCIA public NBIA API, series list of CPTAC-UCEC (open, no login, CC BY 4.0), RTSTRUCT series excluded so the
      totals match version 13 (1,959 series, 187,026 images)
    url: https://services.cancerimagingarchive.net/nbia-api/services/v1/getSeries?Collection=CPTAC-UCEC&format=json
    kind: computed
  tcia-api-cptac-ucec-patients:
    title: TCIA public NBIA API, patient list of CPTAC-UCEC (open, no login), counted per PatientSex
    url: https://services.cancerimagingarchive.net/nbia-api/services/v1/getPatient?Collection=CPTAC-UCEC&format=json
    kind: computed
keywords: [endometrial cancer, uterine cancer, proteogenomics, radiogenomics, CPTAC, whole-slide imaging]
verified:
  date: '2026-10-09'
  by: Spenhouet-agent

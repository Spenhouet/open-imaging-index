full_name: 'OASIS-1: Cross-Sectional MRI Data in Young, Middle Aged, Nondemented and Demented Older Adults'
summary: >-
  Cross-sectional T1-weighted brain MRI of 416 right-handed adults aged 18 to 96, 100 of them with very mild to
  moderate Alzheimer's disease, with 3 or 4 repeated scans per session, averaged and atlas-registered images and
  tissue segmentations.

      Baby Open Brains team, University of Minnesota and collaborators (Feczko E, Stoyell SM, et al.; Fair DA, Elison
      JT)
    url: https://bobsrepository.readthedocs.io/
species: human
modalities: [MR]
contrasts: [T1w, T2w]
anatomy: [brain]
conditions: [healthy]
tasks: [segmentation, longitudinal]
formats: [BIDS, NIfTI]
countries: [US]
vendors: [siemens]

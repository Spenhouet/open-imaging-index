# yaml-language-server: $schema=../../schema/dataset.schema.json
id: bobs-repo
name: BOBs Repository (ds005450)
full_name: 'Baby Open Brains: An open-source repository of infant brain segmentations'
summary: >-
  Brain MRI of healthy infants with manually corrected whole-brain tissue and subcortical segmentations, made as a
  benchmark and training set for infant segmentation pipelines. T1w and T2w from 71 visits of 51 Baby Connectome
  Project infants aged 1 to 9 months.
homepage: https://bobsrepository.readthedocs.io/
doi: 10.17605/OSF.IO/WDR78
# First OpenNeuro snapshot (0.9.0) is dated 2025-03-12.

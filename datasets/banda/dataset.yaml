  - name: >-
      BANDA consortium (Massachusetts Institute of Technology, Massachusetts General Hospital and Martinos Center,
      McLean Hospital, Boston University) with the Connectome Coordination Facility
    url: https://www.humanconnectome.org/study/connectomes-related-anxiety-depression
species: human

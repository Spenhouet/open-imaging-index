licenses:
  - license: LicenseRef-NDA-Data-Use-Terms
    note: >-
      BANDA is NIMH Data Archive collection 3037, released as part of the Connectomes Related to Human Disease featured
      datasets. The BANDA data use terms page points to the NDA Data Use Certification; access is valid for one year
      and must be renewed. Study-specific clauses of the permission group are not broken down here.

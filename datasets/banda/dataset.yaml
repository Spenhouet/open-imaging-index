id: banda
name: BANDA
full_name: Boston Adolescent Neuroimaging of Depression & Anxiety (BANDA)
summary: >-
  Brain MRI with clinical and cognitive measures from adolescents aged 14 to 17 with anxiety and/or depression and
  typical peers, a Human Connectome Project study of how these disorders develop. 215 adolescents, 207 with
  structural, resting, task and diffusion MRI.
homepage: https://www.humanconnectome.org/study/connectomes-related-anxiety-depression
doi: 10.15154/3tk5-pb47
year: 2023
updated: 2024
version: Release 1.1 (4 March 2024)
status: active

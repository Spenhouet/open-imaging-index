id: abide-i
name: ABIDE I
full_name: Autism Brain Imaging Data Exchange I
summary: >-
  Resting-state fMRI and T1-weighted MRI with phenotypic data for 1,112 people (539 with autism spectrum disorder,
  573 typical controls, ages 7 to 64) pooled from 17 sites in the US and Europe.
homepage: https://fcon_1000.projects.nitrc.org/indi/abide/abide_I.html
year: 2012
status: active
creators:
  - name: ABIDE consortium (founders Adriana Di Martino and Stewart Mostofsky)
    url: https://fcon_1000.projects.nitrc.org/indi/abide/
  - name: 1000 Functional Connectomes Project / International Neuroimaging Data-sharing Initiative (INDI)
    url: https://fcon_1000.projects.nitrc.org/
species: human
modalities: [MR]
contrasts: [T1w, bold]
anatomy: [brain]
conditions: [autism, healthy]
tasks: [classification]
formats: [NIfTI]
countries: [US, BE, DE, IE]
vendors: [siemens, philips, ge]
access:
  type: registration
  url: https://fcon_1000.projects.nitrc.org/indi/abide/abide_I.html
licenses:
  - license: CC-BY-NC-SA-3.0
    note: >-
      The ABIDE page states that usage is unrestricted for non-commercial research, asks users to name the datasets
      used and acknowledge their funding, and requires registration with NITRC and INDI before download.
citation:
  text: >-
    Di Martino A, Yan CG, Li Q, et al. The autism brain imaging data exchange: towards a large-scale evaluation of the
    intrinsic brain architecture in autism. Molecular Psychiatry 19(6):659-667 (2014). doi:10.1038/mp.2013.78

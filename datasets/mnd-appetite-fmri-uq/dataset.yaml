id: mnd-appetite-fmri-uq
name: MND appetite fMRI (ds005874)
full_name: An fMRI Dataset for Appetite Neural Correlates in People Living with Motor Neuron Disease
summary: >-
  Brain MRI and task and resting-state fMRI of people with motor neuron disease and non-neurodegenerative controls,
  scanned fasted and again after a liquid meal while viewing food and non-food pictures, to study how the disease
  alters brain responses linked to appetite.

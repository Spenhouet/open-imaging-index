  NIMH Data Archive collection of NIH intramural MRI releases with 447 shared subjects: 3T T1-weighted scans of 440
  psychiatrically healthy children and adults from nuclear families (NIMH NHGRI data-sharing project) plus densely
  sampled single-subject task fMRI at 3T and 7T.

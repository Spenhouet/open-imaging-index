id: pupil-arousal-rest-fmri
name: Pupil and Resting-State fMRI (Lloyd et al.)
full_name: Pupil size reflects activation of subcortical ascending arousal system nuclei during rest
summary: >-
  Resting-state fMRI with simultaneous pupil recordings from healthy young adults, collected to test whether
  spontaneous changes in pupil size track activity in brainstem and basal forebrain arousal nuclei such as the locus
  coeruleus. Includes T1-weighted and neuromelanin-sensitive scans.
homepage: https://doi.org/10.5061/dryad.7m0cfxpzn
doi: 10.5061/dryad.7m0cfxpzn

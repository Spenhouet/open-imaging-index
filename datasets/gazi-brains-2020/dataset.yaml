id: gazi-brains-2020
name: Gazi Brains 2020
full_name: Gazi Brains 2020 Dataset (Turkish Brain Project)
summary: >-
  Brain MRI of adults with high-grade glioma and of people without a brain tumor, built as a benchmark for tumor
  detection, classification and segmentation, with expert labels for tumor components, anatomy and non-tumoral
  findings. 100 subjects from 24 Turkish institutions.
homepage: https://www.synapse.org/#!Synapse:syn22159468
doi: 10.7303/syn22159468
# The Synapse project was created in June 2020; the image folder on Synapse was uploaded in June 2021.
year: 2021
# Kaggle copy, version 2, last updated June 2024.
updated: 2024
status: active
creators:
  - name: Gazi University (Faculty of Medicine and Department of Computer Engineering), Turkish Brain Project
    url: https://cbddo.gov.tr/en/projects/turkish-brain-project
species: human
modalities: [MR]
contrasts: [FLAIR, T1w, T1w_ce, T2w]
anatomy: [brain]
conditions: [glioma, healthy]
tasks: [segmentation, classification, detection]
formats: [BIDS, NIfTI]
countries: [TR]
field_strengths: [1.5, 3]
size_gb: 10.5

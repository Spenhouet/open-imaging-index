id: tcga-kich
name: TCGA-KICH
full_name: The Cancer Genome Atlas Kidney Chromophobe Collection (TCGA-KICH)
summary: >-
  Pre-surgical clinical CT and MRI of 15 patients with chromophobe renal cell carcinoma from The Cancer Genome Atlas,
  whose patient IDs match the TCGA clinical, genomic and histopathology data for radiogenomic research.
homepage: https://www.cancerimagingarchive.net/collection/tcga-kich/
doi: 10.7937/K9/TCIA.2016.YU3RBCZN
year: 2014
updated: 2020
version: '3'
status: active
creators:
  - name: National Cancer Institute Urologic Oncology Branch and Brigham and Women's Hospital
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [CT, MR]
anatomy: [kidney]
conditions: [chromophobe_renal_cell_carcinoma]
formats: [DICOM]
countries: [US]
size_gb: 4.56
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/tcga-kich/
  note: >-
    Images download with the TCIA Data Retriever or from the NCI Imaging Data Commons. Clinical, genomic and
    histopathology data for the same patient IDs are in the NCI Genomic Data Commons project TCGA-KICH.
licenses:
  - license: CC-BY-3.0
    applies_to: All CT and MR images (15 subjects, 15 studies, 109 series).

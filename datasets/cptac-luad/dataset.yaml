# yaml-language-server: $schema=../../schema/dataset.schema.json
id: cptac-luad
name: CPTAC-LUAD
full_name: The Clinical Proteomic Tumor Analysis Consortium Lung Adenocarcinoma Collection (CPTAC-LUAD)
summary: >-
  Standard-of-care CT, PET and MRI and whole-slide pathology images of 244 patients from the NCI CPTAC lung
  adenocarcinoma cohort, linked by patient ID to proteomic, genomic and clinical data in the NCI data commons.
homepage: https://www.cancerimagingarchive.net/collection/cptac-luad/
doi: 10.7937/k9/tcia.2018.pat12tbs
year: 2018
updated: 2025
version: '13'
status: active
creators:
  - name: National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)
    url: https://proteomics.cancer.gov/programs/cptac
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [CT, PT, MR, SM]
anatomy: [lung]
conditions: [nsclc]
formats: [DICOM, SVS]
vendors: [siemens, ge, philips, hitachi]
size_gb: 476.82
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/cptac-luad/
  note: >-
    DICOM radiology is downloaded with the TCIA Data Retriever from a manifest file, slides through IBM Aspera. No
    account is needed. Clinical, proteomic and genomic data are in the Proteomic and Genomic Data Commons.
licenses:
  - license: CC-BY-4.0
    url: https://www.cancerimagingarchive.net/collection/cptac-luad/
citation:
  text: >-
    National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC). (2018). The Clinical Proteomic
    Tumor Analysis Consortium Lung Adenocarcinoma Collection (CPTAC-LUAD) (Version 13) [dataset]. The Cancer Imaging
    Archive. https://doi.org/10.7937/k9/tcia.2018.pat12tbs. Acknowledgement: "Data used in this publication were
    generated by the National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)."
sources:
  tcia-cptac-luad:
    title: TCIA CPTAC-LUAD collection page (version 13, updated 2025/08/01)
    url: https://www.cancerimagingarchive.net/collection/cptac-luad/
    kind: website
  tcia-cptac-luad-digest:
    title: >-
      TCIA CPTAC-LUAD radiology metadata digest (TCIA-CPTAC-LUAD_v13_20250801-nbia-digest.xlsx, open download),
      counted per unique Patient ID
    url: https://www.cancerimagingarchive.net/wp-content/uploads/TCIA-CPTAC-LUAD_v13_20250801-nbia-digest.xlsx
    kind: computed
keywords: [lung adenocarcinoma, proteogenomics, radiogenomics, CPTAC, whole-slide imaging]
verified:
  date: '2026-10-09'
  by: Spenhouet-agent

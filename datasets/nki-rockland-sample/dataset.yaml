id: nki-rockland-sample
name: NKI-Rockland Sample (pilot, Phase I)
full_name: Nathan Kline Institute (NKI) / Rockland Sample
summary: >-
  Pilot phase of the NKI-Rockland Sample: resting-state fMRI, diffusion MRI and MPRAGE scans of a lifespan community
  convenience sample from Rockland County, New York, with psychiatric, cognitive and behavioral assessments, shared
  weekly through INDI in 2010 and 2011.

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: gusto
name: GUSTO
full_name: Growing Up in Singapore Towards healthy Outcomes (GUSTO) birth cohort
summary: >-
  Singapore mother-offspring birth cohort of Chinese, Malay and Indian families recruited in pregnancy in 2009 and 2010,
  with neonatal brain MRI (T2w, DTI at 1.5 T) and repeated child brain MRI (T1w, resting-state fMRI at 3 T) from 4.5 to
  10.5 years. Data are shared through collaboration with the cohort investigators.
homepage: https://gusto.sg/
doi: 10.1093/ije/dyt125
# No dated public release was found; year of the online publication of the cohort profile (August 2013).
year: 2013
status: active
creators:
  - name: GUSTO Study Group (National University of Singapore, KK Women's and Children's Hospital, A*STAR)
    url: https://gusto.sg/about/
species: human
modalities: [MR]
contrasts: [T2w, dwi, T1w, bold]
anatomy: [brain]
tasks: [longitudinal, regression]
countries: [SG]
vendors: [ge, siemens]
field_strengths: [1.5, 3]
access:
  type: application
  url: https://gusto.sg/request-to-collaborate/
  note: >-
    Researchers who want data or biospecimens fill in an expression-of-interest form and must discuss the project and
    reach an agreement with a GUSTO investigator. The collaboration guidelines and the data catalogue are hosted on
    gustodatavault.sg.
licenses:
  - license: LicenseRef-No-Published-Terms
    note: >-
      The request page names collaboration guidelines and an agreement with the investigators, but no license or data
      use terms could be read: the guidelines on gustodatavault.sg sit behind a bot check that blocked every attempt
      to open them. The imaging papers state that the authors do not have permission to share the data.
citation:

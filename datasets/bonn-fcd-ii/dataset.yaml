id: bonn-fcd-ii
name: Bonn FCD Type II Presurgery MRI (ds004199)
full_name: An open presurgery MRI dataset of people with epilepsy and focal cortical dysplasia type II
summary: >-
  Presurgical brain MRI of people with epilepsy caused by focal cortical dysplasia (FCD) type II and of healthy
  controls, released as an external benchmark for automated FCD detection. T1-weighted and FLAIR images with manual
  lesion masks and clinical features.
homepage: https://openneuro.org/datasets/ds004199
doi: 10.18112/openneuro.ds004199.v1.0.6

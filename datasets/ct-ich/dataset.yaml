id: ct-ich
name: CT-ICH (PhysioNet)
full_name: Computed Tomography Images for Intracranial Hemorrhage Detection and Segmentation
summary: >-
  Non-contrast head CT of 82 patients with traumatic brain injury from Al Hilla Teaching Hospital, Iraq, with
  radiologist hemorrhage masks and per-slice labels for five hemorrhage types and skull fracture; 75 scans are on
  PhysioNet.

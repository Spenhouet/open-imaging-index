# yaml-language-server: $schema=../../schema/dataset.schema.json
id: learning-brain
name: LEARNING BRAIN
full_name: LEARNING BRAIN - a longitudinal dataset on neural plasticity dynamics in Braille and music training
summary: >-
  Repeated brain MRI and task fMRI of healthy young women learning tactile Braille reading or piano playing, with an
  untrained control group, collected to follow the time course of learning-related brain plasticity over six to seven
  sessions. Images are preprocessed in MNI space.
homepage: https://openneuro.org/datasets/ds007022
doi: 10.18112/openneuro.ds007022.v1.1.0

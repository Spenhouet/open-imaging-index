    regulation in women with borderline personality disorder compared to nonpatient controls and patients with
    cluster-C personality disorder. J Psychiatry Neurosci 43(1):37-47 (2018). doi:10.1503/jpn.170008. Data:
    DataverseNL, V1 (2020). doi:10.34894/SDPIFR

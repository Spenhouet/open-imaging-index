id: midus-3-neuroscience
name: MIDUS 3 Neuroscience
full_name: 'Midlife in the United States (MIDUS 3): Neuroscience Project, 2017-2022'
summary: >-
  Brain MRI and psychophysiology of US adults from the MIDUS 3 wave, collected to study brain ageing and individual
  differences in emotional reactivity and recovery. 231 project participants; T1w, T2w, FLAIR, task and resting-state
  fMRI, diffusion and ASL in BIDS. Raw images by application.
homepage: https://midus.wisc.edu/midus-neuroscience-repository/
doi: 10.3886/ICPSR38862
# Year the ICPSR study (summary and behavioral variables, no images) was issued. The release date of the raw imaging
# data on the restricted repository is not published.
year: 2023
status: active
creators:
  - name: Carol D. Ryff, University of Wisconsin-Madison
  - name: Richard J. Davidson, University of Wisconsin-Madison
  - name: MIDUS Administrative Core, Institute on Aging, University of Wisconsin-Madison
    url: https://midus.wisc.edu/
modalities: [MR]
contrasts: [T1w, T2w, FLAIR, bold, dwi, asl]

name: Intranasal Oxytocin in Younger and Older Adults (ds004725)
full_name: 'Single Dose Intranasal Oxytocin Administration: Data from Healthy Younger and Older Adults'
summary: >-
  Structural and resting-state brain MRI of healthy younger and older adults scanned after a single dose of intranasal
  oxytocin or placebo, collected in a randomized double-blind trial on how oxytocin affects the brain and cognition
  in aging. With cognitive tests, plasma hormone levels and ApoE genotype.

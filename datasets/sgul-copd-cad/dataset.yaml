# yaml-language-server: $schema=../../schema/dataset.schema.json
id: sgul-copd-cad
name: St George's COPD and CAD brain cohort
full_name: >-
  Factors associated with brain damage in smoking-related diseases: chronic obstructive pulmonary disease (COPD) and
  coronary artery disease (CAD)
summary: >-
  Brain MRI (T1, FLAIR, diffusion tensor, arterial spin labelling) and retinal photographs of smokers with chronic
  obstructive pulmonary disease or coronary artery disease, collected to find vascular, respiratory and inflammatory
  causes of brain damage. Only derived measures are open.
homepage: https://doi.org/10.24376/rd.sgul.14510190
doi: 10.24376/rd.sgul.14510190
year: 2021
updated: 2022
creators:
  - name: St George's, University of London (Spilling CA, Dhillon M-PK, Burrage DR, Ruickbie S, Baker EH, Barrick TR, Jones PW)
    url: https://www.sgul.ac.uk
modalities: [MR, OP]
contrasts: [T1w, FLAIR, dwi, asl, PDw]
anatomy: [brain, retina]
conditions: [copd, coronary_artery_disease]
countries: [GB]
vendors: [philips]
field_strengths: [3]
access:
  type: not_shared
  url: https://doi.org/10.24376/rd.sgul.14510190
  note: >-
    Two figshare records of St George's research data repository hold spreadsheets of derived values for the same 100
    patients under CC BY 4.0: 10.24376/rd.sgul.14510190 (2021, 81 variables including brain tissue, white matter
    hyperintensity, diffusion and blood flow measures and retinal vessel measures) and 10.24376/rd.sgul.20067605
    (2022, 15 variables including white matter lesion volume, diffusion measures and MoCA). The readmes state that
    age, sex and brain scans are not provided. No route to the images is published.
licenses:
  - license: LicenseRef-No-Published-Terms
    applies_to: Brain MR images and retinal photographs.
    note: Neither figshare record nor the paper offers the images or states terms for them.
  - license: CC-BY-4.0
    applies_to: Spreadsheets of derived clinical, retinal and brain MRI measures on figshare.

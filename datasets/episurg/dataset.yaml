# yaml-language-server: $schema=../../schema/dataset.schema.json
id: episurg
name: EPISURG
full_name: >-
  EPISURG: a dataset of postoperative magnetic resonance images (MRI) for quantitative analysis of resection
  neurosurgery for refractory epilepsy
summary: >-
  Postoperative brain MRI of people with drug-resistant focal epilepsy after resective surgery, released to train and
  evaluate automatic segmentation of the resection cavity. Includes preoperative scans for most patients and manual
  cavity masks from three raters on a subset.
homepage: https://rdr.ucl.ac.uk/articles/dataset/EPISURG_a_dataset_of_postoperative_magnetic_resonance_images_MRI_for_quantitative_analysis_of_resection_neurosurgery_for_refractory_epilepsy/9996158
doi: 10.5522/04/9996158.v1
year: 2020
version: v1
status: active
creators:
  - name: Fernando Pérez-García, Roman Rodionov, Ali Alim-Marvasti, Rachel Sparks, John S. Duncan, Sébastien Ourselin
  - name: University College London and National Hospital for Neurology and Neurosurgery, London
species: human
modalities: [MR]
contrasts: [T1w]
anatomy: [brain]
conditions: [epilepsy]
tasks: [segmentation]
formats: [NIfTI]
countries: [GB]
size_gb: 5.8
access:
  type: open
  url: https://doi.org/10.5522/04/9996158.v1
  note: >-
    A single EPISURG.zip downloads from the UCL Research Data Repository without an account. The record carries a
    CC BY-NC-SA 4.0 license, and its description adds data use terms that every user must follow.
licenses:

    Markers Initiative (PPMI) database (www.ppmi-info.org/access-data-specimens/download-data), RRID:SCR_006431" and the
    funding statement from the PPMI Publication Policy. Cohort reference: Marek K, et al. The Parkinson Progression
    Marker Initiative (PPMI). Progress in Neurobiology 95(4):629-635 (2011). doi:10.1016/j.pneurobio.2011.09.005

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: ppmi
name: PPMI
full_name: Parkinson's Progression Markers Initiative (now Parkinson's Precision Medicine Initiative)
summary: >-
  Longitudinal multi-site observational study of early untreated Parkinson's disease, prodromal and genetic at-risk
  people and healthy controls, with DaTscan SPECT, MRI including DTI, biofluids, genetics and clinical assessments
  shared through LONI.
homepage: https://www.ppmi-info.org/
doi: 10.1016/j.pneurobio.2011.09.005
# Year enrollment began (1 June 2010, per Marek et al. 2018). The PPMI website says data are shared as they are
# collected; a separate first-release date was not verified.
year: 2010
status: active
creators:
  - name: The Michael J. Fox Foundation for Parkinson's Research (sponsor)
    url: https://www.michaeljfox.org/
  - name: PPMI Steering Committee and study cores (PI Kenneth Marek)
    url: https://www.ppmi-info.org/
  - name: Laboratory of Neuro Imaging (LONI), University of Southern California (data management core)
    url: https://ida.loni.usc.edu/
species: human
modalities: [MR, NM, PT]
contrasts: [T1w, dwi, bold]
tracers: [datscan, av133]
anatomy: [brain]
conditions: [parkinsons, healthy]
tasks: [classification, regression, longitudinal]
vendors: [siemens]
field_strengths: [3]
access:
  type: application
  url: https://ida.loni.usc.edu/collaboration/access/appApply.jsp?project=PPMI
licenses:

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: masivar
name: MASiVar
full_name: >-
  MASiVar: Multisite, Multiscanner, and Multisubject Acquisitions for Studying Variability in Diffusion Weighted
  Magnetic Resonance Imaging
summary: >-
  Repeated diffusion MRI of healthy adults and young children, acquired to measure how much diffusion measures vary
  within a session, between sessions, between scanners and between people, with raw and preprocessed scans from four
  3 T scanners at three sites.
homepage: https://openneuro.org/datasets/ds003416
doi: 10.18112/openneuro.ds003416.v2.0.2
# OpenNeuro snapshot 1.0.0 is dated 2020-12-03 and snapshot 2.0.2 (the latest) 2021-07-21 in the CHANGES file.

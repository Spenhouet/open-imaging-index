id: openneuro-ds004299
name: Habit Learning Multi-Modal MRI (ds004299)
full_name: 'Characterizing habit learning in the human brain at the individual and group levels: a multi-modal MRI study'
summary: >-
  Task and resting-state fMRI, diffusion MRI and T1-weighted brain MRI of healthy young adults trained on a free-operant
  snack task for one or three days, collected to test whether extensive training forms habits and how this shows in the
  brain. 123 adults from Tel Aviv, CC0.

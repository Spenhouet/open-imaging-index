name: Complex Multi-Echo fMRI (ds006926)
full_name: 'Complex multi-echo fMRI dataset: New strategies in processing of multi-echo data'
summary: >-
  Multi-echo task and resting-state fMRI of adults with both magnitude and phase images, collected to develop
  processing methods for complex-valued multi-echo data. Each run was repeated at two repetition times, with
  structural scans, field maps and cardiac and respiratory recordings.

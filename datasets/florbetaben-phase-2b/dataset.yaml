id: florbetaben-phase-2b
name: Florbetaben Phase IIb Trial (diagnostic confidence add-on)
full_name: >-
  Phase IIb clinical trial of florbetaben (BAY 94-9172) amyloid PET in probable Alzheimer's disease and unimpaired
  controls, with an add-on questionnaire study on diagnostic confidence (Schipke et al. 2012)
summary: >-
  Amyloid PET with florbetaben in people with probable Alzheimer's disease and cognitively unimpaired controls,
  acquired in a phase IIb diagnostic trial and used to study how scan results change referring physicians'
  diagnostic confidence. 272 people. The images are not shared.
homepage: https://doi.org/10.1159/000339367
doi: 10.1159/000339367
# Year of the questionnaire study publication; the images have no public release.
year: 2012
creators:

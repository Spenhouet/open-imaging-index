    Ashourvan A, Verstynen T. CMU SC and BOLD fMRI. figshare. Dataset (2019). doi:10.6084/m9.figshare.7965065.v1.
    Ashourvan A, Telesford QK, Verstynen T, Vettel JM, Bassett DS. Multi-scale detection of hierarchical community
    architecture in structural and functional brain networks. PLOS ONE 14(5):e0215520 (2019).
    doi:10.1371/journal.pone.0215520

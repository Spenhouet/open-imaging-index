id: yaleneuroconnect
name: YaleNeuroConnect (ds007286)
full_name: >-
  YaleNeuroConnect: A Transdiagnostic fMRI Dataset With Deeply Phenotyped Subjects Across Resting and Task States
summary: >-
  Resting-state and task fMRI with structural brain MRI from adults spanning many psychiatric diagnoses and healthy
  controls, collected to build brain-behavior models of cognitive and clinical scores across diagnoses. Includes
  connectivity matrices and an extensive cognitive and symptom test battery.
homepage: https://openneuro.org/datasets/ds007286
doi: 10.18112/openneuro.ds007286.v1.0.7
year: 2025

id: openneuro-ds003763
name: Interoception during aging (ds003763)
full_name: 'Interoception during aging: The heartbeat detection task'
summary: >-
  Task fMRI and structural brain MRI of middle-aged and young adults attending to their own heartbeat versus tones,
  collected to study how interoception relates to emotion and brain aging. 62 participants from Moscow, with
  depression, anxiety and interoceptive accuracy scores, in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds003763
doi: 10.18112/openneuro.ds003763.v1.0.5

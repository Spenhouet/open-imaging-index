  Brain MRI and fMRI of young adults scanned before and after 50 minutes of adaptive n-back training, collected to
  test whether ventral tegmental connectivity and T1w/T2w myelin maps predict working memory learning. 46 adults aged
  18 to 25 from Philadelphia.

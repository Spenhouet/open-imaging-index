# yaml-language-server: $schema=../../schema/dataset.schema.json
id: utah-autism-longitudinal
name: Utah longitudinal autism MRI (NDA 1906 and 2400)
full_name: >-
  Atypical Late Neurodevelopment in Autism: A Longitudinal Clinical Phenotype and Multimodal Brain Imaging Study
summary: >-
  Repeated brain MRI with structural, diffusion and resting-state fMRI scans, plus clinical and cognitive testing, of
  males with autism and typically developing males followed from childhood into adulthood since 2003 at the University
  of Utah. Shared through NIMH Data Archive collections 1906 and 2400.
homepage: https://nda.nih.gov/edit_collection.html?id=2400
year: 2019
status: active
creators:
  - name: Janet E. Lainhart and colleagues, University of Utah and University of Wisconsin-Madison
    url: https://nda.nih.gov/edit_collection.html?id=1906
species: human
modalities: [MR]
contrasts: [T1w, dwi, bold]
anatomy: [brain]
conditions: [autism, healthy]
tasks: [longitudinal, classification]
countries: [US]
vendors: [siemens]
field_strengths: [3]
access:
  type: application
  url: https://nda.nih.gov/edit_collection.html?id=2400
licenses:
  - license: LicenseRef-NDA-Data-Use-Terms
    note: >-
      The data are held in NIMH Data Archive collections 1906 and 2400 and are accessed through an approved NDA data
      access request under the NDA Data Use Certification. Collection-specific permission clauses are not public and
      are not broken down here.
citation:
  text: >-
    Prigge MBD, Lange N, Bigler ED, King JB, Dean DC 3rd, Adluru N, Alexander AL, Lainhart JE, Zielinski BA. A 16-year
    study of longitudinal volumetric brain development in males with autism. NeuroImage 236:118067 (2021).
    doi:10.1016/j.neuroimage.2021.118067. Data: NIMH Data Archive collections 1906 and 2400.

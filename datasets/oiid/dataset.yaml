id: oiid
name: OIID
full_name: An fMRI Dataset on Occluded Image Interpretation for Human Amodal Completion Research
summary: >-
  Brain MRI with task and resting-state fMRI of young adults recorded while they identified aircraft in images with
  10% to 90% occlusion, collected to study the neural basis of amodal completion. Ships behavioural data, the stimuli
  and preprocessed derivatives.
homepage: https://openneuro.org/datasets/ds005226
doi: 10.18112/openneuro.ds005226.v1.0.8
# CHANGES file: snapshot 1.0.0 dated 2024-11-24 (initial); snapshot 1.0.8 dated 2025-05-15.

id: openneuro-ds005366
name: Motor BCI fMRI (ds005366)
full_name: Large-scale fMRI dataset for the design of motor-based Brain-Computer Interfaces
summary: >-
  Task fMRI and structural brain MRI of children and adults moving or feeling touch on their hands, feet and mouth,
  collected to map the sensorimotor cortex for planning implanted brain-computer interfaces. 155 healthy volunteers
  and epilepsy surgery candidates aged 6 to 89 from Utrecht, in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds005366
doi: 10.18112/openneuro.ds005366.v2.0.0

id: plogging-fmri
name: Running and Plogging Mental Simulation fMRI (ds004946)
full_name: Brain mechanisms discriminating enactive mental simulations of running and plogging
summary: >-
  Task fMRI of healthy young adults imagining themselves running or plogging (running while picking up litter) along a
  photographed trail, collected to find brain activity that separates the two simulated actions. 103 students, each
  with one T1-weighted scan and a field map.

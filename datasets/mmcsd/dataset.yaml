id: mmcsd
name: MMCSD
full_name: Multi-modal and Multi-view Cervical Spondylosis Imaging Dataset
summary: >-
  Preoperative cervical spine MRI and CT of patients with cervical spondylosis and neck pain who had anterior fusion
  surgery, paired with neck pain scores before and one year after surgery to predict postoperative pain. 250 patients
  from one hospital in China.

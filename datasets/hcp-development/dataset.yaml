# yaml-language-server: $schema=../../schema/dataset.schema.json
id: hcp-development
name: HCP-Development (Lifespan 2.0)
full_name: Lifespan Human Connectome Project in Development, Lifespan 2.0 Release
summary: >-
  Multimodal 3T MRI of 652 healthy children, adolescents and young adults aged 5 to 21 from four US sites: T1w and T2w
  structural, resting-state and task fMRI, two-shell diffusion and multi-delay ASL, with behavioral data, shared
  through the NIMH Data Archive.
homepage: https://www.humanconnectome.org/study/hcp-lifespan-development
doi: 10.1016/j.neuroimage.2018.08.050
year: 2019
updated: 2021
version: Lifespan 2.0 Release (26 February 2021)
status: active
creators:
  - name: Lifespan Human Connectome Project in Development consortium (Washington University in St. Louis, University of Minnesota, Harvard University, UCLA, University of Oxford)
    url: https://www.humanconnectome.org/study/hcp-lifespan-development
species: human
modalities: [MR]
contrasts: [T1w, T2w, bold, dwi, asl]
anatomy: [brain]
conditions: [healthy]
tasks: [normative, regression]
formats: [NIfTI]
countries: [US]
vendors: [siemens]
field_strengths: [3]
access:
  type: application
  url: https://nda.nih.gov/general-query.html?q=query=featured-datasets:HCP%20Aging%20and%20Development
licenses:
  - license: LicenseRef-NDA-Data-Use-Terms
    note: >-
      The HCP-D data use terms page points to the NDA Data Use Certification. Access is granted by the NIH permissions
      committee that also handles ABCD and HCP-Aging data; the certification must be signed by an authorized
      institutional official and is renewed yearly. Study-specific clauses of that permission group are not broken down here.
citation:

id: c-mind
name: C-MIND (NDA 2329)
full_name: Cincinnati MR Imaging of NeuroDevelopment (C-MIND)
summary: >-
  Brain MRI and behavioral tests of typically developing children from birth to 18 years, collected to build
  standardized methods and reference data for normal brain development, with structural, diffusion, functional and
  perfusion MRI including concurrent ASL/BOLD during language tasks.

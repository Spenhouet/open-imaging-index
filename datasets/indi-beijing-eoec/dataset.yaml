id: indi-beijing-eoec
name: INDI Beijing Eyes Open Eyes Closed
full_name: Beijing Normal University Eyes Open Eyes Closed Sample (INDI)
summary: >-
  Three resting-state fMRI runs per participant, one eyes closed and two randomized between eyes open and eyes
  closed, plus T1-weighted MPRAGE and 64-direction DTI, from 48 healthy students at Beijing Normal University.
homepage: https://fcon_1000.projects.nitrc.org/indi/retro/BeijingEOEC.html
year: 2010
status: active
creators:
  - name: State Key Laboratory of Cognitive Neuroscience and Learning, Beijing Normal University (Yu-Feng Zang)
    url: https://fcon_1000.projects.nitrc.org/indi/retro/BeijingEOEC.html
  - name: International Neuroimaging Data-sharing Initiative (INDI)
    url: https://fcon_1000.projects.nitrc.org/
species: human
modalities: [MR]
contrasts: [bold, T1w, dwi]
anatomy: [brain]
conditions: [healthy]
tasks: [normative]
formats: [NIfTI]
countries: [CN]
vendors: [siemens]
access:
  type: registration
  url: https://www.nitrc.org/project/request.php?group_id=296
licenses:
  - license: LicenseRef-INDI-FCP-Terms
    note: >-
      The release page states "Creative Commons License: Attribution - Non-Commercial" as its usage agreement. Downloads
      need a NITRC account and membership in the 1000 Functional Connectomes Project on NITRC.

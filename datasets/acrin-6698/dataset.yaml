name: ACRIN 6698/I-SPY2 Breast DWI
full_name: ACRIN 6698/I-SPY2 Breast DWI (ACRIN 6698 trial, NCT01564368)
summary: >-
  Serial breast MRI of 385 women with invasive breast cancer from the multicenter ACRIN 6698 trial, a diffusion
  substudy of I-SPY 2, at up to four time points of neoadjuvant chemotherapy, with 4 b-value DWI, ADC maps, manual
  tumor segmentations, DCE, test-retest scans and pCR outcome.

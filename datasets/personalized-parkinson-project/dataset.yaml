# yaml-language-server: $schema=../../schema/dataset.schema.json
id: personalized-parkinson-project
name: Personalized Parkinson Project (PPP)
full_name: Personalized Parkinson Project ("Parkinson op Maat")
summary: >-
  Brain MRI (structural, diffusion and task fMRI), biospecimens, smartwatch sensor data and deep
  clinical phenotyping of people with early Parkinson's disease, followed for two years at one Dutch centre to study
  progression. Shared with approved researchers.
homepage: https://www.personalizedparkinsonproject.com/data-sharing/available-data/overview-of-the-project-and-available-data/ppp
doi: 10.1186/s12883-019-1394-3
# Inclusion started in October 2017 (Bloem et al. 2019). A first data release date was not found.
year: 2017
status: active
creators:
  - name: Radboud university medical center, Center of Expertise for Parkinson's Disease and Movement Disorders
    url: https://www.personalizedparkinsonproject.com/
  - name: Verily Life Sciences (project partner)
  - name: Donders Institute for Brain, Cognition and Behaviour (MRI acquisition)
species: human
modalities: [MR]
contrasts: [T1w, dwi, bold]
anatomy: [brain]
conditions: [parkinsons]
tasks: [longitudinal]
countries: [NL]
vendors: [siemens]
field_strengths: [3]
access:
  type: application
  url: https://www.personalizedparkinsonproject.com/data-sharing/requesting-data
licenses:
  - license: LicenseRef-PPP-Data-Sharing
citation:
  text: >-
    Bloem BR, Marks WJ Jr, Silva de Lima AL, et al. The Personalized Parkinson Project: examining disease progression
    through broad biomarkers in early Parkinson's disease. BMC Neurology 19, 160 (2019).
    doi:10.1186/s12883-019-1394-3. Acknowledge the data as described in the Qualified Researcher Agreement.

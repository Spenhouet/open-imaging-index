id: avid
name: AVID
full_name: 'AVID: Auditory-induced Visual Mental Imagery Dataset'
summary: >-
  Task fMRI and T1-weighted brain MRI of healthy young adults imagining scenes and simple objects described in spoken
  Mandarin with their eyes closed, collected to train and benchmark models that reconstruct imagined images from brain
  activity. About 67 hours of scanning across nine participants.

id: nefrocog
name: NEFROCOG Pre-dialysis CKD Brain MRI
full_name: >-
  Cross-sectional assessment of mild cognitive impairment in pre-dialysis chronic kidney disease and its association
  with inflammation and changes seen on MRI
summary: >-
  Brain MRI of adults with chronic kidney disease not yet on dialysis, collected to test whether mild cognitive
  impairment relates to kidney function, inflammatory markers and visible brain changes. Images are not shared; only
  the article figures and tables are public.
homepage: https://doi.org/10.1590/2175-8239-jbn-2021-0194
doi: 10.1590/2175-8239-jbn-2021-0194
# Year of the article. The MRI images have no public release.
year: 2022
creators:
  - name: Leopoldo Antônio Pires, Federal University of Juiz de Fora
  - name: Natália Maria da Silva Fernandes, Federal University of Juiz de Fora
modalities: [MR]
anatomy: [brain]
conditions: [ckd, mci]
countries: [BR]
vendors: [siemens]
field_strengths: [1.5]
access:

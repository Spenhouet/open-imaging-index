id: precision-aging-network
name: PAN HML MRI
full_name: 'Precision Aging Network: Closing the Gap Between Cognitive Healthspan and Human Lifespan'
summary: >-
  Brain MRI of cognitively unimpaired adults aged 50 to 79, collected to find what drives risk of and resilience to
  age-related cognitive decline. Structural, susceptibility, diffusion, perfusion and resting-state scans from four US
  sites, with two-year follow-up for some participants.
homepage: https://openneuro.org/datasets/ds007522
doi: 10.18112/openneuro.ds007522.v2.0.1
# First public snapshot 1.0.0 on 2026-05-19 (CHANGES file).

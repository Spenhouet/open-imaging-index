    kind: website
  nrg-gsp-page:
    title: Neuroinformatics Research Group GSP open data release page (access steps)
    url: http://neuroinformatics.harvard.edu/gsp/
    kind: website
related: []
keywords: [resting-state fMRI, young adults, healthy adults, brain morphometry, personality, cognition, test-retest]

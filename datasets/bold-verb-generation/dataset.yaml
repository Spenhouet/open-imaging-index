name: BOLD Verb Generation
full_name: Oxford BOLD study, verb generation fMRI
summary: >-
  Task fMRI and T1-weighted brain MRI of children aged 10 to 15 with developmental language disorder and typically
  developing peers, collected to test whether overt verb generation recruits language regions differently in DLD.

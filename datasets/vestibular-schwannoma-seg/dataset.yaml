# yaml-language-server: $schema=../../schema/dataset.schema.json
id: vestibular-schwannoma-seg
name: Vestibular-Schwannoma-SEG
full_name: >-
  Segmentation of Vestibular Schwannoma from Magnetic Resonance Imaging: An Open Annotated Dataset and Baseline
  Algorithm
summary: >-
  Gamma Knife planning MRI (contrast-enhanced T1 and high-resolution T2) of 242 patients with a unilateral vestibular
  schwannoma from one London centre, with manual tumour and cochlea contours, RT dose, plan and structure files and
  T1-T2 registration matrices.
homepage: https://www.cancerimagingarchive.net/collection/vestibular-schwannoma-seg/
doi: 10.7937/TCIA.9YTJ-5Q73
year: 2021
version: '2'
status: active
creators:
  - name: >-
      Queen Square Radiosurgery Centre and King's College London / University College London (Shapey J, Kujawa A,
      Dorent R, Wang G, Vercauteren T et al.)
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [MR]
contrasts: [T1w_ce, T2w]
anatomy: [brain]
conditions: [vestibular_schwannoma]
tasks: [segmentation, registration]
formats: [DICOM]
countries: [GB]
vendors: [siemens]
field_strengths: [1.5]
size_gb: 28.21
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/vestibular-schwannoma-seg/
  note: >-
    DICOM images and RT objects via the TCIA Data Retriever; registration matrices, JSON contours and the directory
    name mapping as direct downloads. Scripts to convert the data to NIfTI are at https://github.com/KCL-BMEIS/VS_Seg.

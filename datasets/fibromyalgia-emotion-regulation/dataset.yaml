id: fibromyalgia-emotion-regulation
name: Emotion regulation in women with fibromyalgia (ds004144)
full_name: >-
  A behavioral, clinical and brain imaging dataset with focus on emotion regulation of females with fibromyalgia
summary: >-
  Brain MRI of Mexican women with fibromyalgia and matched healthy controls, collected to study emotion processing and
  regulation in chronic pain. T1w, T2w, resting-state and emotion regulation task fMRI with clinical and behavioral
  data.
homepage: https://openneuro.org/datasets/ds004144
doi: 10.18112/openneuro.ds004144.v1.0.2

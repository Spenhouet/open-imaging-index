id: ping
name: PING
full_name: Pediatric Imaging, Neurocognition, and Genetics (PING)
summary: >-
  Cross-sectional multisite 3T MRI (T1w, T2w, diffusion, resting-state fMRI), NIH Toolbox cognition and genome-wide
  genotypes from 1,493 typically developing children and young people aged 3 to 21 at 10 US sites, shared through the
  NIMH Data Archive.

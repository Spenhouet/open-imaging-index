name: Lumbar Spine VCF MRI (HCFMRP)
full_name: >-
  Lumbar Spine Vertebral Compression Fractures (VCFs) Dataset: MRI T1-Weighted Images for Benign and Malignant
  Classification
summary: >-
  Sagittal T1-weighted lumbar spine MRI of adults with vertebral compression fractures, collected to tell
  osteoporotic from cancer-related fractures with 3D radiomics, with semi-automatic segmentations of each fractured
  vertebral body.

full_name: Lung Image Database Consortium and Image Database Resource Initiative
summary: >-
  1,018 thoracic CT scans of 1,010 patients from seven US academic centers, each read by four radiologists who
  marked and outlined lung nodules and rated their characteristics. Includes a smaller set of chest radiographs.

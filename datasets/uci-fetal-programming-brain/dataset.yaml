id: uci-fetal-programming-brain
name: UCI Fetal Programming of the Newborn and Infant Brain
full_name: Fetal Programming of the Newborn and Infant Human Brain
summary: >-
  Brain MRI of newborns and one-year-olds from a University of California, Irvine pregnancy cohort, collected to relate the
  maternal endocrine and immune milieu in pregnancy to infant brain structure and development. 118 children with
  shared images in NIMH Data Archive collection 1890.

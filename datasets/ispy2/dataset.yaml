id: ispy2
name: ISPY2
full_name: I-SPY 2 Breast Dynamic Contrast Enhanced MRI Trial (ISPY2)
summary: >-
  Serial breast DCE-MRI and T2-weighted MRI of 719 women with locally advanced breast cancer in the I-SPY 2
  neoadjuvant chemotherapy trial, with SER and enhancement maps, functional tumor volume masks and pathologic response.
homepage: https://www.cancerimagingarchive.net/collection/ispy2/
doi: 10.7937/TCIA.D8Z0-9T85
year: 2022
version: '1'
status: active
creators:
  - name: I-SPY 2 TRIAL imaging group, University of California San Francisco (PI Nola M. Hylton)
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [MR]
contrasts: [T2w, dce]
anatomy: [breast]
conditions: [breast_cancer]
tasks: [segmentation, classification, longitudinal]
formats: [DICOM]
field_strengths: [1.5, 3]
size_gb: 1746
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/ispy2/
  note: >-
    DICOM images are downloaded with the TCIA Data Retriever from a manifest file. No account is needed. A second
    manifest on the same page downloads the full I-SPY2 Imaging Cohort 1 (985 patients), which adds the 266 patients
    of the separate ACRIN-6698 collection. The clinical spreadsheet for all 985 patients is an open XLSX download.

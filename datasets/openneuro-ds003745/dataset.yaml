name: Social Reward and Decision Making in Aging fMRI (ds003745)
full_name: An fMRI Dataset on Social Reward Processing and Decision Making in Younger and Older Adults
summary: >-
  Task fMRI and T1- and T2-weighted MRI from younger and older adults playing a trust game, a shared-reward card game
  and an ultimatum game with a friend, a stranger and a computer, collected to study age differences in social and
  economic decisions.

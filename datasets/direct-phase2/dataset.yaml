    B, et al. Cross-subject decoding of internal mental states using predictive time-series modeling. Sci Bull
    (Beijing) (2026). doi:10.1016/j.scib.2026.05.060. Chen X, Lu B, Li HX, et al. The DIRECT consortium and the

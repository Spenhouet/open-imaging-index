id: direct-phase2
name: DIRECT Phase II
full_name: Data Sharing of the Phase II from the DIRECT Consortium
summary: >-
  Preprocessed resting-state fMRI time series and structural MRI measures of people with major depressive disorder,
  bipolar disorder or schizophrenia and healthy controls, pooled for transdiagnostic mega-analyses; raw scans are not
  included. Unzipping needs a signed agreement.
homepage: https://rfmri.org/DIRECTPhase2
doi: 10.57760/sciencedb.psych.00689
year: 2025
updated: 2026
version: V4
status: active
creators:
  - name: DIRECT Consortium (Depression Imaging REsearch ConsorTium)
  - name: The R-fMRI Lab (Chao-Gan Yan), Institute of Psychology, Chinese Academy of Sciences
    url: https://rfmri.org/DIRECTPhase2
species: human
modalities: [MR]
contrasts: [bold]
anatomy: [brain]
conditions: [depression, bipolar_disorder, schizophrenia, healthy]
tasks: [classification]
# All 53 creators in the DataCite record of the Science Data Bank deposit are affiliated with institutions in China.
countries: [CN]
# DataCite metadata of the Science Data Bank record: 1973398660679 bytes in 6 files.
size_gb: 1973.4
access:
  type: signed_agreement
  url: https://www.scidb.cn/detail?dataSetId=9571ca95a1dd45e286570121b40cd895
  note: >-
    The archives download from Science Data Bank (FTP is recommended for the size), but they are encrypted. The unzip
    password and the phenotypic information are sent after a scanned, signed copy of the data use agreement is emailed
    to rfmrilab@gmail.com. Until January 1, 2026 access was coordinated through letters of intent; since then sharing
    is unrestricted for qualified researchers.
licenses:
  - license: CC-BY-NC-ND-4.0

id: hcp-aging
name: HCP-Aging (Lifespan 2.0)
full_name: Lifespan Human Connectome Project in Aging, Lifespan 2.0 Release
summary: >-
  Multimodal 3T MRI of 725 healthy adults aged 36 to 100+ from four US sites: T1w and T2w structural, high-resolution
  hippocampal T2w, resting-state and task fMRI, two-shell diffusion and multi-delay ASL, with behavioral data, shared
  through the NIMH Data Archive.
homepage: https://www.humanconnectome.org/study/hcp-lifespan-aging
doi: 10.1016/j.neuroimage.2018.09.060
year: 2019
updated: 2021
version: Lifespan 2.0 Release (26 February 2021)
status: active
creators:
  - name: Lifespan Human Connectome Project in Aging consortium (Washington University in St. Louis, University of Minnesota, Massachusetts General Hospital, UCLA, University of Oxford)
    url: https://www.humanconnectome.org/study/hcp-lifespan-aging
species: human
modalities: [MR]
contrasts: [T1w, T2w, bold, dwi, asl]
anatomy: [brain]
conditions: [healthy]
tasks: [normative, regression]
formats: [NIfTI]
countries: [US]
vendors: [siemens]
field_strengths: [3]

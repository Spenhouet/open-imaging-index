  url: https://nda.nih.gov/general-query.html?q=query=featured-datasets:HCP%20Aging%20and%20Development
licenses:
  - license: LicenseRef-NDA-Data-Use-Terms
    note: >-
      Access is granted by the NIH permissions committee that also handles ABCD data. The Data Use Certification must
      be signed by an authorized institutional official, the institution must be registered in eRA Commons and hold an
      active Federalwide Assurance, and access is renewed yearly. Study-specific clauses of that permission group are
      not broken down here.

id: reality-tv-fmri-meg
name: Reality TV naturalistic fMRI and MEG (ds005346)
full_name: Naturalistic fMRI and MEG recordings during viewing of a reality TV show
summary: >-
  Brain fMRI and OPM-MEG of healthy young adults, two separate groups of 30, watching a 25-minute Chinese reality TV
  episode, answering a quiz and replaying it with eyes closed, collected to study shared brain responses to natural
  social scenes. Every participant has a T1w scan.
homepage: https://openneuro.org/datasets/ds005346
doi: 10.18112/openneuro.ds005346.v1.0.5

name: Adolescent Health Risk Behavior Study (ds005012)
full_name: 'Adolescent Health Risk Behavior Study: Monetary Incentive Delay (MID) task data'
summary: >-
  Brain MRI and task fMRI of late adolescents and young adults from Southeast Michigan, scanned twice about a year
  apart while performing the monetary incentive delay task, released to study test-retest reliability of reward
  activation. Includes fieldmaps, physiological recordings and fMRIPrep outputs.

id: nimh-movie-asd-fmri
name: NIMH movie-watching fMRI in autism (Ramot 2020)
full_name: >-
  fMRI dataset for "Distinct neural mechanisms of social orienting and mentalizing revealed by independent measures of
  neural and eye movement typicality"
summary: >-
  Multi-echo functional MRI recorded while young people with autism and typically developing peers watched a social
  movie scene, used to relate brain response typicality to eye movement typicality. 99 participants, with an anatomical
  scan each.
homepage: https://nih.figshare.com/articles/dataset/fMRI_dataset_for_Distinct_neural_mechanisms_of_social_orienting_and_mentalizing_revealed_by_independent_measures_of_neural_and_eye_movement_typicality_/10688180

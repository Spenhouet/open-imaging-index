id: openneuro-ds005498
name: Single-Pulse TMS fMRI (ds005498)
full_name: >-
  Concurrent single-pulse (sp) TMS/fMRI to reveal the causal connectome in healthy and patient populations
summary: >-
  Brain fMRI recorded while single pulses of transcranial magnetic stimulation (TMS) hit one of 11 cortical sites,
  plus resting fMRI and T1w MRI, from healthy, trauma-exposed and depressed adults, collected to map causal circuit
  connections in mood and anxiety disorders.
homepage: https://openneuro.org/datasets/ds005498
doi: 10.18112/openneuro.ds005498.v2.0.0

id: imagen
name: IMAGEN
full_name: 'IMAGEN study: reinforcement-related behaviour in normal brain function and psychopathology'
summary: >-
  Longitudinal European cohort of over 2,000 adolescents recruited at age 14 at 8 sites in the UK, Ireland, France and
  Germany, with MRI (T1w, T2w, FLAIR, diffusion, task and resting-state fMRI) at ages 14, 19 and 22 to 23, genomics and
  psychiatric assessments, shared on approved proposals.
homepage: https://imagen-project.org/
doi: 10.25720/p1ma-genq
year: 2010
version: '2.7'
status: active
creators:
  - name: IMAGEN Consortium
    url: https://imagen-project.org/
species: human
modalities: [MR]
contrasts: [T1w, T2w, FLAIR, dwi, bold]
anatomy: [brain]
tasks: [longitudinal, regression]
formats: [NIfTI]
countries: [GB, IE, FR, DE]
vendors: [siemens, philips, ge, bruker]
access:
  type: application
  url: https://imagen-project.org/dataaccess
licenses:
  - license: LicenseRef-IMAGEN-Data-Access-Policy
    note: >-
      Each proposal names an IMAGEN principal investigator and covers one manuscript. Applicants tick their agreement
      to the Data Access Policy and to the EU GDPR on the proposal form; institutions outside the EU without an
      adequacy decision also complete a Transfer Impact Assessment and sign a GDPR data sharing agreement.
citation:
  text: >-

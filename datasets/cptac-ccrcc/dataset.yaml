# yaml-language-server: $schema=../../schema/dataset.schema.json
id: cptac-ccrcc
name: CPTAC-CCRCC
full_name: The Clinical Proteomic Tumor Analysis Consortium Clear Cell Renal Cell Carcinoma Collection (CPTAC-CCRCC)
summary: >-
  Standard-of-care CT and MRI and whole-slide pathology images of 262 patients from the NCI CPTAC clear cell renal cell
  carcinoma cohort, linked by patient ID to proteomic, genomic and clinical data in the NCI data commons.
homepage: https://www.cancerimagingarchive.net/collection/cptac-ccrcc/
doi: 10.7937/k9/tcia.2018.oblamn27
year: 2018
updated: 2025
version: '14'
status: active
creators:
  - name: National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)
    url: https://proteomics.cancer.gov/programs/cptac
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [CT, MR, SM]
anatomy: [kidney]
conditions: [ccrcc]
formats: [DICOM, SVS]
size_gb: 280.22
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/cptac-ccrcc/
  note: >-
    DICOM radiology is downloaded with the TCIA Data Retriever from a manifest file, slides through IBM Aspera. No
    account is needed. Clinical, proteomic and genomic data are in the Proteomic and Genomic Data Commons.
licenses:
  - license: CC-BY-4.0
    url: https://www.cancerimagingarchive.net/collection/cptac-ccrcc/
citation:
  text: >-
    National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC). (2018). The Clinical Proteomic
    Tumor Analysis Consortium Clear Cell Renal Cell Carcinoma Collection (CPTAC-CCRCC) (Version 14) [dataset]. The
    Cancer Imaging Archive. https://doi.org/10.7937/k9/tcia.2018.oblamn27. Acknowledgement: "Data used in this
    publication were generated by the National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)."
sources:
  tcia-cptac-ccrcc:
    title: TCIA CPTAC-CCRCC collection page (version 14, updated 2025/07/07)
    url: https://www.cancerimagingarchive.net/collection/cptac-ccrcc/
    kind: website
  tcia-cptac-ccrcc-digest:
    title: >-
      TCIA CPTAC-CCRCC radiology metadata digest (TCIA-CPTAC-CCRCC_v11_20230818-nbia-digest.xlsx, open download),
      counted per unique Patient ID
    url: https://www.cancerimagingarchive.net/wp-content/uploads/TCIA-CPTAC-CCRCC_v11_20230818-nbia-digest.xlsx
    kind: computed
keywords: [renal cell carcinoma, proteogenomics, radiogenomics, CPTAC, whole-slide imaging]
verified:
  date: '2026-10-09'
  by: Spenhouet-agent

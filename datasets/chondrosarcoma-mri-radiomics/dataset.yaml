  Unenhanced T1- and T2-weighted MRI of cartilaginous bone tumours, collected to grade low-grade atypical
  cartilaginous tumours against higher-grade chondrosarcoma with radiomics and machine learning. Files are restricted
  on Zenodo and not openly available.

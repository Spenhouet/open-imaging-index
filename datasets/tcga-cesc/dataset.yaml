    kind: website
  tcia-tcga-cesc-digest:
    title: TCIA TCGA-CESC series metadata digest (CC BY 3.0, open download)
    url: https://www.cancerimagingarchive.net/wp-content/uploads/TCIA_TCGA-CESC_09-16-2015-nbia-digest.xlsx
    kind: computed
keywords: [TCGA, radiogenomics, cervical cancer, uterine cervix, pelvic MRI]

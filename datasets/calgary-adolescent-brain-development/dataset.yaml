id: calgary-adolescent-brain-development
name: Adolescent Brain Development (Calgary)
full_name: Adolescent Brain Development
summary: >-
  Longitudinal multimodal brain MRI of typically developing children and adolescents, scanned up to three times two
  years apart to study white matter development and its links to reading and cognition. Diffusion, myelin-sensitive
  ihMT and mcDESPOT, QSM, ASL and resting-state fMRI from 51 children, in BIDS.
homepage: https://portal.conp.ca/dataset?id=projects/AdolescentBrainDevelopment
year: 2024
version: '1.0'
status: active
creators:
  - name: Developmental Neuroimaging Lab, University of Calgary (Catherine Lebel)
    url: https://www.developmentalneuroimaginglab.ca/
species: human
modalities: [MR]
contrasts: [T1w, T2w, dwi, bold, asl, T2starw, ihMTw, VFA]
anatomy: [brain]
tasks: [normative]
formats: [BIDS, NIfTI]
countries: [CA]
vendors: [ge]
field_strengths: [3]
size_gb: 55.7
access:
  type: open
  url: https://github.com/conpdatasets/AdolescentBrainDevelopment
licenses:
  - license: PDDL-1.0
    note: >-
      dataset_description.json and the CONP DATS.json both name PDDL. The files are served over HTTPS from
      sftp.conp.ca without an account; DATS.json marks the distribution as public.
citation:
  text: >-
    Geeraert BL, Chamberland M, Lebel RM, Lebel C. Multimodal principal component analysis to identify major features
    of white matter structure and links to reading. PLOS ONE 15(8), e0233244 (2020). doi:10.1371/journal.pone.0233244
sources:
  conp-adolescent-brain-development:

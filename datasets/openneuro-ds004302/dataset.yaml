  Task fMRI and T1-weighted brain MRI of adults with schizophrenia, with and without frequent auditory verbal
  hallucinations, and matched healthy controls listening to words, sentences and reversed speech. 71 participants
  from Barcelona at 3T, in BIDS under CC0.

name: NIMH CTNB and BEB Structural MRI (ds005112)
full_name: >-
  Structural MRI dataset from NIMH: Clinical and Translational Neuroscience Branch and Behavioral Endocrinology Branch
summary: >-
  Structural brain MRI of children, adolescents and adults aged 8 to 55, pooled from two NIMH intramural protocols on
  neuropsychiatric imaging and on brain development across puberty, with T1-weighted scans in every session and
  fat-suppressed T2-weighted scans in some.

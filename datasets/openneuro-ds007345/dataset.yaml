name: Olfactory groove meningioma multimodal MRI (ds007345)
full_name: 'Multimodal Brain MRI and Clinical Data in Olfactory Groove Meningioma: A Prospective Data Report'
summary: >-
  Structural, diffusion and resting-state functional brain MRI of patients with olfactory groove meningioma, collected
  before and after surgery to study tumor and edema effects on the brain and postoperative recovery. 37 patients, 23
  with follow-up, with tumor and edema masks, in BIDS under CC0.

  Longitudinal brain MRI of 417 Australian twins aged 9 to 14 at baseline, 304 rescanned 1 to 2.5 years later, with
  MP2RAGE T1w, T2w, FLAIR, SWI, multi-shell diffusion, ASL and resting and task fMRI at 3T, in BIDS under CC0.

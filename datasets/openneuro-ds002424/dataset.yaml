name: Working Memory and Reward in ADHD (ds002424)
full_name: Working Memory and Reward in Children with and without Attention Deficit Hyperactivity Disorder (ADHD)
summary: >-
  Brain MRI and task fMRI of children with and without ADHD performing verbal and visuospatial n-back working memory
  tasks under large or small monetary reward with immediate or delayed feedback, collected to study how reward and
  feedback shape working memory in ADHD. BIDS under CC0.

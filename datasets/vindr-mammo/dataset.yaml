      Scientific Data paper instead names the PhysioNet Credentialed Health Data License 1.5.0; the PhysioNet project
      page, which grants access, is taken as authoritative.
citation:
  text: >-
    Nguyen HT, Nguyen HQ, Pham HH, et al. VinDr-Mammo: A large-scale benchmark dataset for computer-aided diagnosis in
    full-field digital mammography. Sci Data 10, 277 (2023). Pham HH, Nguyen Trung H, Nguyen HQ. VinDr-Mammo (version
    1.0.0). PhysioNet (2022). https://doi.org/10.13026/br2v-7517

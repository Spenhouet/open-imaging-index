# yaml-language-server: $schema=../../schema/dataset.schema.json
id: vindr-mammo
name: VinDr-Mammo
full_name: 'VinDr-Mammo: A large-scale benchmark dataset for computer-aided diagnosis in full-field digital mammography'
summary: >-
  5,000 four-view full-field digital mammography exams (20,000 DICOM images) from two Hanoi hospitals, double read
  by radiologists with breast-level BI-RADS and density, bounding boxes for findings and a fixed train/test split.
homepage: https://physionet.org/content/vindr-mammo/1.0.0/
doi: 10.13026/br2v-7517
year: 2022
version: 1.0.0
status: active
creators:
  - name: VinBigData (Hieu T. Nguyen, Ha Q. Nguyen, Hieu H. Pham)
    url: https://vindr.ai/
  - name: Hanoi Medical University Hospital and Hospital 108
species: human
modalities: [MG]
anatomy: [breast]
tasks: [classification, detection]
formats: [DICOM]
countries: [VN]
vendors: [siemens, other]
access:
  type: signed_agreement
  url: https://physionet.org/content/vindr-mammo/1.0.0/
licenses:

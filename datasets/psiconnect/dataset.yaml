id: psiconnect
name: PsiConnect
full_name: 'PsiConnect: Multimodal Neuroimaging of Context-Dependent Brain and Behaviour Dynamics under Psilocybin'
summary: >-
  Brain MRI, multi-echo fMRI and EEG of healthy psychedelic-naive adults scanned before and after a single 19 mg dose
  of psilocybin, collected to study how the drug's effects on brain activity depend on context (rest, meditation,
  music, movie) and on prior meditation training.
homepage: https://openneuro.org/datasets/ds006110
doi: 10.18112/openneuro.ds006110.v1.2.2

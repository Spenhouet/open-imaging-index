id: persuasion-healthy-eating-fmri
name: Persuasive Healthy Eating Call fMRI
full_name: Deciphering the neural responses to a naturalistic persuasive message
summary: >-
  Brain MRI and narrative-listening fMRI of healthy young adults who listened to a persuasive healthy eating narrative between two blocks
  of a food bidding task, recorded in Moscow to study neural synchrony in persuaded and unpersuaded listeners.
homepage: https://openneuro.org/datasets/ds005518
doi: 10.18112/openneuro.ds005518.v1.0.1

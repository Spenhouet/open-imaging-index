    url: https://doi.org/10.1093/schizbullopen/sgae010
    kind: paper
  bhullar2026:
    title: Bhullar et al. 2026, Data in Brief, TOPSY picture description dataset (PMC13157082)
    url: https://doi.org/10.1016/j.dib.2026.112788
    kind: paper

    kind: paper
  oasis3-data-dictionary:
    title: OASIS-3 Imaging Methods and Data Dictionary, version 2.3 (data release 2.0, July 2022)
    url: https://bpb-us-e2.wpmucdn.com/sites.wustl.edu/dist/6/4383/files/2024/04/OASIS-3_Imaging_Data_Dictionary_v2.3-a93c947a586e7367.pdf
    kind: website

id: pediatric-anxiety-movie-nlp-fmri
name: NIMH pediatric anxiety movie fMRI (Kirk 2025)
full_name: Linking Subjective Experience of Anxiety to Brain Function using Natural Language Processing
summary: >-
  Multi-echo fMRI of children and adolescents with and without anxiety disorders watching an anxiety-provoking animated
  film between two resting-state runs, with T1-weighted MRI, anxiety ratings and language-model scores of post-scan
  interviews about the film.
homepage: https://openneuro.org/datasets/ds006948
doi: 10.18112/openneuro.ds006948.v1.0.1

id: bean-morphometry-growth
name: BEAN Brain Morphometry and Diminished Growth
full_name: BrainMorphometry_DiminishedGrowth_BEANstudy_2021
summary: >-
  Structural brain MRI of six-year-old children growing up in extreme poverty in Dhaka, Bangladesh, collected to relate
  brain size and shape to stunting and other signs of early malnutrition. Includes growth z-scores, socioeconomic
  measures and IQ.
homepage: https://openneuro.org/datasets/ds003877
doi: 10.18112/openneuro.ds003877.v1.2.0

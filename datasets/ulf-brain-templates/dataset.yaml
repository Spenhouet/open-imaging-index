    url: https://doi.org/10.1038/s41597-026-07622-4
    kind: paper
  zenodo-17242555:
    title: Zenodo record 17242555, Population-based Brain Templates for Ultra-Low-Field MRI
    url: https://zenodo.org/records/17242555
    kind: website
  template-ulf-github:
    title: Template-ULF code repository (MIT License)
    url: https://github.com/BioMedAnalysis/Template-ULF
    kind: website
related: []
keywords: [ultra-low-field MRI, portable MRI, point-of-care MRI, brain template, atlas, spatial normalization]

  text: >-
    Saha A, Harowicz MR, Grimm LJ, Weng J, Cain EH, Kim CE, Ghate SV, Walsh R, Mazurowski MA (2021). Dynamic
    contrast-enhanced magnetic resonance images of breast cancer patients with tumor locations [Data set]. The Cancer
    Imaging Archive. https://doi.org/10.7937/TCIA.e3sv-re93. Publication: Saha A, et al. A machine learning approach
    to radiogenomics of breast cancer: a study of 922 subjects and 529 DCE-MRI features. British Journal of Cancer
    119(4), 508-516 (2018). https://doi.org/10.1038/s41416-018-0185-8

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: duke-breast-cancer-mri
name: Duke-Breast-Cancer-MRI
full_name: Dynamic contrast-enhanced magnetic resonance images of breast cancer patients with tumor locations
summary: >-
  Pre-operative dynamic contrast-enhanced breast MRI of 922 women with biopsy-confirmed invasive breast cancer from
  Duke Hospital, with radiologist tumor bounding boxes, 529 radiomic features, clinical, pathology, treatment and
  outcome data, and breast and fibroglandular tissue masks for a subset.
homepage: https://www.cancerimagingarchive.net/collection/duke-breast-cancer-mri/
doi: 10.7937/TCIA.e3sv-re93
year: 2021
updated: 2022
version: '3'
status: active
creators:
  - name: >-
      Saha A, Harowicz MR, Grimm LJ, Weng J, Cain EH, Kim CE, Ghate SV, Walsh R, Mazurowski MA (Duke University
      School of Medicine)
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [MR]
contrasts: [T1w, dce]
anatomy: [breast]
conditions: [breast_cancer]
tasks: [detection, segmentation, classification, survival]
formats: [DICOM, NRRD]
countries: [US]
vendors: [ge, siemens]
field_strengths: [1.5, 3]
size_gb: 368.41
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/duke-breast-cancer-mri/
  note: >-
    DICOM images and DICOM SEG masks download with the TCIA Data Retriever. Clinical, annotation box, radiomic
    feature and file path tables are direct XLSX or CSV downloads; the NRRD breast and fibroglandular tissue masks
    are Aspera downloads.
licenses:
  - license: CC-BY-NC-4.0
    url: https://www.cancerimagingarchive.net/collection/duke-breast-cancer-mri/
    note: >-

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: cveda
name: cVEDA
full_name: Consortium on Vulnerability to Externalizing Disorders and Addictions (c-VEDA)
summary: >-
  Indian accelerated longitudinal cohort of 9,010 children, adolescents and young adults aged 6 to 23 from 7 sites,
  with 3T MRI (T1w, T2w, FLAIR, diffusion, resting-state fMRI) in a subsample of 1,278, plus genomics, toxicology and
  psychiatric assessments, shared on approved proposals.
homepage: https://cveda-project.org/
doi: 10.25720/veda-cmrh
year: 2018
updated: 2021
version: '1.5'
status: active
creators:
  - name: c-VEDA Consortium (NIMHANS, Bengaluru, and King's College London)
    url: https://cveda-project.org/
species: human
modalities: [MR]
contrasts: [T1w, T2w, FLAIR, dwi, bold]
anatomy: [brain]
tasks: [longitudinal, regression]
countries: [IN]
vendors: [siemens, philips]
field_strengths: [3]
access:
  type: application
  url: https://cveda-project.org/dataset.html
licenses:
  - license: LicenseRef-cVEDA-Data-Sharing-Guidelines
    note: >-
      External researchers send a one-publication project proposal, naming a consortium liaison, to the cVEDA Project
      Executive Committee. Approved applicants get an account on the c-VEDA server at NIMHANS and download the data
      via SFTP.
citation:
  text: >-
    Sharma E, Vaidya N, Iyengar U, et al. Consortium on Vulnerability to Externalizing Disorders and Addictions
    (cVEDA): A developmental cohort study protocol. BMC Psychiatry 20, 2 (2020). doi:10.1186/s12888-019-2373-3.
    Dataset: c-VEDA dataset, doi:10.25720/veda-cmrh

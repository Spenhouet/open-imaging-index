id: qin-breast-dce-mri
name: QIN Breast DCE-MRI
full_name: >-
  Variations of dynamic contrast-enhanced magnetic resonance imaging in evaluation of breast cancer therapy response: a
  multicenter data analysis challenge (QIN Breast DCE-MRI)
summary: >-
  3 T bilateral breast DCE-MRI of 10 women with locally advanced breast cancer, scanned before and after the first
  cycle of neoadjuvant chemotherapy at OHSU, with pathologic response status, shared on TCIA for a QIN pharmacokinetic
  analysis challenge.
homepage: https://www.cancerimagingarchive.net/collection/qin-breast-dce-mri/

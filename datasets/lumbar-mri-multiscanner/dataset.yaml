id: lumbar-mri-multiscanner
name: Multi-scanner lumbar spine MRI segmentation database
full_name: Multi-scanner and multi-modal lumbar vertebral body and intervertebral disc segmentation database
summary: >-
  Clinical lumbar spine MRI of 34 patients from 55 sessions on Philips, Siemens and GE scanners, with T1w, contrast
  T1w, T2w, Dixon and STIR series and manual masks of the L1 to L5 vertebral bodies and four discs, for multi-domain
  spine segmentation.

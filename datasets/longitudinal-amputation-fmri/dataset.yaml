    url: https://doi.org/10.1038/s41593-025-02037-7
species: human
modalities: [MR]
contrasts: [T1w, bold]
anatomy: [brain]
conditions: [upper_limb_amputation, healthy]
tasks: [longitudinal]
formats: [BIDS, NIfTI]
# Ethics approval from the NHS National Research Ethics Committee; authors at University College London.
countries: [GB]
# The paper states a Siemens 3T Prisma for the longitudinal study; scanners of the pooled cross-sectional cohorts are

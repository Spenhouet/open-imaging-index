id: longitudinal-amputation-fmri
name: Longitudinal amputation fMRI (ds008022)
full_name: >-
  Longitudinal functional MRI datasets of finger tapping and whole-body movement before and after upper-limb
  amputation
summary: >-
  Task fMRI and T1w brain MRI of adults scanned before and up to five years after planned arm amputation, collected to
  test whether cortical body maps stay stable after limb loss, with longitudinal controls and chronic amputee cohorts.
homepage: https://openneuro.org/datasets/ds008022
doi: 10.18112/openneuro.ds008022.v1.0.5
# First OpenNeuro snapshot 1.0.0 dated 2026-06-26 in the CHANGES file.

id: discrimination-estimation-task
name: Discrimination-Estimation Task (ds005381)
summary: >-
  Brain MRI and task fMRI of young adults in Seoul who discriminated and then estimated remembered grating
  orientations, plus retinotopic mapping and resting-state runs, collected to study how decisions bias working memory.
  Covers 50 participants scanned at 3T.
homepage: https://openneuro.org/datasets/ds005381
doi: 10.18112/openneuro.ds005381.v1.1.0

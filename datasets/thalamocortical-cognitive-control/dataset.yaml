full_name: Thalamocortical contributions to hierarchical cognitive control
summary: >-
  Brain MRI and task fMRI of healthy young adults performing a hierarchical context-switching task, collected to study
  how the thalamus represents and updates task context. Covers 59 participants with eight task runs each.

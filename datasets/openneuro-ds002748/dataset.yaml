name: Depression eyes-closed resting-state fMRI (ds002748)
full_name: Resting state with closed eyes for patients with depression and healthy participants
summary: >-
  Eyes-closed resting-state fMRI and T1-weighted brain MRI of adults with mild to moderate depression and healthy
  volunteers, collected in Novosibirsk to compare brain network connectivity between the groups. 72 participants in
  BIDS under CC0, with depression and rumination scores.
homepage: https://openneuro.org/datasets/ds002748

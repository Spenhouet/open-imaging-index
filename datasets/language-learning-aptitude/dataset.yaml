id: language-learning-aptitude
name: Language Learning Aptitude (ds003508)
full_name: Language Learning Aptitude dataset
summary: >-
  Ultra-high-field brain MRI of young right-handed university students, collected to relate language-learning
  aptitude (LLAMA vocabulary, phonetic memory and grammar scores) to cortical structure and white matter diffusion,
  with T1-weighted, proton density and diffusion scans at 7 T.

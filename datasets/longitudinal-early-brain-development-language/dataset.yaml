name: Longitudinal Early Brain Development and Language
full_name: Longitudinal-Trajectories-Early-Brain-Development-Language (New England cohort)
summary: >-
  Brain MRI of children scanned repeatedly from infancy to school age, collected to relate early brain growth to
  later literacy and language skills, with half the children having a family history of dyslexia. T1-weighted and
  diffusion MRI from 80 children over 234 sessions, in BIDS.

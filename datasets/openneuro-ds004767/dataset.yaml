id: openneuro-ds004767
name: Ex vivo MTL tau atlas (ds004767)
full_name: >-
  Characterizing medial temporal lobe vulnerability to neurofibrillary tangle pathology in Alzheimer's disease using a
  3-D ex vivo MRI atlas and serial histology
summary: >-
  Postmortem high-resolution MRI of human medial temporal lobe specimens, collected to build an atlas that links
  neurofibrillary tangle burden from serial histology to cortical thinning in Alzheimer's disease. Includes manual
  segmentations, a histology-labelled atlas and tau burden maps.
homepage: https://openneuro.org/datasets/ds004767
doi: 10.18112/openneuro.ds004767.v1.0.0

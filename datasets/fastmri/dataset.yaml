# yaml-language-server: $schema=../../schema/dataset.schema.json
id: fastmri
name: fastMRI (knee and brain)
full_name: 'fastMRI: raw k-space and DICOM dataset of knee and brain MRI'
summary: >-
  Raw multi-coil k-space of 1,594 knee and 6,970 brain MRI scans from NYU Langone, plus about 10,000 clinical knee
  MRI exams as DICOM, released with Meta AI (FAIR) to benchmark machine-learning reconstruction of accelerated MRI.
homepage: https://fastmri.med.nyu.edu/
doi: 10.1148/ryai.2020190007
year: 2018
status: active
creators:
  - name: NYU Langone Health, Center for Advanced Imaging Innovation and Research (CAI2R)
    url: https://cai2r.net
  - name: Facebook AI Research (Meta AI)
    url: https://arxiv.org/abs/1811.08839v2
species: human
modalities: [MR]
contrasts: [PDw, T2w, T1w, T1w_ce, FLAIR]
anatomy: [knee, brain]
tasks: [reconstruction]
formats: [HDF5, DICOM]
countries: [US]
vendors: [siemens]
field_strengths: [1.5, 3]
access:
  type: signed_agreement
  url: https://fastmri.med.nyu.edu/
licenses:
  - license: LicenseRef-fastMRI-DUA
    note: >-
      The website says each sub-dataset has its own Data Sharing Agreement; the agreement text shown on the page is
      the one summarised here. The prostate and breast sub-datasets are not part of this entry.
citation:
  text: >-
    Knoll F, Zbontar J, Sriram A, et al. fastMRI: A Publicly Available Raw k-Space and DICOM Dataset of Knee Images for
    Accelerated MR Image Reconstruction Using Machine Learning. Radiol Artif Intell 2(1):e190007 (2020).
    doi:10.1148/ryai.2020190007; and Zbontar J, Knoll F, Sriram A, et al. fastMRI: An Open Dataset and Benchmarks for
    Accelerated MRI. arXiv:1811.08839.
sources:
  zbontar2018:
    title: Zbontar et al., fastMRI - An Open Dataset and Benchmarks for Accelerated MRI (arXiv:1811.08839v2, pages of that version)
    url: https://arxiv.org/abs/1811.08839v2
    kind: paper
  knoll2020:
    title: Knoll et al. 2020, Radiology - Artificial Intelligence (PMC6996599)
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6996599/
    kind: paper
  fastmri-nyu:
    title: fastMRI dataset website
    url: https://fastmri.med.nyu.edu/
    kind: website
related: []

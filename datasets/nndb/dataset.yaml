id: nndb
name: Naturalistic Neuroimaging Database
full_name: Naturalistic Neuroimaging Database (NNDb)
summary: >-
  Brain fMRI of healthy adults each watching one of ten full-length feature films, collected to study how the brain
  processes real-world audiovisual narratives. Over 1.5 hours of movie fMRI per person, plus a T1w anatomical scan and
  NIH Toolbox behavioural scores.
homepage: https://openneuro.org/datasets/ds002837
doi: 10.18112/openneuro.ds002837.v2.0.0

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: openneuro-ds000201
name: Stockholm Sleepy Brain Study (ds000201)
full_name: >-
  The Stockholm Sleepy Brain Study: Effects of Sleep Deprivation on Cognitive and Emotional Processing in Young and Old
summary: >-
  Brain MRI and task and resting-state fMRI of healthy younger and older adults, each scanned after normal sleep and
  after partial sleep deprivation, collected to study how sleepiness affects emotional and cognitive processing. Adds
  diffusion imaging and questionnaires.
homepage: https://openneuro.org/datasets/ds000201
doi: 10.18112/openneuro.ds000201.v1.0.3
# First released on OpenfMRI as ds000201; the Stanford Digital Repository archive of that release cites it as
# Nilsonne et al. (2016). OpenNeuro snapshot 1.0.3 is dated 2020-02-18.

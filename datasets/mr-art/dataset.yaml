id: mr-art
name: MR-ART (ds004173)
full_name: Movement-related artefacts (MR-ART) dataset
summary: >-
  Brain T1-weighted MRI of healthy adults scanned three times, once lying still and twice while nodding on cue, to
  test how head motion affects image analysis and to validate motion correction. Each scan carries a
  neuroradiologist image quality score and automated quality metrics.

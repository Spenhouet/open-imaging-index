name: Scrambled movie narrative fMRI (ds005215)
full_name: Hippocampal Systems for Event Encoding and Sequencing during Ongoing Narrative Comprehension
summary: >-
  Brain fMRI of young adults watching a temporally scrambled animated movie and then recounting its inferred original
  story aloud, collected to study how the hippocampus encodes and orders narrative events. 65 participants with a T1w
  scan and one BOLD run each.

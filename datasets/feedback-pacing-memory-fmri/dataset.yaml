id: feedback-pacing-memory-fmri
name: Feedback and Learning Pace Memory fMRI
full_name: The Effects of Feedback Availability and Valence on Memory Performance in Self-Paced and Fixed-Paced Learning
summary: >-
  Task fMRI study of participants learning items at their own pace or at a fixed pace, with or without feedback
  and with reward or punishment feedback. Only group-level SPM results and behavioral tables are public; individual
  scans are not shared.

id: sudmex-tms
name: SUDMEX TMS (ds003037)
full_name: >-
  SUDMEX TMS: The Mexican dataset of a repetitive transcranial magnetic stimulation clinical trial on cocaine use
  disorder patients
summary: >-
  Longitudinal brain MRI of people with cocaine use disorder, collected in a randomized sham-controlled trial of
  repetitive transcranial magnetic stimulation (rTMS) with follow-up up to 12 months. 53 patients from Mexico City
  with structural, diffusion and resting-state scans, CC0.

full_name: >-
  The impact of handedness on the neural correlates during kinesthetic motor imagery: a FMRI study
summary: >-
  Brain MRI and task fMRI of right-handed and left-handed young adults who imagined and then executed squeezing a ball
  with the dominant, non-dominant or both hands, collected at the MRI-Lab Graz to compare motor imagery networks by
  handedness.

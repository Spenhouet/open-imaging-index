id: unicamp-ring-enhancing-brain-lesion-mri
name: Ring-enhancing brain lesion MRI (UNESP/Unicamp)
full_name: >-
  Inflammatory lesions and brain tumors: is it possible to differentiate them based on texture features in magnetic
  resonance imaging?
summary: >-
  Brain MRI of patients with a ring-enhancing lesion from one Brazilian medical school hospital, used to tell
  inflammatory lesions from brain tumors with texture features and machine learning. 67 patients on one 1.5T scanner.
  Not shared.
homepage: https://doi.org/10.1590/1678-9199-jvatitd-2020-0011
year: 2020

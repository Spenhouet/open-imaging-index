id: multi-echo-sms-fmri
name: Multi-echo SMS fMRI acquisition parameters (ds004499)
full_name: 'Multi-echo simultaneous multislice fMRI dataset: Effect of acquisition parameters on fMRI data'
summary: >-
  Task fMRI with three echoes and structural brain MRI of adult volunteers, collected to compare how slice acceleration and
  flip angle change fMRI data quality. Each of 50 subjects has seven visual-motor task runs with three echoes, a T1w
  scan, a field map and physiological recordings.

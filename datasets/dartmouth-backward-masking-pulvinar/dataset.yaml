# yaml-language-server: $schema=../../schema/dataset.schema.json
id: dartmouth-backward-masking-pulvinar
name: Dartmouth Backward Masking Pulvinar VBM
full_name: >-
  Preliminary report on the association between pulvinar volume and the ability to detect backward-masked facial
  features
summary: >-
  T1-weighted brain MRI of healthy young adults pooled from two Dartmouth backward masking fMRI studies (64 subjects),
  used to compare grey matter volume between people aware and unaware of masked faces. Raw images are not shared;
  per-subject VBM maps are public.
homepage: https://neurovault.org/collections/3063/
doi: 10.1016/j.neuropsychologia.2017.10.034
# Year of the NeuroVault collection (October 2017) and of the paper online (in print 2019); the raw images have no public
# release.
year: 2017
creators:
  - name: Whalen lab, Department of Psychological and Brain Sciences, Dartmouth College
    url: https://pbs.dartmouth.edu/
modalities: [MR]
contrasts: [T1w]
anatomy: [brain]
conditions: [healthy]
countries: [US]
vendors: [philips]
field_strengths: [3]
formats: [NIfTI]
access:
  type: not_shared
  url: https://neurovault.org/collections/3063/
  note: >-
    The NeuroVault collection holds only derived data: smoothed, modulated grey matter maps in MNI space for each of
    the 64 subjects (VBM8, DARTEL) and the group t map, with age, sex, intracranial volume, study and awareness group
    as image metadata. These maps are under CC0 like all public NeuroVault data. The T1-weighted images themselves are
    not part of the deposit and no other route to them is given.
licenses:
  - license: LicenseRef-No-Published-Terms
    note: >-
      No license or data use terms are stated for the T1-weighted images. The CC0 dedication of NeuroVault covers only
      the derived grey matter maps and their metadata.
citation:
  text: >-
    Kim MJ, Mattek AM, Burr DA, Whalen PJ. Preliminary report on the association between pulvinar volume and the
    ability to detect backward-masked facial features. Neuropsychologia 128, 73-77 (2019). doi:10.1016/j.neuropsychologia.2017.10.034
sources:
  kim2017:
    title: Kim et al. 2017, Neuropsychologia, author manuscript PMC5930150
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5930150/
    kind: paper

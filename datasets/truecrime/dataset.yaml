name: Truecrime (ds004965)
full_name: >-
  Horror as creative emotion regulation: Can true crime consumption help boost adaptive coping with fear and stress?
summary: >-
  Structural brain MRI and resting-state fMRI of adults from Graz, Austria, scanned within a study of why people
  consume true crime stories and how this relates to personality, emotion regulation, anxiety and well-being.
  Questionnaire and behavioral data are shared separately on OSF.

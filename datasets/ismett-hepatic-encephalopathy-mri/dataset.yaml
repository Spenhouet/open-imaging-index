id: ismett-hepatic-encephalopathy-mri
name: Hepatic encephalopathy brain MRI radiomics (ISMETT)
full_name: >-
  Raw Data for the article: Brain magnetic resonance imaging radiomics features associated with hepatic encephalopathy
  in adult cirrhotic patients
summary: >-
  Brain MRI of adult cirrhotic patients and non-cirrhotic controls from a transplant centre in Palermo, all on one 3T scanner, with
  texture features of the lentiform nuclei on T1-weighted images used to detect and grade chronic hepatic
  encephalopathy. 124 patients. Access restricted.

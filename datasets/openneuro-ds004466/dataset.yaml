name: Synaesthesia Connectome MRI (ds004466)
full_name: 'Mapping the Connectome of Synaesthesia: An Open Access MRI Dataset'
summary: >-
  Structural and resting-state brain MRI of adults with verified synaesthesia and non-synaesthete controls, collected
  with Human Connectome Project protocols to map brain areas and connectivity linked to synaesthesia. 127 adults from
  Brighton, UK, in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds004466
doi: 10.18112/openneuro.ds004466.v1.0.3

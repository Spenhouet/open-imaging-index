  Brain PET-MRI of the mitochondrial translocator protein (TSPO) in patients with genetically confirmed mitochondrial
  disease and matched healthy controls, to test TSPO radioligand binding as an in vivo biomarker of mitochondrial
  pathology. Raw data on request.

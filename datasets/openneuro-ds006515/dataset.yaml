name: Chicago Attention and Thoughts (ds006515)
full_name: Chicago Attention and Thoughts (CAT)
summary: >-
  Task, movie and rest fMRI of healthy young adults, collected to relate ongoing thoughts and attention to functional
  brain connectivity. Two sessions per person with annotated rest, story and movie viewing, and a continuous
  performance task, plus a T1-weighted scan.

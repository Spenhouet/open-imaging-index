name: GRACE Schizotypy Gut-Brain MRI (ds007694)
full_name: >-
  GRACE: A Multimodal Observational Case-Control Study Exploring Gut Microbiota-Hippocampus Alterations in Individuals
  With High Positive Schizotypy From the General Population
summary: >-
  Brain MRI (T1-weighted, resting-state fMRI, arterial spin labeling) and hippocampal proton spectroscopy of young
  healthy adults with high or low positive schizotypy, collected to study links between gut microbiota and the
  hippocampus.

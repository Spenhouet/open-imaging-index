# yaml-language-server: $schema=../../schema/dataset.schema.json
id: indi-beijing-short-tr
name: INDI Beijing Short TR
full_name: Beijing Normal University Short TR Sample (INDI)
summary: >-
  Resting-state fMRI acquired twice per person, at TR 0.4 s and TR 2 s, with T1-weighted MPRAGE and 64-direction DTI,
  from 28 healthy college-aged volunteers at Beijing Normal University on a 3 T Siemens scanner.
homepage: https://fcon_1000.projects.nitrc.org/indi/pro/BeijingShortTR.html
year: 2010
status: active
creators:
  - name: State Key Laboratory of Cognitive Neuroscience and Learning, Beijing Normal University (Yu-Feng Zang)
    url: https://fcon_1000.projects.nitrc.org/indi/pro/BeijingShortTR.html
  - name: International Neuroimaging Data-sharing Initiative (INDI)
    url: https://fcon_1000.projects.nitrc.org/
species: human
modalities: [MR]
contrasts: [bold, T1w, dwi]
anatomy: [brain]
conditions: [healthy]
tasks: [normative]
formats: [NIfTI]
countries: [CN]
vendors: [siemens]
field_strengths: [3]
access:
  type: registration
  url: https://www.nitrc.org/project/request.php?group_id=296
licenses:
  - license: LicenseRef-INDI-FCP-Terms
    note: >-
      The release page states "Creative Commons License: Attribution - Non-Commercial" as its usage agreement. Downloads
      need a NITRC account and membership in the 1000 Functional Connectomes Project on NITRC.

id: allop1
name: ALLOP1
full_name: Allopregnanolone Regenerative Therapeutic for MCI/AD, Phase I (NCT02221622)
summary: >-
  Single-site phase 1b/2a trial of intravenous allopregnanolone versus placebo in 24 people with MCI due to Alzheimer's
  disease or mild Alzheimer's disease, with 3 T MRI (T1w, diffusion, resting-state fMRI) before and after 12 weeks of
  treatment, held in the LONI IDA.

  The WAW-Glioma dataset: Multiparametric MRI, Manual Segmentations, Radiomics and Molecular Profiles of Diffuse
  Gliomas
summary: >-
  Brain MRI before and after surgery of adults with diffuse gliomas, with refined tumor segmentations, molecular
  markers, radiomics features, progression and survival, for radiogenomics, segmentation benchmarking and outcome
  prediction. 192 patients with 317 MRI exams.

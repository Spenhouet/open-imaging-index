id: kne96
name: KNE96 Korean Normal Elderly template cohort
full_name: Korean Normal Elderly (KNE) brain MRI template study, KLOSCAD subsample
summary: >-
  3 T T1-weighted brain MRI of 144 cognitively normal Korean adults aged 60 or older from KLOSCAD. Scans of 96 built
  the KNE96, KNE48M and KNE48F templates, 48 validated them. Only the templates were released; scans are not shared.
homepage: https://doi.org/10.4306/pi.2016.13.1.135
doi: 10.4306/pi.2016.13.1.135
# The subject scans have no public release; year of the journal issue of the paper that describes them.
year: 2016
creators:
  - name: Department of Psychiatry, Seoul National University College of Medicine
  - name: Seoul National University Bundang Hospital
modalities: [MR]
contrasts: [T1w]
anatomy: [brain]
conditions: [healthy]

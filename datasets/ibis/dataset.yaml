    kind: paper
  hazlett2012:
    title: >-
      Hazlett et al. 2012, Brain volume findings in 6-month-old infants at high familial risk for autism, Am J
      Psychiatry (author manuscript PMC3744332)
    url: https://doi.org/10.1176/appi.ajp.2012.11091425
    kind: paper
  ibis-network-site:
    title: IBIS Network website
    url: https://ibis-network.com/
    kind: website
  nda-collection-19:

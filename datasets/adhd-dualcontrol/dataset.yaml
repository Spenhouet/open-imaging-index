# yaml-language-server: $schema=../../schema/dataset.schema.json
id: adhd-dualcontrol
name: ADHD Dualcontrol Dataset
summary: >-
  Brain MRI and multiband task fMRI of children aged 9 to 12 with and without ADHD, collected to study proactive and
  reactive inhibitory control with a cued stop-signal task. Covers 26 children with ADHD and 35 typically developing
  controls.
homepage: https://openneuro.org/datasets/ds005899
doi: 10.18112/openneuro.ds005899.v1.0.2

id: odorant-decomposition-fmri
name: Odorant Decomposition fMRI
full_name: Decomposition of an odorant in olfactory perception and neural representation
summary: >-
  Preprocessed task fMRI of healthy young adults smelling odorants before and after adaptation to a related odorant,
  collected to test whether the brain represents odour quality from parts of a molecule's structure. Shared with
  region-of-interest masks, task scripts and analysis results.

id: openneuro-ds000115
name: Working memory in schizophrenia and siblings (ds000115)
full_name: Working memory in healthy and schizophrenic individuals
summary: >-
  Brain MRI and N-back working memory fMRI of people with schizophrenia, their siblings, healthy controls and the
  controls' siblings, collected to study how brain network connectivity changes with working memory load and with
  familial risk for schizophrenia.
homepage: https://openneuro.org/datasets/ds000115

status: active
creators:
  - name: University of Port Harcourt, Nigeria
  - name: Pestilli lab, The University of Texas at Austin
  - name: brainlife.io
    url: https://brainlife.io
species: human
modalities: [MR]
contrasts: [T1w, T1w_ce, T2w, FLAIR, dwi]
anatomy: [brain]

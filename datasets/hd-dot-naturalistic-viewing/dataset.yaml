full_name: A high-density diffuse optical tomography dataset of naturalistic viewing
summary: >-
  High-density diffuse optical tomography of the cortex in healthy adults watching a ten-minute movie clip, shared to
  study brain responses to naturalistic stimuli and optical imaging methods. Many participants returned for repeat
  sessions with the same clip.

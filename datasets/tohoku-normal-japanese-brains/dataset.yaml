id: tohoku-normal-japanese-brains
name: Tohoku normal Japanese brain database
full_name: Neuroanatomical database of normal Japanese brains, IDAC, Tohoku University
summary: >-
  Brain MRI of 1,547 normal Japanese subjects aged 16 to 79 years, collected at Tohoku University to build age- and
  sex-specific reference brains and to study age effects on gray and white matter. No public release or terms.

id: openneuro-ds001486
name: Brain Correlates of Math Development (ds001486)
full_name: Brain Correlates of Math Development
summary: >-
  Longitudinal brain MRI and task fMRI of school children solving single-digit multiplication and subtraction
  problems, with rhyming and numerosity localizer tasks, collected to study how arithmetic develops in the brain.
  Scans about two years apart, with math and reading tests, in BIDS under CC0.

id: sysmh-radiation-temporal-lobe-dmri
name: Radiation Temporal Lobe Injury Diffusion MRI (SYSMH)
full_name: >-
  Comparative Study of Multi-Model Diffusion Magnetic Resonance Imaging in the Diagnosis of Radiation-Induced Temporal
  Lobe Injury
summary: >-
  Diffusion MRI of patients with unilateral temporal lobe necrosis after radiotherapy for nasopharyngeal carcinoma,
  used to compare ADC, DTI, DKI, MAP-MRI and NODDI parameters between the injured and the healthy side. Only a table
  of per-lobe parameter values is public; the scans are not shared.
homepage: https://www.scidb.cn/en/detail?dataSetId=OA_d4a63ec75d184ca3b3c34f9c79f27ad5
doi: 10.57760/sciencedb.dmh.00825
year: 2026
version: V1
status: active
creators:

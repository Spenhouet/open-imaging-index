  - name: Minhui Liu, Xinyin Chen, Yanru Pei, Lixiang Wang, Zhuoheng Yan, Weifeng Su, Yun Su, Yusong Jiang
species: human
modalities: [MR]
contrasts: [dwi, ADC]
anatomy: [brain]
conditions: [radiation_necrosis, nasopharyngeal_carcinoma]
countries: [CN]
access:
  type: not_shared
  url: https://www.scidb.cn/en/detail?dataSetId=OA_d4a63ec75d184ca3b3c34f9c79f27ad5
  note: >-
    The Science Data Bank record holds one results table (6958 bytes) with diffusion parameter values (DKI radial
    kurtosis, DTI radial diffusivity, MAP-MRI non-Gaussianity anisotropy, NODDI intracellular volume fraction and ADC)
    for the affected and the contralateral temporal lobe of each patient. No images are deposited and no route to
    them is given.

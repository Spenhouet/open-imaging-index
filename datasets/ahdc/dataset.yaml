id: ahdc
name: AHDC Adolescent MRI (ds005896)
full_name: >-
  Structural and functional MRI dataset from the Adolescent Health and Development in Context (AHDC) study in
  Columbus, Ohio
summary: >-
  Brain MRI with resting-state and task fMRI of adolescents from a community cohort, collected to study how
  neighborhood exposures and substance use shape brain structure and function. Includes T1w, T2w, diffusion and
  emotion, reward, cue reactivity and working memory tasks.

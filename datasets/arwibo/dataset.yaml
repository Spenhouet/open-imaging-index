id: arwibo
name: ARWiBo
full_name: Alzheimer's Disease Repository Without Borders
summary: >-
  Cross-sectional repository from IRCCS Fatebenefratelli, Brescia, Italy, with data of more than 2700 people (healthy
  elderly controls, MCI and Alzheimer's disease): 1.0 T and 1.5 T structural MRI, DTI, fMRI, FDG PET, SPECT, EEG and
  clinical data. Access by application through neuGRID.
homepage: http://www.arwibo.it
doi: 10.1016/j.jalz.2009.04.1235

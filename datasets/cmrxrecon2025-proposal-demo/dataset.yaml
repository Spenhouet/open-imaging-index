    url: https://www.synapse.org/#!Synapse:syn60059486
    kind: website
  synapse-cmrxrecon2025:
    title: CMRxRecon2025 challenge project page on Synapse (syn59814210)
    url: https://www.synapse.org/Synapse:syn59814210/wiki/
    kind: website
related: []
keywords: [cardiac MRI, k-space, MRI reconstruction, challenge, demo data]

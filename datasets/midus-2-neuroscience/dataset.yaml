id: midus-2-neuroscience
name: MIDUS 2 Neuroscience
full_name: 'Midlife in the United States (MIDUS 2): Neuroscience Project, 2004-2009'
summary: >-
  Brain MRI and psychophysiology of US adults from the MIDUS 2 wave, collected to study individual differences in
  emotional reactivity and recovery and their links to health. 331 project participants; T1w, emotion task fMRI and
  ASL. Raw images by application.
homepage: https://midus.wisc.edu/midus-neuroscience-repository/
doi: 10.3886/ICPSR28683
# Year the ICPSR study (psychophysiological and behavioral variables, no images) was issued. The release date of the
# raw imaging data on the restricted repository is not published.
year: 2010
status: active

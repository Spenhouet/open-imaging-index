id: oasis-2
name: OASIS-2
full_name: 'Open Access Series of Imaging Studies (OASIS): Longitudinal MRI Data in Nondemented and Demented Older Adults'
summary: >-
  Longitudinal brain MRI of 150 right-handed adults aged 60 to 96, nondemented or with very mild to mild Alzheimer's
  disease, scanned at two or more visits (373 sessions) with 3 or 4 T1-weighted MP-RAGE scans per session at 1.5 T.
homepage: https://sites.wustl.edu/oasisbrains/home/oasis-2/
doi: 10.1162/jocn.2009.21407
# Year of the data descriptor's print issue (J Cogn Neurosci 22(12), December 2010).
year: 2010
status: active
creators:
  - name: Washington University Alzheimer Disease Research Center, Washington University in St. Louis
    url: https://sites.wustl.edu/oasisbrains/
species: human
modalities: [MR]
contrasts: [T1w]
anatomy: [brain]
conditions: [healthy, alzheimers]
tasks: [classification, regression, longitudinal, segmentation]
formats: [NIfTI]
countries: [US]
vendors: [siemens]
field_strengths: [1.5]
# Two raw archives listed on the OASIS-2 page as 10 GB and 8 GB.
size_gb: 18
access:
  type: application
  url: https://sites.wustl.edu/oasisbrains/home/access/

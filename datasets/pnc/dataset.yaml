  Community cohort of youth aged 8 to 21 from the Philadelphia area with genotypes, psychiatric and cognitive
  phenotypes, and single-scanner 3T multimodal MRI (T1w, ASL, diffusion, resting-state and task fMRI) of a 1,000-subject
  subsample, shared through dbGaP.

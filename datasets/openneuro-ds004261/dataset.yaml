id: openneuro-ds004261
name: Misinformation false memory fMRI (ds004261)
full_name: >-
  Cross-stage neural pattern similarity in the hippocampus predicts false memory derived from post-event inaccurate
  information
summary: >-
  Task fMRI and T1-weighted brain MRI of 57 healthy Chinese college students who viewed picture stories, later read
  narratives with misleading details and took a memory test the next day, to study how misinformation creates false
  memory. Released in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds004261
doi: 10.18112/openneuro.ds004261.v2.0.0

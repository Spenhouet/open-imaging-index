full_name: >-
  Left Out: The Effect of Handedness on fMRI Activation in Memory Paradigms
summary: >-
  Brain MRI and task fMRI of left-handed and right-handed young adults who encoded and recognised words and faces and
  performed a semantic fluency task, collected at Brigham Young University to test whether including left-handers
  changes memory fMRI results.

id: dp-pcasl-lifespan
name: DP-pCASL lifespan perfusion and BBB (ds005529)
full_name: DP-pCASL data (CBF, ATT, BBB kw) from 186 cognitively normal participants (8-92 years)
summary: >-
  Brain perfusion and blood-brain barrier water exchange maps from cognitively normal people aged 8 to 92, collected
  to chart how cerebral blood flow and barrier function change with age and differ between sexes. Each participant has
  a T1-weighted scan and arterial spin labeling maps.

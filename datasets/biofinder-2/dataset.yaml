# yaml-language-server: $schema=../../schema/dataset.schema.json
id: biofinder-2
name: BioFINDER-2
full_name: >-
  The Swedish BioFINDER 2 Study (Biomarkers For Identifying Neurodegenerative Disorders Early and Reliably),
  BioFINDER-2
summary: >-
  Brain MRI, tau PET and amyloid PET with CSF, blood and cognitive tests from adults who are cognitively healthy or have
  subjective decline, MCI, Alzheimer's disease or other dementias and parkinsonian disorders, followed for up to 8
  years. Data on request.
homepage: https://biofinder.se/two/
# The images have not been publicly released. The study started recruiting on 15 May 2017 (ClinicalTrials.gov).
year: 2017
status: active
creators:
  - name: Clinical Memory Research Unit, Lund University, and Skåne University Hospital
    url: https://biofinder.se/the_biofinder_study_group/
species: human
modalities: [MR, PT]
contrasts: [T1w, FLAIR, swi, dwi, bold, asl, MRS]
tracers: [ro948, flutemetamol]
anatomy: [brain]
conditions:
  [
    healthy,
    scd,
    mci,
    dementia,
    alzheimers,
    frontotemporal_dementia,
    vascular_dementia,
    parkinsons,
    progressive_supranuclear_palsy,
    multiple_system_atrophy,
    lewy_body_dementia
  ]
tasks: [classification, longitudinal, regression]
countries: [SE]
vendors: [siemens, ge]
field_strengths: [3]
access:
  type: on_request
  url: https://doi.org/10.15252/emmm.202114398
  note: >-
    No data access page is published. Papers from the study state that anonymized data are shared on request with
    qualified academic investigators, under a material transfer agreement.
licenses:
  - license: LicenseRef-BioFINDER-Data-Sharing

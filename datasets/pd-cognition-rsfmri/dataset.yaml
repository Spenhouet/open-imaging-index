id: pd-cognition-rsfmri
name: Parkinson's cognition resting-state fMRI (ds005892)
full_name: >-
  Resting State MRI data from healthy control (HC), Parkinson's disease with normal cognition (PD-NC), and Parkinson's
  disease with mild cognitive impairment (PD-MCI) cohorts
summary: >-
  Resting-state brain fMRI and T1-weighted MRI of people with Parkinson's disease, with and without mild cognitive
  impairment, and healthy older controls, collected at New York University to study how brain network states differ
  with cognitive decline in Parkinson's disease.

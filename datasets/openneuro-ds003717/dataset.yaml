name: Visual and audiovisual speech perception fMRI (ds003717)
full_name: >-
  Visual and audiovisual speech perception associated with increased functional connectivity between sensory and motor
  regions
summary: >-
  Task fMRI with T1- and T2-weighted brain MRI of young right-handed adults who watched, heard or both watched and heard
  single spoken words, including audiovisual words in background babble. 60 participants from St. Louis at 3T, in BIDS
  under CC0.
homepage: https://openneuro.org/datasets/ds003717
doi: 10.18112/openneuro.ds003717.v1.1.0

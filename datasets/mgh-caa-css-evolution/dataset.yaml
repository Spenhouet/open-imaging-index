id: mgh-caa-css-evolution
name: MGH CAA cohort, cSS evolution set
full_name: Massachusetts General Hospital probable cerebral amyloid angiopathy cohort, cortical superficial siderosis evolution set
summary: >-
  Baseline and follow-up 1.5 T MRI with T2*-GRE or SWI of 118 patients with probable CAA without intracerebral
  haemorrhage from Massachusetts General Hospital (2000-2015), with visual ratings of siderosis progression and new
  microbleeds. Not publicly shared.
homepage: https://doi.org/10.1161/STROKEAHA.118.023368
doi: 10.1161/STROKEAHA.118.023368
# Year of the paper that describes the set; the images have not been released.

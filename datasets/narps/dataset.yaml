full_name: Neuroimaging Analysis Replication and Prediction Study
summary: >-
  Task fMRI and T1-weighted brain MRI of healthy young adults performing a mixed gambles task, collected so that many
  independent teams could analyse the same data to measure analytic variability. 108 subjects from Tel Aviv, in BIDS
  on OpenNeuro with fMRIPrep and MRIQC outputs.

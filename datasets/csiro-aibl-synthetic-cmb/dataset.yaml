name: AIBL Synthetic Cerebral Microbleeds on SWI
full_name: Synthetic Cerebral Microbleed on SWI images (CSIRO Data Access Portal collection 50304)
summary: >-
  Susceptibility-weighted brain MRI with expert-located cerebral microbleeds, plus copies with synthetic microbleeds
  at known positions, for training and benchmarking microbleed detectors when real labels are scarce. 370 scans from
  an Australian ageing study (57 with microbleeds) and 3,700 synthetic copies.

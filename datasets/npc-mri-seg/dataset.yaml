id: npc-mri-seg
name: NPC MRI Segmentation
full_name: A dataset of primary nasopharyngeal carcinoma MRI with multi-modalities segmentation
summary: >-
  Head MRI of untreated patients with primary nasopharyngeal carcinoma, with radiologist tumor masks on T1-weighted,
  T2-weighted and contrast-enhanced T1-weighted scans, released for tumor segmentation research together with staging,
  Epstein-Barr virus markers and 5-year progression-free survival.
homepage: https://zenodo.org/records/13131827
doi: 10.5281/zenodo.13131827

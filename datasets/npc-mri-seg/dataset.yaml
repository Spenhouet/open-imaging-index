    url: https://doi.org/10.1038/s41597-025-05815-x
species: human
modalities: [MR]
contrasts: [T1w, T2w, T1w_ce]
anatomy: [nasopharynx]
conditions: [nasopharyngeal_carcinoma]
tasks: [segmentation, survival]
formats: [DICOM, NIfTI]
countries: [CN]

id: duke-liver-dlds
name: Duke Liver Dataset (DLDS)
full_name: Duke Liver Dataset (MRI)
summary: >-
  2146 abdominal MRI series of 105 patients scanned for suspected liver cirrhosis at Duke, with series-type labels
  in 17 classes and manual whole-liver masks for 310 series, for MRI series classification and liver segmentation.
homepage: https://zenodo.org/records/7774566
doi: 10.5281/zenodo.7774566
year: 2022
updated: 2023
version: 2.0.0
status: active

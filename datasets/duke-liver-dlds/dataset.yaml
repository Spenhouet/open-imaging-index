    url: https://zenodo.org/records/7774566
species: human
modalities: [MR]
contrasts: [T1w, T1w_ce, T2w, dwi, ADC]
anatomy: [liver, abdomen]
conditions: [liver_cirrhosis]
tasks: [segmentation, classification]
formats: [DICOM]
countries: [US]
vendors: [siemens, ge]
field_strengths: [1.5, 3]
access:
  type: application
  url: https://zenodo.org/records/7774566
  note: >-
    Files are restricted on Zenodo. Request access through the record's form, giving your affiliation and a short
    description of the intended use; Duke University reviews the request.
licenses:
  - license: CC-BY-NC-ND-4.0
    applies_to: All files of the Zenodo record (series classification and segmentation groupings).
    note: >-

full_name: MIND Clinical Imaging Consortium (MCIC) collection
summary: >-
  Structural, diffusion and task fMRI brain scans with clinical and cognitive data of people with schizophrenia and
  matched controls, collected to find imaging markers of schizophrenia. 162 patients and 169 controls at four US
  sites; three sites share through COINS.

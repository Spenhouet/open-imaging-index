id: mcic
name: MCIC
full_name: MIND Clinical Imaging Consortium (MCIC) collection
summary: >-
  Four-site US study of 162 people with schizophrenia and 169 matched controls with raw DICOM T1w, T2w, diffusion and
  task fMRI plus clinical and cognitive data. Data from three of the sites are shared through COINS under a data use
  agreement.

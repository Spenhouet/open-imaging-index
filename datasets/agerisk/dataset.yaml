name: AgeRisk (ds004711)
summary: >-
  Brain fMRI of healthy adults doing a balloon risk-taking task and a delay discounting task, collected
  to study how risk preference, impulsivity and self-control change across the adult lifespan. 187 people from
  Basel, Switzerland, aged 16 to 81, with a T1-weighted scan each.

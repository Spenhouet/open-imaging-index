id: gut-microbiota-hrv-fmri-colombia
name: Gut microbiota, HRV and resting fMRI in healthy men
full_name: >-
  Sympathovagal quotient and functional connectivity of control networks are related to gut Ruminococcaceae abundance
  in healthy men
summary: >-
  Structural and resting-state functional brain MRI from healthy young Colombian men, collected to relate heart rate
  variability and brain network connectivity to gut microbiota composition and diet, with per-subject heart rate,
  microbiome and dietary measures.

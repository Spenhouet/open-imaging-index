id: nick
name: NiCK Study
full_name: >-
  Magnetic Resonance Imaging (MRI) Analysis and Neurocognitive Assessment of Children and Young Adults with Chronic
  Kidney Disease (CKD) "NiCK" Study
summary: >-
  Multimodal brain MRI of children and young adults aged 8 to 25 with chronic kidney disease and matched healthy
  controls, collected to relate kidney function, anemia and blood pressure to brain structure, perfusion, connectivity
  and neurocognitive test results.

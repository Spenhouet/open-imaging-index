id: prostate158
name: Prostate158
full_name: Prostate158 expert-annotated biparametric 3T prostate MRI dataset
summary: >-
  Biparametric 3 T prostate MRI (T2w, DWI, ADC) of 158 men with suspected prostate cancer from Charité Berlin, with
  expert segmentations of the central gland, peripheral zone and PI-RADS 4 to 5 lesions, split into 139 training and
  19 test cases.

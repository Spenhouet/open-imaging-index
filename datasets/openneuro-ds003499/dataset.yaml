name: Value-guided memory development fMRI (ds003499)
full_name: Developmental change in prefrontal cortex recruitment supports the emergence of value-guided memory
summary: >-
  Brain fMRI of children, adolescents and adults learning item frequencies and then encoding and retrieving associations,
  collected to study how the use of learned value to guide memory develops. 90 participants aged 8 to 25 from NYU,
  multi-echo BOLD with T1w and T2w, in BIDS under CC0.

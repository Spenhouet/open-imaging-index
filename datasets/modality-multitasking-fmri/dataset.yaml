id: modality-multitasking-fmri
name: Modality-based Multitasking and Practice - fMRI
summary: >-
  Task and resting-state fMRI of healthy young adults, collected to study how pairing input and output modalities
  affects dual-task interference before and after 80 minutes of multitasking practice. Covers 58 participants with
  pre- and post-practice sessions at 3T.
homepage: https://openneuro.org/datasets/ds005038
doi: 10.18112/openneuro.ds005038.v1.0.3

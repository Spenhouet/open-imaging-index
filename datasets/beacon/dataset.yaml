id: beacon
name: BEACON Anorexia Nervosa MRI (ds007606)
full_name: Brain imaging of Emotion And Cognition of adolescents with Anorexia Nervosa (BEACON)
summary: >-
  Structural brain MRI of young women with acute anorexia nervosa, women weight-restored after anorexia nervosa and
  healthy controls, collected to study brain differences in anorexia nervosa and their link to autistic
  characteristics, with a follow-up scan about two and a half years later.

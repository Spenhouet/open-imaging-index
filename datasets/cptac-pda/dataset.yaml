# yaml-language-server: $schema=../../schema/dataset.schema.json
id: cptac-pda
name: CPTAC-PDA
full_name: The Clinical Proteomic Tumor Analysis Consortium Pancreatic Ductal Adenocarcinoma Collection (CPTAC-PDA)
summary: >-
  Standard-of-care CT, MRI, PET and ultrasound and whole-slide pathology images of 168 patients from the NCI CPTAC
  pancreatic ductal adenocarcinoma cohort, linked by patient ID to proteomic, genomic and clinical data in the NCI data
  commons.
homepage: https://www.cancerimagingarchive.net/collection/cptac-pda/
doi: 10.7937/k9/tcia.2018.sc20fo18
year: 2018
updated: 2025
version: '15'
status: active
creators:
  - name: National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)
    url: https://proteomics.cancer.gov/programs/cptac
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [CT, MR, PT, US, SM]
anatomy: [pancreas]
conditions: [pancreatic_cancer]
formats: [DICOM, SVS]
size_gb: 155.24
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/cptac-pda/
  note: >-
    DICOM radiology is downloaded with the TCIA Data Retriever from a manifest file, slides through IBM Aspera. No
    account is needed. Clinical, proteomic and genomic data are in the Proteomic and Genomic Data Commons.
licenses:
  - license: CC-BY-4.0
    url: https://www.cancerimagingarchive.net/collection/cptac-pda/
citation:
  text: >-
    National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC). (2018). The Clinical Proteomic
    Tumor Analysis Consortium Pancreatic Ductal Adenocarcinoma Collection (CPTAC-PDA) (Version 15) [dataset]. The
    Cancer Imaging Archive. https://doi.org/10.7937/k9/tcia.2018.sc20fo18. Acknowledgement: "Data used in this
    publication were generated by the National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)."
sources:
  tcia-cptac-pda:
    title: TCIA CPTAC-PDA collection page (version 15, updated 2025/02/26)
    url: https://www.cancerimagingarchive.net/collection/cptac-pda/
    kind: website
  tcia-cptac-pda-digest:
    title: >-
      TCIA CPTAC-PDA radiology metadata digest (TCIA-CPTAC-PDA_v15_20250226-nbia-digest-1.xlsx, open download, CC BY
      3.0 per its License Name column), counted per unique Patient ID
    url: https://www.cancerimagingarchive.net/wp-content/uploads/TCIA-CPTAC-PDA_v15_20250226-nbia-digest-1.xlsx
    kind: computed
related: [cptac-ccrcc]
keywords: [pancreatic cancer, proteogenomics, radiogenomics, CPTAC, whole-slide imaging]
verified:
  date: '2026-10-09'
  by: Spenhouet-agent

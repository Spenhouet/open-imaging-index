name: False memory audio-visual DRM fMRI (ds002731)
full_name: Multiple interactive memory representations underlie the induction of false memory
summary: >-
  Task fMRI and T1-weighted brain MRI of 59 healthy Chinese college students who studied word lists by ear or by eye
  and were tested visually in a Deese-Roediger-McDermott false memory paradigm. Released in BIDS under CC0 with
  encoding and retrieval runs.

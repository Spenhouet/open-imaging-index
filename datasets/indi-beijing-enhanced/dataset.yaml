id: indi-beijing-enhanced
name: INDI Beijing Enhanced
full_name: Beijing Normal University Enhanced Sample (INDI Retrospective)
summary: >-
  Resting-state fMRI, T1-weighted MPRAGE and 64-direction DTI from 180 healthy students at Beijing Normal University,
  with Wechsler IQ scores for 55 of them. Extends the Beijing_Zang sample of the 1000 Functional Connectomes Project.
homepage: https://fcon_1000.projects.nitrc.org/indi/retro/BeijingEnhanced.html
year: 2010
status: active
creators:
  - name: State Key Laboratory of Cognitive Neuroscience and Learning, Beijing Normal University (Yu-Feng Zang)
    url: https://fcon_1000.projects.nitrc.org/indi/retro/BeijingEnhanced.html
  - name: International Neuroimaging Data-sharing Initiative (INDI)
    url: https://fcon_1000.projects.nitrc.org/
species: human
modalities: [MR]
contrasts: [bold, T1w, dwi]
anatomy: [brain]
conditions: [healthy]
tasks: [normative]
formats: [NIfTI]
countries: [CN]
access:
  type: registration
  url: https://www.nitrc.org/project/request.php?group_id=296
licenses:
  - license: LicenseRef-INDI-FCP-Terms
    note: >-
      The release page states "Creative Commons License: Attribution - Non-Commercial" as its usage agreement. Downloads
      need a NITRC account and membership in the 1000 Functional Connectomes Project on NITRC.

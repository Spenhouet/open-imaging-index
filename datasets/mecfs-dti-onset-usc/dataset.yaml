id: mecfs-dti-onset-usc
name: ME/CFS post-infectious vs gradual onset DTI maps (UniSC)
full_name: >-
  Dataset of preprocessed DTI metrics from patients with post-infectious and gradual onset ME/CFS and health controls
  with sedentary lifestyles
summary: >-
  Per-subject white matter diffusion tensor maps of adults with post-infectious or gradual onset myalgic
  encephalomyelitis/chronic fatigue syndrome (ME/CFS) and sedentary controls, shared to replicate a study comparing
  white matter changes between the two onset types.

id: cortical-myelin-depression
name: Cortical Myelin in Depressive Disorders (ds003653)
full_name: Cortical myelin measured by the T1w/T2w ratio in individuals with depressive disorders and healthy controls
summary: >-
  Structural brain MRI (T1-weighted and T2-weighted) of young adults with unipolar depression and healthy controls,
  collected to test whether cortical myelin estimated from the T1w/T2w ratio separates patients from controls.
homepage: https://openneuro.org/datasets/ds003653
doi: 10.18112/openneuro.ds003653.v1.0.0

id: cmr-cied-artifacts
name: CMR with device susceptibility artifacts (Penso 2022)
full_name: >-
  Dataset related to the article "Cardiovascular magnetic resonance images with susceptibility artifacts: artificial
  intelligence with spatial-attention for ventricular volumes and mass assessment"
summary: >-
  Cardiac cine MRI of patients with and without pacemakers or implantable defibrillators, collected to train and test
  automatic segmentation of both ventricles and the left ventricular myocardium in images degraded by metal
  susceptibility artifacts. Two Italian centers, expert contours. Access restricted.
homepage: https://zenodo.org/records/7395773

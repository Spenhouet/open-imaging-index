id: smi-research-dataset
name: Scottish Medical Imaging (SMI) Archive
full_name: Scottish Medical Imaging (SMI) Archive and SMI Research Dataset
summary: >-
  Population-scale copy of the Scottish national PACS: 57.3 million radiology studies (2010 to August 2018) of about
  4.27 million patients, linkable to NHS Scotland health records. Approved projects analyse CT, MRI, PET and report
  extracts inside the Scottish National Safe Haven.
homepage: https://publichealthscotland.scot/resources-and-tools/health-intelligence-and-data-management/scottish-medical-imaging-smi/overview/
# The Scottish Medical Imaging Service opened to researchers in April 2022 (EPCC announcement).
year: 2022
status: active
creators:
  - name: Public Health Scotland, electronic Data Research and Innovation Service (eDRIS)
    url: https://publichealthscotland.scot/resources-and-tools/health-intelligence-and-data-management/scottish-medical-imaging-smi/overview/
  - name: EPCC, University of Edinburgh
    url: https://www.epcc.ed.ac.uk/
  - name: Health Informatics Centre, University of Dundee
modalities: [CT, MR, PT, CR, US]
anatomy: [whole_body]
formats: [DICOM]
countries: [GB]

id: fetal-fmri
name: Fetal resting-state fMRI brain masks (WSU)
full_name: fetal-fMRI, raw volumes and manual brain masks from the Wayne State University fetal cohort
summary: >-
  Resting-state functional MRI of fetuses in utero with hand-drawn fetal brain masks, released to train and test
  automatic separation of the fetal brain from surrounding maternal tissue. Single volumes from 159 fetuses scanned in
  Detroit, some at two time points.
homepage: https://openneuro.org/datasets/ds003090
doi: 10.18112/openneuro.ds003090.v1.0.0

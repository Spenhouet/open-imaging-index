name: Self-Regulation fMRI (ds004636)
full_name: Cognitive tasks, anatomical MRI, and functional MRI data evaluating the construct of self-regulation
summary: >-
  Brain fMRI of healthy adults at rest, during nine self-regulation tasks and during an in-scanner survey, collected
  to map the neural basis of self-regulation, with T1-weighted and T2-weighted scans. 110 people aged 18 to 45,
  scanned in two sessions at Stanford.

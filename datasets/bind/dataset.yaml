  - name: Brain Data Science Platform (BDSP)
    url: https://bdsp.io/
  - name: Massachusetts General Hospital and Brigham and Women's Hospital (Mass General Brigham)
  - name: Stanford University
  - name: Beth Israel Deaconess Medical Center
species: human
modalities: [MR, CT, PT, NM]
anatomy: [brain]
formats: [NIfTI, BIDS]
countries: [US]
field_strengths: [1.5, 3, 7]
access:

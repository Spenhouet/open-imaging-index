id: bind
name: BIND
full_name: The Brain Imaging and Neurophysiology Database
summary: >-
  Routine clinical brain MRI, CT, PET and SPECT from patients who had EEG or sleep studies, linked to their
  neurophysiology recordings and radiology reports for multimodal brain research. Converted to BIDS NIfTI, with
  LLM-extracted findings and automatic sequence labels.
homepage: https://bdsp.io/content/n1vba1x5qt62frfjem65/
doi: 10.60508/mby8-3a26
year: 2025
version: '1.0'
status: active

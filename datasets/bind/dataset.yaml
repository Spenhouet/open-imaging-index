  url: https://bdsp.io/content/n1vba1x5qt62frfjem65/1.0/
  note: >-
    BDSP credentialed account, CITI "Data or Specimens Only Research" training, a signed data use agreement and an
    AWS account ID. The paper states that commercial entities may get access through a separate institutional
    agreement with the participating hospitals.

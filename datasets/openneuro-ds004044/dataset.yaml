id: openneuro-ds004044
name: Whole-body somatotopic mapping fMRI (ds004044)
full_name: An fMRI dataset for whole-body somatotopic mapping in humans
summary: >-
  Task fMRI and structural brain MRI of healthy right-handed young adults moving twelve body parts from toes to eyes,
  collected to map whole-body somatotopic organization across cortex, subcortex and cerebellum. 62 participants
  scanned at 3T in Beijing, in BIDS under CC0.
homepage: https://openneuro.org/datasets/ds004044
doi: 10.18112/openneuro.ds004044.v2.0.3

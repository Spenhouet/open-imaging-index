name: Protecting the Aging Brain (PAgB) ketosis fMRI
full_name: Protecting the Aging Brain - fMRI study of the brain in ketosis
summary: >-
  Resting-state functional and structural brain MRI from healthy adults aged 21 to 79, scanned fasted and again after a
  ketone ester or calorie-matched glucose drink, to test whether ketones stabilize brain networks across the lifespan.

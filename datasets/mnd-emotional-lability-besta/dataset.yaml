id: mnd-emotional-lability-besta
name: Emotional lability in motor neuron disease (Besta)
full_name: >-
  Dataset related to article: Pathological laugher and crying in motor neuron diseases: a matter of bulbar and
  neurobehavioral involvement with sex imbalance
summary: >-
  Demographic, clinical, neuropsychological and structural brain MRI data of 198 incident patients with motor neuron
  disease from one Milan centre, collected to study pathological laughter and crying and its links to bulbar,
  behavioural and cortical changes. Access restricted.

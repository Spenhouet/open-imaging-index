name: Mental states and traits fMRI (ds004217)
full_name: Interacting representations of mental states and traits (OpenNeuro ds004217)
summary: >-
  Task fMRI and T1-weighted brain MRI of young adults during trials cued by mental state words such as affection,
  embarrassment and self-pity, collected to study how the brain represents others' mental states and traits together.
  67 participants from Princeton, in BIDS under CC0.

id: b-snip
name: B-SNIP 1
full_name: Bipolar-Schizophrenia Network on Intermediate Phenotypes (B-SNIP 1)
summary: >-
  Five-site US study of 933 probands with schizophrenia, schizoaffective disorder or psychotic bipolar I disorder,
  1,055 first-degree relatives and 459 healthy controls, with 3T structural, diffusion and resting-state MRI, EEG, eye
  tracking and cognition, shared through the NIMH Data Archive.

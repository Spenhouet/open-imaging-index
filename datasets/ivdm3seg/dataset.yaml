id: ivdm3seg
name: IVDM3Seg
full_name: 'IVDM3Seg: Automatic Intervertebral Disc Localization and Segmentation from 3D Multi-modality MR (M3) Images (MICCAI 2018 challenge, SpineWeb Dataset 14)'
summary: >-
  1.5 T Siemens Dixon MRI of the lower spine from 12 subjects scanned at two stages of a prolonged bed rest study (24
  scan sets, 96 volumes), with manual masks of at least 7 intervertebral discs. Training part of 8 subjects shared after
  a signed agreement.
homepage: https://ivdm3seg.weebly.com/
year: 2018
creators:
  - name: Guoyan Zheng, University of Bern
  - name: Daniel Belavy, Deakin University
  - name: Shuo Li, University of Western Ontario
modalities: [MR]
contrasts: [dixon]
anatomy: [intervertebral_disc]
tasks: [segmentation, detection]
formats: [NIfTI]
vendors: [siemens]
field_strengths: [1.5]
access:
  type: signed_agreement
  url: https://ivdm3seg.weebly.com/data.html
licenses:
  - license: LicenseRef-IVDM3Seg-Agreement
    applies_to: Training data (16 scan sets of 8 subjects)
    note: >-
      The test data were kept by the organizers for the on-site competition and are not released. The SpineWeb entry
      for Dataset 14 says to contact Dr. Zheng to obtain the data.
citation:

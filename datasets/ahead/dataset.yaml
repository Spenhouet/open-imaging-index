id: ahead
name: AHEAD
full_name: >-
  The Amsterdam Ultra-high field adult lifespan database (AHEAD): A freely available multimodal 7 Tesla submillimeter
  magnetic resonance imaging database
summary: >-
  Quantitative whole-brain MRI maps (T1, T2*, susceptibility) of healthy adults aged 18 to 80, built as a normative
  resource for mapping the human subcortex across the lifespan, with probability maps of five basal ganglia nuclei.
  7 T, submillimeter, 105 people.

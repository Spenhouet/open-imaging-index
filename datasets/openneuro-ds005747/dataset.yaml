name: 7T fMRI Resting-state Dataset (ds005747)
full_name: 7T fMRI Resting-state Dataset
summary: >-
  Ultra-high field brain MRI from healthy young adults, with one T1-weighted image and three eyes-open
  resting-state fMRI runs per person plus preprocessed BOLD, collected at 7 tesla at the MGH Martinos Center to map
  the allostatic-interoceptive system. 90 people aged 18 to 40.
homepage: https://openneuro.org/datasets/ds005747

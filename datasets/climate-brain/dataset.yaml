id: climate-brain
name: CLIMATE BRAIN
full_name: CLIMATE BRAIN - Questionnaires, Tasks and the Neuroimaging Dataset
summary: >-
  Brain MRI and task fMRI of healthy young Polish adults who read anger- and hope-evoking climate change stories and made
  pro-environmental choices, collected to study climate emotions and decisions. Includes climate questionnaires, raw and
  fMRIPrep data.
homepage: https://openneuro.org/datasets/ds005460
doi: 10.18112/openneuro.ds005460.v2.0.0

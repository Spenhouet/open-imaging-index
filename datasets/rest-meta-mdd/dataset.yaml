    doi:10.1073/pnas.1900390116. Chen X, Lu B, Li HX, et al. The DIRECT consortium and the REST-meta-MDD project:
    towards neuroimaging biomarkers of major depressive disorder. Psychoradiology 2(1):32-42 (2022).
    doi:10.1093/psyrad/kkac005

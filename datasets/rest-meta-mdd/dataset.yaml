id: rest-meta-mdd
name: REST-meta-MDD
full_name: Data of the REST-meta-MDD Project from DIRECT Consortium
summary: >-
  Resting-state fMRI derivatives (R-fMRI indices and ROI time series) of 1300 patients with major depressive disorder
  and 1128 controls from 25 cohorts at 17 Chinese hospitals, preprocessed with one DPARSF pipeline. Download is open,
  the unzip password needs a signed agreement.
homepage: https://www.scidb.cn/detail?dataSetId=cbeb3c7124bf47a6af7b3236a3aaf3a8
doi: 10.57760/sciencedb.o00115.00013
year: 2019
updated: 2026
version: V3
status: active
creators:
  - name: DIRECT Consortium (Depression Imaging REsearch ConsorTium), 25 research groups from 17 hospitals in China
  - name: The R-fMRI Lab (Chao-Gan Yan), Institute of Psychology, Chinese Academy of Sciences
    url: http://rfmri.org/REST-meta-MDD
species: human
modalities: [MR]
contrasts: [bold]
anatomy: [brain]
conditions: [depression, healthy]
tasks: [classification]
countries: [CN]
vendors: [siemens, ge, philips]
field_strengths: [1.5, 3]
# DataCite metadata of the ScienceDB record: 115514223968 bytes in 3 files.
size_gb: 115.5
access:
  type: signed_agreement
  url: https://www.scidb.cn/detail?dataSetId=cbeb3c7124bf47a6af7b3236a3aaf3a8
  note: >-
    The archives download from Science Data Bank without an account (FTP is recommended for the size), but they are
    encrypted. The unzip password and the phenotypic information are sent after a scanned, signed copy of the data
    use agreement is emailed to rfmrilab@gmail.com.
licenses:

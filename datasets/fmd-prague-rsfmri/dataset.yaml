id: fmd-prague-rsfmri
name: Prague Functional Movement Disorder Resting-State fMRI
full_name: Centrality and seed-based correlation maps obtained with functional MRI
summary: >-
  Resting-state BOLD fMRI of adults with functional movement disorder and healthy controls, used to relate brain
  network centrality to motor symptom severity. Images are shared on request; per-subject connectivity maps are public.
homepage: https://data.mendeley.com/datasets/w35fvmtnf2
doi: 10.17632/w35fvmtnf2
year: 2022
creators:
  - name: Department of Neurology and Center of Clinical Neuroscience, Charles University and General University Hospital in Prague
    url: https://ror.org/024d6js02
  - name: Max Planck Institute for Human Cognitive and Brain Sciences, Leipzig
modalities: [MR]
contrasts: [bold]
anatomy: [brain]
conditions: [functional_neurological_disorder, healthy]
countries: [CZ]
vendors: [siemens]
field_strengths: [3]
access:
  type: on_request
  url: https://doi.org/10.1016/j.nicl.2022.102981
  note: >-
    The data availability statement of Mueller et al. (2022) says the analysed data are available on reasonable request,
    with the functional MRI given as anonymized pre-processed NIfTI files. The per-subject connectivity maps (global
    correlation, intrinsic connectivity, eigenvector centrality and seed-based correlation) and the SPM12 group analyses
    are an open download on Mendeley Data under CC BY 4.0.
licenses:
  - license: CC-BY-4.0

id: determine
name: DETERMINE (Cardiac Atlas Project)
full_name: Defibrillators to Reduce Risk by Magnetic Resonance Imaging Evaluation, Cardiac Atlas Project collection
summary: >-
  Cardiac MRI of 450 patients with coronary artery disease and myocardial infarction from the multicentre DETERMINE
  trial, hosted by the Cardiac Atlas Project: cine SSFP and late gadolinium enhancement images with core-lab contours
  and 3D left ventricular models, shared under a per-project agreement.

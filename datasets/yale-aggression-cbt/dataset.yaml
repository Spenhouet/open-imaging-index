name: Yale Childhood Aggression CBT fMRI
full_name: Using CBT to Examine Circuitry of Frustrative Non-reward in Aggressive Children (RDoC-CBT, NCT01965184)
summary: >-
  Task fMRI of children with clinically significant aggression across psychiatric diagnoses and healthy controls,
  scanned before a randomized trial of cognitive-behavioral therapy versus supportive psychotherapy at the Yale Child
  Study Center. 100 aggressive children and 29 controls aged 8 to 16.

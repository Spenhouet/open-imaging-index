  Brain MRI and task fMRI of typically developing school-aged children judging rhyme, spelling and meaning of word
  pairs, heard or seen, collected to study how reading develops. 91 children aged 8.7 to 15.5 years from the Chicago
  area, with reading and cognitive tests, in BIDS under CC0.

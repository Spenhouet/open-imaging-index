id: dynamic-passive-threat
name: Dynamic_Passive_Threat
full_name: Dynamic threat-of-shock fMRI (Dynamic Threat Processing)
summary: >-
  Task fMRI with T1- and T2-weighted brain MRI of healthy adults watching two moving circles whose collision triggers
  an electric shock, collected to study how threat proximity, direction (approach or retreat) and speed shape brain
  responses during anticipation of threat.
homepage: https://openneuro.org/datasets/ds002320
doi: 10.18112/openneuro.ds002320.v1.1.0

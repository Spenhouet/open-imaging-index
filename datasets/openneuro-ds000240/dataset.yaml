full_name: Resting State Perfusion in Healthy Aging
summary: >-
  Resting-state arterial spin labeling perfusion MRI and T1-weighted brain scans of cognitively healthy young and older
  adults, shared to study how cerebral blood flow changes with age. 63 participants, with neuropsychological test
  scores for the older group, in BIDS under CC0.

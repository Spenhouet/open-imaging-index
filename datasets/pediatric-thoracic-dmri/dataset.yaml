id: pediatric-thoracic-dmri
name: Pediatric thoracic 4D dynamic MRI normative database
full_name: A normative database of free-breathing pediatric thoracic 4D dynamic MRI images
summary: >-
  Dynamic MRI of the thorax and abdomen in healthy children during free breathing, built as a normative reference for
  regional respiratory function, with ten organ and body masks at end expiration and end inspiration and lung and
  excursion volumes per child.

full_name: >-
  NeuroEngage: A Multimodal Dataset Integrating fMRI for Analyzing Conversational Engagement in Human-Human and
  Human-Robot Interactions
summary: >-
  Task fMRI and structural brain MRI of healthy adults holding free spoken conversations with a human or a teleoperated
  robot, collected to study how the partner's level of engagement shapes brain activity and speech. Includes eye
  tracking, audio and video.

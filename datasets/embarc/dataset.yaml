id: embarc
name: EMBARC
full_name: Establishing Moderators and Biosignatures of Antidepressant Response in Clinical Care (EMBARC)
summary: >-
  US four-site placebo-controlled trial of sertraline in 309 adults with early-onset or recurrent major depression plus
  40 healthy controls, with 3T structural, task and resting-state fMRI, diffusion and ASL MRI before and one week into
  treatment, shared through the NIMH Data Archive.
homepage: https://nda.nih.gov/edit_collection.html?id=2199

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: adni
name: ADNI
full_name: Alzheimer's Disease Neuroimaging Initiative (ADNI1, ADNI GO, ADNI2, ADNI3)
summary: >-
  Longitudinal multi-site study in the US and Canada with repeated structural and advanced MRI, FDG, amyloid and tau
  PET, biofluids and cognitive testing of cognitively unimpaired older adults and people with MCI or Alzheimer's
  dementia.
homepage: https://adni.loni.usc.edu/
# Year the study launched (October 2004, per the ADNI website). The date of the first public data release was not
# verified separately.
year: 2004
status: active
creators:
  - name: Alzheimer's Disease Neuroimaging Initiative (PI Michael W. Weiner)
    url: https://adni.loni.usc.edu/
  - name: Laboratory of Neuro Imaging (LONI), University of Southern California
    url: https://ida.loni.usc.edu/
species: human
modalities: [MR, PT]
contrasts: [T1w, T2w, PDw, FLAIR, T2starw, dwi, bold, asl]
tracers: [fdg, pib, florbetapir, flortaucipir]
anatomy: [brain]
conditions: [healthy, mci, alzheimers, cerebral_microbleeds, superficial_siderosis]
tasks: [classification, regression, longitudinal, segmentation]
formats: [DICOM, NIfTI]
countries: [US, CA]
vendors: [ge, philips, siemens]
field_strengths: [1.5, 3]
access:
  type: application
  url: https://ida.loni.usc.edu/collaboration/access/appApply.jsp?project=ADNI
licenses:
  - license: LicenseRef-ADNI-DUA
citation:
  text: >-
    Add "for the Alzheimer's Disease Neuroimaging Initiative*" to the author line and use the methods and funding text
    given in the ADNI Data Use Agreement. Cohort reference: Petersen RC, et al. Alzheimer's Disease Neuroimaging
    Initiative (ADNI): clinical characterization. Neurology 74(3):201-209 (2010). doi:10.1212/WNL.0b013e3181cb3e25
sources:
  review2023:
    title: Veitch DP et al. 2023, The ADNI in the era of Alzheimer's disease treatment, Alzheimer's & Dementia
    url: https://doi.org/10.1002/alz.13449
    kind: paper
  adni-about:
    title: ADNI website, About (phases and planned cohorts)
    url: https://adni.loni.usc.edu/about/
    kind: website
  mri:
    title: ADNI website, MRI protocols by phase
    url: https://adni.loni.usc.edu/data-samples/adni-data/neuroimaging/mri/
    kind: website
  jack2024:
    title: Jack CR Jr et al. 2024, Overview of ADNI MRI, Alzheimer's & Dementia
    url: https://doi.org/10.1002/alz.14166
    kind: paper
  adni3-mri-protocol:

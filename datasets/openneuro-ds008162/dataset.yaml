id: openneuro-ds008162
name: Precision Drawing fMRI, Nerve Injury (ds008162)
full_name: Precision drawing during task fMRI in healthy adults and individuals with peripheral nerve injury
summary: >-
  Task fMRI of right-handed adults drawing with each hand on an MRI-compatible tablet, collected to study how the
  non-dominant left hand learns precision drawing in healthy people and after peripheral nerve injury to the right
  arm. Adds resting-state fMRI, T1w, T2w, diffusion MRI and drawing kinematics.
homepage: https://openneuro.org/datasets/ds008162
doi: 10.18112/openneuro.ds008162.v1.0.3

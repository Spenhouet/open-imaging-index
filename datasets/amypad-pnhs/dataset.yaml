    url: https://doi.org/10.1038/s41597-026-07988-5
    kind: paper
  bollack2025:
    title: Bollack A et al. 2025, Implementing robust amyloid PET quantification in multi-center studies, the AMYPAD approach
    url: https://doi.org/10.1002/trc2.70190
    kind: paper
  amypad-dar:

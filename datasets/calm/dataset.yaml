id: calm
name: CALM
full_name: Centre for Attention, Learning and Memory (CALM) cohort, CALM:Open release
summary: >-
  Brain MRI and cognitive tests of children who struggle with attention, learning or memory, with peers from the same
  schools, collected to relate neurodevelopmental difficulties to brain structure and function. Children aged 5 to 18
  from Cambridge, UK; 440 have structural, diffusion and resting-state MRI.
homepage: https://calm.mrc-cbu.cam.ac.uk/
doi: 10.1186/s12887-018-1385-3

id: unicamp-refractory-epilepsy-fdg-pet
name: Refractory epilepsy FDG PET/CT (Unicamp)
full_name: Interictal and postictal 18F-FDG PET/CT in epileptogenic zone localization
summary: >-
  Brain FDG PET/CT of surgical candidates with drug-refractory focal epilepsy at a university hospital in Campinas,
  Brazil, acquired under EEG monitoring to compare postictal with interictal localization of the epileptogenic zone.
  110 patients. Images not shared.
homepage: https://doi.org/10.1590/0100-3984.2021.0141
year: 2022

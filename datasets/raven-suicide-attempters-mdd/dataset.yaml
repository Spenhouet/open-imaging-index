vendors: [siemens]
field_strengths: [3]
size_gb: 0.05
access:
  type: not_shared
  url: https://doi.org/10.1371/journal.pone.0327562
  note: >-
    The Harvard Dataverse deposit (CC0 1.0, open download without an account) holds only a clinical table and a
    47 MB archive with one ALFF_FunImgARCW archive per group (HC, MDD, SI). Neither the paper nor the deposit offers
    the raw or preprocessed T1-weighted or functional MRI, or the simultaneously recorded EEG.

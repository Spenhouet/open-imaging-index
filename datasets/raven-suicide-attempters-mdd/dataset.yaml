id: raven-suicide-attempters-mdd
name: Tehran Raven Task fMRI in Recent Suicide Attempters
full_name: 'Replication Data for: Neuroimaging Insights into Recent Suicide Attempters Utilizing the Raven Task'
summary: >-
  Task fMRI during a Raven matrices reasoning task in adults with major depressive disorder who recently attempted
  suicide, depressed patients without an attempt and healthy controls. Scans are not public; group-wise ALFF maps and
  clinical scores are open under CC0.
homepage: https://doi.org/10.7910/DVN/LPWPRC
doi: 10.7910/DVN/LPWPRC
year: 2024

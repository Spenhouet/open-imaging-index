id: bonbid-hie
name: BONBID-HIE
full_name: 'BOston Neonatal Brain Injury Data for Hypoxic Ischemic Encephalopathy (BONBID-HIE): I. MRI and Manual
  Lesion Annotation'
summary: >-
  Neonatal brain diffusion MRI from 133 term-born infants with hypoxic ischemic encephalopathy at Massachusetts
  General Hospital: skull-stripped ADC maps, ZADC deviation maps and expert lesion masks, used in the MICCAI 2023
  BONBID-HIE lesion segmentation challenge.
homepage: https://zenodo.org/records/10602767
doi: 10.5281/zenodo.10602767
# Training data went public on Zenodo on 2023-07-01. The record with training, validation and test data dates from 2024.
year: 2023
updated: 2024
creators:
  - name: Boston Children's Hospital and Harvard Medical School (Rina Bao, P. Ellen Grant, Yangming Ou and colleagues)
  - name: Massachusetts General Hospital
modalities: [MR]
contrasts: [ADC]

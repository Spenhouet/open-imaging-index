id: ms-neurorehab-rsfmri
name: MS Neurorehabilitation Resting-State fMRI
full_name: >-
  Open Access: The Effect of Neurorehabilitation on Multiple Sclerosis - Unlocking the Resting-State fMRI Data
summary: >-
  Preprocessed resting-state fMRI of people with multiple sclerosis, scanned before and after two months of
  neuroproprioceptive physiotherapy to study rehabilitation effects on functional connectivity. Includes connectivity
  matrices, motion measures and clinical data.
homepage: https://osf.io/p2kj7/
doi: 10.3389/fnins.2021.662784

# yaml-language-server: $schema=../../schema/dataset.schema.json
id: edinburgh-pvs-1-5t-vs-3t
name: Edinburgh PVS 1.5T vs 3T Pilot
full_name: >-
  Harmonisation of Enlarged Perivascular Spaces Quantified from Brain Magnetic Resonance Images acquired at 1.5T vs.
  3T, Data from a pilot study
summary: >-
  Brain MRI of healthy adult volunteers scanned back to back at 1.5T and 3T, collected to test whether perivascular
  space measurements can be harmonised across field strengths. Images are not shared; PVS scores, measurements and
  harmonisation scripts are public.
homepage: https://datashare.ed.ac.uk/handle/10283/8833
doi: 10.7488/ds/7782
year: 2024
creators:
  - name: Centre for Clinical Brain Sciences, University of Edinburgh
    url: https://datashare.ed.ac.uk/handle/10283/8833
modalities: [MR]
contrasts: [T1w, T2w, FLAIR, swi]
anatomy: [brain]
conditions: [healthy, enlarged_perivascular_spaces]
countries: [GB]
vendors: [ge, siemens]
field_strengths: [1.5, 3]
access:
  type: not_shared
  url: https://datashare.ed.ac.uk/handle/10283/8833
  note: >-
    The Edinburgh DataShare release holds no MRI images. It contains the imaging protocol table, per-scan PVS visual
    scores and automated PVS counts, volumes and lengths before and after harmonisation, and Matlab scripts, openly
    downloadable under CC BY 4.0.
licenses:
  - license: LicenseRef-No-Published-Terms
    note: >-
      No license or data use terms are stated for the MRI images. The CC BY 4.0 license of the DataShare item covers
      only the released measurements, documents and scripts.
citation:
  text: >-
    Valdés Hernández, M. C., Duarte Coello, R., Morozova, A., McFadden, J., Jardine, C., Barclay, G., MacIntyre, D.,

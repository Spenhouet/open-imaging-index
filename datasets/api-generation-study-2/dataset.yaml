    url: https://clinicaltrials.gov/study/NCT03131453
    kind: website
  brown2025:
    title: >-
      Brown et al. 2025, A resource of data and samples in cognitively unimpaired 60-75-year-olds at increased risk of
      Alzheimer's disease based on their APOE4 status, Alzheimer's & Dementia 21(S1):e107073
    url: https://doi.org/10.1002/alz70855_107073
    kind: paper
  api-generation-data-page:

id: tractseg-reference-tracts
name: TractSeg reference tracts (HCP105)
full_name: High quality white matter reference tracts
summary: >-
  Streamline reconstructions of major white matter tracts dissected from diffusion MRI of young adults, made as
  reference labels for training and testing automatic tract segmentation (TractSeg). Covers 72 tracts in 105 Human
  Connectome Project subjects; the images are not included.
homepage: https://zenodo.org/records/1477956

id: framingham-heart-study
name: Framingham Heart Study (FHS)
full_name: 'Framingham Heart Study, Framingham Cohort (dbGaP phs000007) and FHS-Cohort Imaging (dbGaP phs003593)'
summary: >-
  Echocardiograms, CT, and brain and cardiac MRI from a three-generation community cohort in Framingham,
  Massachusetts, followed since 1948 to find the causes of cardiovascular disease. Images are shared through dbGaP or a
  research application to the study.
homepage: https://www.framinghamheartstudy.org/
year: 2024
updated: 2025
version: phs003593.v2.p1
status: active
creators:
  - name: Framingham Heart Study, National Heart, Lung, and Blood Institute and Boston University
    url: https://www.framinghamheartstudy.org/
species: human
modalities: [US, CT, MR]
anatomy: [heart, brain]
tasks: [longitudinal]
formats: [DICOM]
countries: [US]
access:
  type: application
  url: https://www.ncbi.nlm.nih.gov/projects/gap/cgi-bin/study.cgi?study_id=phs003593
  note: >-
    Echocardiogram and CT images are requested through dbGaP study phs003593: a principal investigator submits a Data
    Access Request that the NHLBI Data Access Committee reviews, and approved data are hosted on NHLBI BioData Catalyst.
    Brain and cardiac MRI scans are not in dbGaP; they are requested with a proposal through the FHS research
    application, reviewed by an FHS committee, followed by a signed Data and Materials Distribution Agreement and data
    transfer fees. Phenotypes, including imaging measures, are in dbGaP study phs000007.

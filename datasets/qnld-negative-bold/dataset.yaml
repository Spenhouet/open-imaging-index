id: qnld-negative-bold
name: QNLD Negative BOLD
full_name: The Multimodal Dataset to Investigate Task-Evoked Negative BOLD Response and Neurodegeneration
summary: >-
  Brain MRI, task and resting-state fMRI, and FDG, amyloid and tau PET from cognitively normal young and older adults,
  collected to study task-evoked brain deactivation (the negative BOLD response) and its link to aging and Alzheimer's
  pathology.
homepage: https://openneuro.org/datasets/ds006148
doi: 10.18112/openneuro.ds006148.v1.0.7
# First OpenNeuro snapshot 1.0.0 dated 2025-04-23; latest snapshot 1.0.7 dated 2026-06-05 (CHANGES file and OpenNeuro API).

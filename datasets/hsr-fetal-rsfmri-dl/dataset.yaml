id: hsr-fetal-rsfmri-dl
name: San Raffaele fetal rs-fMRI brain masks (RF-2016-02364081)
full_name: >-
  Deep Learning (DL) RF-2016-02364081 dataset for the study 'Optimizing performance of transformer-based models for
  fetal brain MR image segmentation'
summary: >-
  Fetal resting-state functional MRI (rs-fMRI) volumes with brain masks, shared to train and test deep learning models
  that extract the fetal brain from the surrounding maternal anatomy. 172 fetuses at 21 to 37 gestational weeks, 1.5 T
  and 3 T.

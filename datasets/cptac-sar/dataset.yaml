# yaml-language-server: $schema=../../schema/dataset.schema.json
id: cptac-sar
name: CPTAC-SAR
full_name: The Clinical Proteomic Tumor Analysis Consortium Sarcomas Collection (CPTAC-SAR)
summary: >-
  Standard-of-care CT, MRI and PET of 24 patients and 300 whole-slide pathology images of 88 patients from the NCI
  CPTAC sarcoma cohort, linked by patient ID to proteomic, genomic and clinical data in the NCI data commons.
homepage: https://www.cancerimagingarchive.net/collection/cptac-sar/
doi: 10.7937/tcia.2019.9bt23r95
year: 2019
updated: 2023
version: '10'
status: active
creators:
  - name: National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)
    url: https://proteomics.cancer.gov/programs/cptac
  - name: The Cancer Imaging Archive (TCIA)
    url: https://www.cancerimagingarchive.net/
species: human
modalities: [CT, MR, PT, SM]
anatomy: [abdomen, chest, head, neck, kidney, stomach, upper_limb, lower_limb]
conditions: [sarcoma]
formats: [DICOM, SVS]
vendors: [ge, siemens, philips]
size_gb: 87.2
access:
  type: open
  url: https://www.cancerimagingarchive.net/collection/cptac-sar/
  note: >-
    DICOM radiology is downloaded with the TCIA Data Retriever from a manifest file, slides through IBM Aspera. No
    account is needed. Clinical, proteomic and genomic data are in the Proteomic and Genomic Data Commons.
licenses:
  - license: CC-BY-4.0
    url: https://www.cancerimagingarchive.net/collection/cptac-sar/
citation:
  text: >-
    National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC). (2019). The Clinical Proteomic
    Tumor Analysis Consortium Sarcomas Collection (CPTAC-SAR) (Version 10) [Data set]. The Cancer Imaging Archive.
    https://doi.org/10.7937/tcia.2019.9bt23r95. Acknowledgement: "Data used in this publication were generated by the
    National Cancer Institute Clinical Proteomic Tumor Analysis Consortium (CPTAC)."
sources:
  tcia-cptac-sar:
    title: TCIA CPTAC-SAR collection page (version 10, updated 2023/05/10)
    url: https://www.cancerimagingarchive.net/collection/cptac-sar/
    kind: website
  tcia-cptac-sar-series:
    title: >-
      TCIA NBIA series metadata for CPTAC-SAR (open API, every record licensed CC BY 4.0), counted per unique
      PatientID
    url: https://services.cancerimagingarchive.net/nbia-api/services/v1/getSeries?Collection=CPTAC-SAR
    kind: computed
keywords: [sarcoma, proteogenomics, radiogenomics, CPTAC, whole-slide imaging]
verified:
  date: '2026-10-09'
  by: Spenhouet-agent

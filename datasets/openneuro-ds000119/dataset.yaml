id: openneuro-ds000119
name: Antisaccade error processing development (ds000119)
full_name: >-
  Maturational Changes in Anterior Cingulate and Frontoparietal Recruitment Support the Development of Error
  Processing and Inhibitory Control (Antistate)
summary: >-
  Brain MRI and task fMRI of healthy children, adolescents and young adults aged 8 to 27 performing prosaccade and
  antisaccade eye-movement tasks, collected to study how error processing and inhibitory control mature. Event files
  give per-trial accuracy and latency.

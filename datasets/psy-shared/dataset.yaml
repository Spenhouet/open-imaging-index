    title: Psy-ShareD Data page (data catalogue, access, terms and conditions)
    url: https://psyshared.com/Data.html
    kind: website
  psyshared-mou:
    title: Psy-ShareD Data Sharing Memorandum of Understanding
    url: https://psyshared.com/files/Psy-ShareD%20MoU.pdf
    kind: website
  kcl-figshare-psyd1701:
    title: KCL Figshare record PSYD_1701 KYOTO_1 (one of the per-site Psy-ShareD catalogue records)
    url: https://doi.org/10.18742/33033956
    kind: website

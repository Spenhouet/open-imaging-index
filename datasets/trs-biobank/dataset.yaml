name: TRS Biobank
full_name: Treatment-Resistant Schizophrenia Biobank (CRC Psychosis Study)
summary: >-
  Cross-sectional biobank on treatment-resistant schizophrenia from Melbourne, built to search for biomarkers, with 3T
  structural, diffusion and resting-state brain MRI for a subset of patients, their relatives and healthy controls.
  Data go to approved, ethics-cleared projects.

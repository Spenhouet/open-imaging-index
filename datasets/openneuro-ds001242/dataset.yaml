id: openneuro-ds001242
name: Arousal and Salience Across Age fMRI (ds001242)
full_name: Examining effects of arousal on responses to salient and non-salient stimuli in younger and older adults
summary: >-
  Task fMRI of younger and older adults detecting salient images after a tone conditioned to predict shock, collected
  to test how arousal and the locus coeruleus shape attention with age. 52 healthy participants with T1-weighted,
  neuromelanin-sensitive and diffusion MRI.

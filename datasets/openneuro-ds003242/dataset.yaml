id: openneuro-ds003242
name: Social Isolation and Fasting Craving fMRI (ds003242)
full_name: >-
  MRI data of 40 adult participants in response to a cue induced craving task following food fasting, social
  isolation and baseline (within-subject design)
summary: >-
  Task fMRI and structural brain MRI of healthy adults scanned after 10 hours of social isolation, after 10 hours of
  fasting and on a baseline day, collected to test whether isolation evokes midbrain craving responses to social cues
  similar to hunger.

id: cobre
name: COBRE (INDI)
full_name: Center for Biomedical Research Excellence (COBRE) schizophrenia sample
summary: >-
  Resting-state fMRI and multi-echo MPRAGE anatomical scans from 72 patients with schizophrenia and 75 healthy
  controls aged 18 to 65, with age, sex, handedness and diagnosis, shared through INDI by the Mind Research Network.
homepage: https://fcon_1000.projects.nitrc.org/indi/retro/cobre.html
year: 2013
status: active
creators:
  - name: Mind Research Network and University of New Mexico (COBRE investigators)
    url: https://fcon_1000.projects.nitrc.org/indi/retro/cobre.html
  - name: International Neuroimaging Data-sharing Initiative (INDI)
    url: https://fcon_1000.projects.nitrc.org/
species: human
modalities: [MR]
contrasts: [bold, T1w]
anatomy: [brain]
conditions: [schizophrenia, healthy]
tasks: [classification]
countries: [US]
vendors: [siemens]
field_strengths: [3]
access:
  type: registration
  url: https://www.nitrc.org/project/request.php?group_id=296
licenses:
  - license: LicenseRef-INDI-FCP-Terms
    note: >-
      The release page states "Creative Commons License: Attribution - Non-Commercial" as its usage agreement.
      Downloads need a NITRC account and membership in the 1000 Functional Connectomes Project on NITRC.

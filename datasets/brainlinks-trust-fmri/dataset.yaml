  url: https://doi.org/10.34894/CPARII
  note: >-
    The processed data package on DataverseNL is restricted to the study authors; access is requested by e-mail to the
    first author with a reason. The preprint's data availability statement says data access can be requested from the
    authors. The deposit does not state whether MRI images are part of the shareable data. The task materials and the
    analysis code are public in separate DataverseNL records.

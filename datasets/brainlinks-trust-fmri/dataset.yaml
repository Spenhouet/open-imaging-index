id: brainlinks-trust-fmri
name: Brainlinks Adolescent Trust fMRI
full_name: Neural mechanisms underlying trust to friends, community members, and unknown peers in adolescence
summary: >-
  Task and resting-state fMRI with T1-weighted MRI from adolescents and young adults playing a trust game with a friend,
  a community member and an unknown peer, collected to study how trust and its brain basis differ by partner and age.
  Shared on request.
homepage: https://doi.org/10.34894/CPARII
doi: 10.34894/CPARII
year: 2023
creators:
  - name: Sophie Sweijen, Suzanne van de Groep, Lysanne te Brinke, Andrew Fuligni and Eveline A. Crone (Erasmus University Rotterdam)
    url: https://ror.org/057w15z03

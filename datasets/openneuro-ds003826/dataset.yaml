name: Chronotype structural MRI (ds003826)
full_name: >-
  Structural (t1) images of 136 young healthy adults; study of effects of chronotype, sleep quality and daytime
  sleepiness on brain structure
summary: >-
  T1-weighted brain MRI of healthy young adults, collected to relate chronotype, sleep quality and daytime sleepiness
  to brain structure, with questionnaire scores for each person. 136 adults aged 18 to 35 scanned in Krakow, in BIDS
  under CC0.
homepage: https://openneuro.org/datasets/ds003826
doi: 10.18112/openneuro.ds003826.v3.0.1

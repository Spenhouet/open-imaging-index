name: HCP-Aging perivascular space labels
full_name: Precise perivascular space segmentation on T2-weighted magnetic resonance imaging from Human Connectome Project-Aging
summary: >-
  Brain T2-weighted MRI of healthy adults aged 36 to 100 with refined masks of white matter perivascular spaces, made to
  train and test automatic segmentation of these small fluid-filled channels. 200 people selected from HCP-Aging for an
  even spread of age and sex.

id: mindboggle-101
name: Mindboggle-101
full_name: Mindboggle-101 manually labeled individual brains
summary: >-
  Brain MRI of healthy adults with manually edited cortical labels, made as atlases and as training and
  test data for automated brain registration, segmentation and labeling. Labels follow the Desikan-Killiany-Tourville
  (DKT) protocol on surfaces and volumes.

id: mgb-clinical-brain-mri
name: MGB Clinical Brain MRI Repository
full_name: Repository of clinical brain scans with real-world variability
summary: >-
  15,926 uncurated, skull-stripped clinical brain MRI scans of 1,384 subjects taken straight from the Massachusetts
  General Hospital PACS, with mixed sequences, resolutions and orientations plus age and gender. The "MGH dataset" of
  the SynthSR paper. Access after PI approval and a data use agreement.
homepage: https://zenodo.org/records/18701184
doi: 10.5281/zenodo.18701184
# The SynthSR paper (February 2023) states the data were on the public Martinos Center server. That server now points
# to the Zenodo record (version 1.0, published 2026-02-19), where access is restricted.
year: 2023

name: M4Raw
full_name: 'M4Raw: A multi-contrast, multi-repetition, multi-channel MRI k-space dataset for low-field MRI research'
summary: >-
  Raw multi-channel brain MRI data (k-space) from a low-field scanner with repeated scans per contrast, built for
  reconstruction, denoising and parallel imaging research on affordable MRI. 208 healthy volunteers scanned at 0.3 T
  with repeated T1, T2 and FLAIR.

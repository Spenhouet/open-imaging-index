id: abcd
name: ABCD Study (Release 7.0)
full_name: Adolescent Brain Cognitive Development Study, Curated Data Release 7.0
summary: >-
  Longitudinal multisite 3T MRI of 11,860 US youth enrolled at ages 9 to 10 and scanned every two years: T1w, T2w,
  multi-shell diffusion, resting-state and task fMRI, with genetics, mental and physical health, cognition and
  substance use data, shared through the NIH Brain Development Cohorts Data Hub.
homepage: https://abcdstudy.org/
doi: 10.82525/8f3w-5260
year: 2018
updated: 2026
version: Curated Data Release 7.0 (13 May 2026)
status: active
creators:
  - name: ABCD Study consortium (21 US research sites, Data Analysis, Informatics and Resource Center at UC San Diego)
    url: https://abcdstudy.org/
species: human
modalities: [MR]
contrasts: [T1w, T2w, dwi, bold]
anatomy: [brain]
tasks: [normative, regression]
formats: [DICOM, NIfTI, BIDS]
countries: [US]
vendors: [siemens, ge, philips]
field_strengths: [3]
access:
  type: application
  url: https://www.nbdc-datahub.org/data-access-process
licenses:
  - license: LicenseRef-NIH-BDC-DUC
    note: >-
      Since June 2025 ABCD data are no longer requested through the NIMH Data Archive; release 6.0 and later are
      accessed on the NBDC Data Hub under this DUC. Investigator-led group DUCs and a separate DUC for analyses that
      single out American Indian/Alaska Native participants use the same terms.
citation:

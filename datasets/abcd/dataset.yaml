    Data used in the preparation of this article were obtained from the Adolescent Brain Cognitive Development (ABCD)
    Study, held in the NIH Brain Development Cohorts Data Sharing Platform. ABCD Release 7.0,
    doi:10.82525/8f3w-5260. Imaging protocol: Casey BJ, Cannonier T, Conley MI, et al. The Adolescent Brain Cognitive
    Development (ABCD) study: Imaging acquisition across 21 sites. Developmental Cognitive Neuroscience 32:43-54
    (2018). doi:10.1016/j.dcn.2018.03.001

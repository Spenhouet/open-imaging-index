name: Amsterdam-Trondheim 7T resting-state fMRI
full_name: A high-resolution 7 Tesla resting-state fMRI dataset optimized for studying the subcortex
summary: >-
  Resting-state brain fMRI with T1-weighted scans and cardiac and respiratory recordings from healthy young adults,
  acquired at 7 tesla with a short echo time to study spontaneous activity of small subcortical nuclei. 56 people,
  shared as fMRIPrep-preprocessed images.

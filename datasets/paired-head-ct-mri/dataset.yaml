id: paired-head-ct-mri
name: Paired Head CT-MRI
full_name: A Paired Head CT-MRI Dataset for Cross-Modality Image Synthesis
summary: >-
  Thin-slice head CT matched with T1-weighted brain MRI of neurosurgical patients before surgery, released to train
  and test methods that synthesize CT from MRI for MRI-guided radiotherapy and surgical planning. Covers pituitary
  tumors, meningiomas, vestibular schwannomas and cerebrovascular disease.
homepage: https://zenodo.org/records/17486320
doi: 10.5281/zenodo.17486320
year: 2025
version: v1
creators:
  - name: Yao S, Tan Y, Wang J (The First Affiliated Hospital, Sun Yat-sen University)
species: human
modalities: [MR, CT]
contrasts: [T1w, T1w_ce]
anatomy: [head, brain]
conditions: [pituitary_tumor, meningioma, vestibular_schwannoma, cerebrovascular_disorder]
tasks: [synthesis]
formats: [NIfTI]
countries: [CN]
vendors: [siemens, canon, philips, ge]
size_gb: 40.06

id: superstition-neurofeedback
name: Superstition of control in sham neurofeedback fMRI
full_name: The role of superstition of cognitive control during neurofeedback training (parts 1 and 2)
summary: >-
  Task fMRI and structural brain MRI of healthy young adults who believed they controlled a feedback bar with their
  brain activity while the feedback was sham, collected to test whether mere belief in control activates reward
  networks seen in neurofeedback training.
homepage: https://openneuro.org/datasets/ds004556
doi: 10.18112/openneuro.ds004556.v1.0.1
# Two OpenNeuro accessions of one study: part 1 is ds004556 (snapshot 1.0.1), part 2 is ds004557 (snapshot 1.1.0,
# doi 10.18112/openneuro.ds004557.v1.1.0). Both were published on 2023-04-24 and got events files on 2023-04-26.

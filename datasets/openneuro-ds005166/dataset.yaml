name: Youth inhibitory control fMRI (ds005166)
full_name: 'A framework for leveraging technology to probe mechanism: A proof of concept study of inhibitory control'
summary: >-
  Brain fMRI during a flanker task, T1w MRI, symptom scales and cognitive test scores from youth with anxiety, ADHD,
  irritability or no diagnosis, collected to validate a mobile app that measures inhibitory control against lab
  tasks and brain function.

id: l-cid
name: L-CID
full_name: Leiden Consortium on Individual Development (L-CID) twin study, MRI measures
summary: >-
  Brain MRI of same-sex twins in childhood and early adolescence, collected in a longitudinal twin study with a
  parenting intervention to trace how social competence and behavioral control develop. Structural, diffusion,
  resting-state and task fMRI at ages 7 to 15 in the Netherlands.
homepage: https://www.developmentmatters.nl/data-access/
doi: 10.60641/a2sk-dv72
# Year the L-CID metadata catalogue records for the MRI measures received their DOIs (DataCite publicationYear 2024).
# The imaging data themselves are announced on YODA as coming soon.
year: 2024
status: active

id: acdc
name: ACDC
full_name: Automated Cardiac Diagnosis Challenge (MICCAI 2017)
summary: >-
  Short-axis cine cardiac MRI of 150 patients from the University Hospital of Dijon in five equal groups (normal,
  previous infarction, dilated and hypertrophic cardiomyopathy, abnormal right ventricle), with expert LV, RV and
  myocardium segmentations at end-diastole and end-systole.
homepage: https://www.creatis.insa-lyon.fr/Challenge/acdc/
doi: 10.1109/TMI.2018.2837502
year: 2017
status: active
creators:
  - name: Olivier Bernard, CREATIS, University of Lyon
    url: https://www.creatis.insa-lyon.fr/Challenge/acdc/organizers.html
  - name: Alain Lalande, Le2i, University of Burgundy, and University Hospital of Dijon
  - name: Pierre-Marc Jodoin, VITAL lab, University of Sherbrooke
species: human
modalities: [MR]
contrasts: [cine]
anatomy: [heart]
conditions:
  [healthy, myocardial_infarction, dilated_cardiomyopathy, hypertrophic_cardiomyopathy, abnormal_right_ventricle]
tasks: [segmentation, classification]

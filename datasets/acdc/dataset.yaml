name: ACDC
full_name: Automated Cardiac Diagnosis Challenge (MICCAI 2017)
summary: >-
  Cine cardiac MRI of patients with normal hearts, previous infarction, dilated or hypertrophic cardiomyopathy or an
  abnormal right ventricle, with expert ventricle and myocardium segmentations, a benchmark for cardiac segmentation
  and diagnosis. 150 patients from Dijon in five equal groups.

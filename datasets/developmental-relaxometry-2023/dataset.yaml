name: Developmental Relaxometry 2023 (ds004611)
full_name: 'Developmental Relaxometry 2023: normative volumes and relaxation times at 3T during brain development'
summary: >-
  Quantitative T1 and T2 relaxation maps of the brain from healthy children aged 3 to 17, collected to build normative
  developmental curves of regional volumes and relaxation times that a short clinical protocol can be compared
  against. Includes MP2RAGE images and regional normative model outputs.

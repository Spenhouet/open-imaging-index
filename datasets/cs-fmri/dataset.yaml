id: cs-fmri
name: CS_fmri
full_name: Click & Switch study fMRI
summary: >-
  Brain fMRI of adults who watched a mathematics lecture on an iPad and could switch freely to Instagram Reels,
  collected to study self-directed media switching. Includes resting-state runs before and after, free recall, a
  yoked replay, a localizer, T1w and T2w anatomy and fMRIPrep outputs.

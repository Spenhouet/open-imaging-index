  Breast MRI labelled with the BI-RADS category of fibroglandular tissue (FGT) amount, released to train and test
  classifiers for breast cancer risk assessment. Pre-contrast fat-saturated T1-weighted scans, one per patient, as 3D
  volumes and three 2D slices.

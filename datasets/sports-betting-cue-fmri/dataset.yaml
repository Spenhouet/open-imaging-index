id: sports-betting-cue-fmri
name: Sports Betting Cue Exposure fMRI
full_name: Increased brain reactivity to gambling unavailability as a marker of problem gambling
summary: >-
  Brain MRI and cue-exposure task fMRI of frequent sports bettors with and without problem gambling, collected to test
  whether brain reactivity to sport events that are blocked for betting marks problem gambling and low self-control.
homepage: https://openneuro.org/datasets/ds002513
doi: 10.18112/openneuro.ds002513.v1.0.0

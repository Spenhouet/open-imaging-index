# yaml-language-server: $schema=../../schema/dataset.schema.json
id: lps-insula-rsfmri
name: Endotoxin Sickness Insula Resting-State fMRI
full_name: >-
  Intrinsic functional connectivity of insular cortex and symptoms of sickness during acute experimental inflammation
summary: >-
  Resting-state brain fMRI from a randomized, double-blind trial in which 48 healthy volunteers were scanned about
  2 h 45 min after low-dose endotoxin (LPS) or placebo, to study insula connectivity during sickness. Raw images are
  not shared; group t maps are on NeuroVault.
homepage: https://neurovault.org/collections/807/
doi: 10.1016/j.bbi.2015.12.018
# Year the group maps were added to NeuroVault and the paper went online; the raw images have no public release.
year: 2016
creators:
  - name: Mats Lekander, Gustav Nilsonne and co-authors
modalities: [MR]
contrasts: [bold]
anatomy: [brain]
conditions: [healthy]
field_strengths: [3]
access:
  type: not_shared
  url: https://neurovault.org/collections/807/
  note: >-
    The NeuroVault collection holds only eight derived group t maps in MNI space: connectivity of four insula seeds
    across both treatment groups and the endotoxin against placebo contrast for each seed within an
    orbitofrontal, cingulate and insula mask. These maps are under CC0 like all public NeuroVault data. The
    resting-state fMRI images themselves are not deposited and no other route to them is given.
licenses:
  - license: LicenseRef-No-Published-Terms
    note: >-
      No license or data use terms are stated for the fMRI images. The CC0 dedication of NeuroVault covers only the
      derived group maps.
citation:
  text: >-
    Lekander M, Karshikoff B, Johansson E, Soop A, Fransson P, Lundström JN, Andreasson A, Ingvar M, Petrovic P,
    Axelsson J, Nilsonne G. Intrinsic functional connectivity of insular cortex and symptoms of sickness during acute
    experimental inflammation. Brain, Behavior, and Immunity 56, 34-41 (2016). doi:10.1016/j.bbi.2015.12.018
sources:
  neurovault-807:
    title: NeuroVault collection 807 page and API, including the paper abstract and image metadata
    url: https://neurovault.org/api/collections/807/
    kind: website
  neurovault-faq:
    title: NeuroVault FAQ (data license)
    url: https://neurovault.org/FAQ
    kind: website
related: []
keywords: [endotoxin, lipopolysaccharide, experimental inflammation, sickness behavior, insula, resting-state fMRI]
verified:
  date: '2026-10-12'
  by: Spenhouet-agent

id: scottish-bipolar-family-study
name: Scottish Bipolar Family Study fMRI (Whalley 2013)
full_name: >-
  Scottish Bipolar Family Study, baseline task fMRI of young relatives at high familial risk of bipolar disorder and
  controls (Whalley et al. 2013, PLOS ONE)
summary: >-
  Task fMRI and structural brain MRI of young unaffected relatives of people with bipolar disorder and matched controls,
  followed for about two years to test whether baseline brain activation predicts later major depression.
homepage: https://doi.org/10.1371/journal.pone.0057357
doi: 10.1371/journal.pone.0057357
# Year of the paper (published 6 March 2013); the scans have no public release.
year: 2013

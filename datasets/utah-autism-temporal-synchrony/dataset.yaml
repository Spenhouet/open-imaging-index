id: utah-autism-temporal-synchrony
name: Utah autism temporal synchrony fMRI (NDA Study 614)
full_name: >-
  Evaluation of Differences in Temporal Synchrony Between Brain Regions in Individuals With Autism and Typical
  Development
summary: >-
  Long multiband multi-echo resting-state brain fMRI of adolescent and adult males with autism and typically
  developing controls, collected to measure how long functional connections between brain regions persist. Shared
  through the NIMH Data Archive as NDA Study 614.
homepage: https://nda.nih.gov/study.html?id=614
doi: 10.15154/1475202
year: 2019
status: active
creators:
  - name: >-
      Janet Lainhart and Jeffrey Anderson with the Atypical Late
      Neurodevelopment in Autism longitudinal study team, University of Utah
    url: https://nda.nih.gov/edit_collection.html?id=2400
species: human
modalities: [MR]
contrasts: [bold]
anatomy: [brain]
conditions: [autism, healthy]
tasks: [classification]
countries: [US]
vendors: [siemens]
field_strengths: [3]

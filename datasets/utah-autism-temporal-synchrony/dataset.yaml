  url: https://nda.nih.gov/study.html?id=614
licenses:
  - license: LicenseRef-NDA-Data-Use-Terms
    note: >-
      The study links 90 subjects from NIMH Data Archive collections 2400 and 1906 (Atypical Late Neurodevelopment in
      Autism, PI Janet Lainhart). Download needs an approved NDA data access request, whose data use terms every
      request accepts. Collection-specific permission clauses are not public and are not broken down here.

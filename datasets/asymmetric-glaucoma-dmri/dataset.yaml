id: asymmetric-glaucoma-dmri
name: Asymmetric glaucoma visual pathway diffusion MRI (ds006837)
full_name: >-
  Disentangling crossing fibers with advanced dMRI methods reveals bundle-specific degeneration across the visual
  system in asymmetric glaucoma
summary: >-
  Multi-shell diffusion and structural brain MRI of adults with glaucoma that affects one eye more than the other and
  of age-matched healthy controls, collected to measure white matter degeneration along the visual pathway, including
  fiber crossings in the optic chiasm. 62 participants scanned in Mexico.

name: Slackline training white matter plasticity (ds003138)
full_name: >-
  Tidying Up White Matter: Neuroplastic Transformations in Sensorimotor Tracts following Slackline Skill Acquisition
summary: >-
  Longitudinal brain MRI with multi-shell diffusion imaging of young adults randomized to slackline balance training or
  a control group, scanned before training, after reaching a set skill level and three weeks later to track white
  matter plasticity.

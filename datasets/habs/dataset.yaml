id: habs
name: HABS
full_name: Harvard Aging Brain Study (HABS) public dataset
summary: >-
  Longitudinal study at Massachusetts General Hospital of 358 older adults who were cognitively normal at entry, with
  3 T MRI (T1w, FLAIR, SWI, DTI, resting-state fMRI), PiB, flortaucipir and FDG PET and up to 11 years of clinical
  and cognitive follow-up.
homepage: https://www.synapse.org/habs
doi: 10.1016/j.neuroimage.2015.03.069

name: Penn LEAD (ds007116)
full_name: 'Penn LEAD: Penn Longitudinal Executive functioning in Adolescent Development'
summary: >-
  Longitudinal multimodal brain MRI of adolescents who are typically developing, have ADHD or are on the psychosis
  spectrum, collected to study how executive function develops across psychiatric diagnoses. Structural, diffusion,
  task and resting fMRI, ASL and multi-echo GRE, with cognitive and clinical data.

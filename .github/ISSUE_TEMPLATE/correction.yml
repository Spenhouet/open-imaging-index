name: Report a mistake
description: A number, license answer or description is wrong or outdated.
title: 'Correction: '
labels: [correction]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://.../datasets/brats-2021/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source for the correct information
      description: A link to the paper, website or license text.
    validations:
      required: true

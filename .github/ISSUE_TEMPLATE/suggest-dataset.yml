name: Suggest a dataset
description: Point us to a medical imaging dataset that is missing. Someone else writes the entry.
title: 'Add dataset: '
labels: [dataset-request]
body:
  - type: input
    id: name
    attributes:
      label: Dataset name
      placeholder: e.g. BraTS 2023
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official page
      description: Where the data or its access instructions live.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Paper or data descriptor
      description: DOI or link, if there is one.
  - type: dropdown
    id: modality
    attributes:
      label: Modality
      multiple: true
      options: [MRI, CT, PET, X-ray, Ultrasound, Mammography, Pathology slides, Fundus / OCT, Photography, Other]
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: License, number of subjects, why it is useful.

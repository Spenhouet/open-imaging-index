name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Base URL and path come from the Pages settings, so a custom domain is picked up automatically.
      - id: pages
        uses: actions/configure-pages@v5
      - run: bun run build
        env:
          NODE_ENV: production
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells search engines that support IndexNow (Bing, Yandex and others) about every page in the sitemap.
  # The key is public by design: the key file in static/ proves the site owns it.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
          KEY: 3abff1e73e5944cbfdde40cd45e4e6ba
        run: |
          SITE="https://${SITE#*://}"
          SITE="${SITE%/}"
          HOST="${SITE#https://}"
          HOST="${HOST%%/*}"
          curl -sf "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's#<loc>##; s#</loc>##' > urls.txt
          jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$SITE/$KEY.txt" --rawfile urls urls.txt \
            '{host: $host, key: $key, keyLocation: $loc, urlList: ($urls | split("\n") | map(select(length > 0)))}' > body.json
          echo "Submitting $(wc -l < urls.txt) URLs"
          curl -s -o response.txt -w '%{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json | tee status.txt
          cat response.txt
          grep -qE '^(200|202)$' status.txt

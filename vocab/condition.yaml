# yaml-language-server: $schema=../schema/vocab.schema.json
# MONDO ids (HP for findings), checked with the EBI OLS API. `parent` builds the filter tree:
# filtering for glioma also finds glioblastoma.
terms:
  - { id: healthy, label: Healthy control, description: No known condition of interest, synonyms: [control, normal] }
  # Neurological and psychiatric
  - {
      id: alzheimers,
      label: Alzheimer's disease,
      parent: dementia,
      synonyms: [AD],
      mappings: { mondo: 'MONDO:0004975' }
    }
  - { id: dementia, label: Dementia, mappings: { mondo: 'MONDO:0001627' } }
  - {
      id: frontotemporal_dementia,
      label: Frontotemporal dementia,
      parent: dementia,
      synonyms: [FTD],
      mappings: { mondo: 'MONDO:0017276' }
    }
  - { id: vascular_dementia, label: Vascular dementia, parent: dementia, mappings: { mondo: 'MONDO:0004648' } }
  - { id: down_syndrome, label: Down syndrome, synonyms: [trisomy 21], mappings: { mondo: 'MONDO:0008608' } }
  - {
      id: mci,
      label: Mild cognitive impairment,
      synonyms: [MCI],
      description: No MONDO term exists. Closest HPO term is the broader Cognitive impairment (HP:0100543).
    }
  - { id: scd, label: Subjective cognitive decline, synonyms: [SCD], mappings: { mondo: 'MONDO:0850292' } }
  - { id: cognitive_impairment, label: Cognitive impairment, mappings: { hp: 'HP:0100543' } }
  - { id: parkinsons, label: Parkinson's disease, synonyms: [PD], mappings: { mondo: 'MONDO:0005180' } }
  - { id: motor_neuron_disease, label: Motor neuron disease, synonyms: [MND, motor neuron disorder], mappings: { mondo: 'MONDO:0020128' } }
  - { id: huntington_disease, label: Huntington disease, synonyms: [HD, Huntington's disease], mappings: { mondo: 'MONDO:0007739' } }
  - {
      id: progressive_supranuclear_palsy,
      label: Progressive supranuclear palsy,
      synonyms: [PSP],
      mappings: { mondo: 'MONDO:0019037' }
    }
  - {
      id: corticobasal_degeneration,
      label: Corticobasal degeneration,
      synonyms: [CBD, corticobasal syndrome, CBS],
      description: 'Also used for corticobasal syndrome, the clinical presentation, when the pathology is not confirmed.',
      mappings: { mondo: 'MONDO:0022308' }
    }
  - { id: multiple_sclerosis, label: Multiple sclerosis, synonyms: [MS], mappings: { mondo: 'MONDO:0005301' } }
  - { id: cns_infection, label: Central nervous system infection, synonyms: [neuroinfection, brain infection], mappings: { mondo: 'MONDO:0024619' } }
  - {
      id: stroke,
      label: Stroke,
      description: 'Stroke of any or unspecified type. Use ischemic_stroke when the dataset is limited to ischemic stroke.',
      mappings: { mondo: 'MONDO:0005098' }
    }
  - { id: ischemic_stroke, label: Ischemic stroke, synonyms: [stroke], mappings: { mondo: 'MONDO:1060198' } }
  - { id: moyamoya, label: Moyamoya disease, synonyms: [moyamoya angiopathy], mappings: { mondo: 'MONDO:0016820' } }
  - { id: aphasia, label: Aphasia, description: 'Impaired production or comprehension of language, a finding often caused by stroke.', mappings: { hp: 'HP:0002381' } }
  - { id: visual_field_defect, label: Visual field defect, synonyms: [hemianopia, hemianopsia, quadrantanopia], description: 'Loss of part of the visual field, such as hemianopia after a lesion of the visual pathway.', mappings: { hp: 'HP:0001123' } }
  - {
      id: bells_palsy,
      label: Bell's palsy,
      synonyms: [idiopathic peripheral facial paralysis, idiopathic facial palsy],
      mappings: { mondo: 'MONDO:0005665' }
    }
  - {
      id: olfactory_dysfunction,
      label: Olfactory dysfunction,
      description: 'Reduced, absent or distorted sense of smell (hyposmia, anosmia, parosmia).',
      synonyms: [smell loss, anosmia, hyposmia],
      mappings: { hp: 'HP:0004408' }
    }
  - { id: parosmia, label: Parosmia, parent: olfactory_dysfunction, mappings: { hp: 'HP:0034004' } }
  - { id: synesthesia, label: Synesthesia, description: 'A stimulus in one sense or concept reliably triggers an additional experience, such as letters evoking colours.', synonyms: [synaesthesia], mappings: { hp: 'HP:6000024' } }
  - { id: transient_ischemic_attack, label: Transient ischemic attack, synonyms: [TIA], mappings: { mondo: 'MONDO:0005264' } }
  - { id: intracranial_hemorrhage, label: Intracranial hemorrhage, synonyms: [ICH], mappings: { hp: 'HP:0002170' } }
  - {
      id: intracerebral_hemorrhage,
      label: Intracerebral hemorrhage,
      parent: intracranial_hemorrhage,
      synonyms: [spontaneous ICH, hemorrhagic stroke],
      mappings: { mondo: 'MONDO:0013792' }
    }
  - {
      id: intracranial_aneurysm,
      label: Intracranial aneurysm,
      description: 'Focal dilatation of a cerebral artery, saccular or fusiform. No MONDO term covers both shapes; the closest is intracranial berry aneurysm (MONDO:0016483), which covers the saccular type only.',
      synonyms: [brain aneurysm, cerebral aneurysm, UIA]
    }
  - {
      id: cerebral_microbleeds,
      label: Cerebral microbleeds,
      description: 'Small hemosiderin deposits seen as hypointense foci on T2*-weighted or susceptibility-weighted MRI. No MONDO or HPO term exists.',
      synonyms: [CMB, microhemorrhage, MCH]
    }
  - {
      id: superficial_siderosis,
      label: Superficial siderosis,
      synonyms: [cortical superficial siderosis, cSS],
      mappings: { mondo: 'MONDO:0016594', hp: 'HP:6001255' }
    }
  - { id: cerebral_amyloid_angiopathy, label: Cerebral amyloid angiopathy, synonyms: [CAA], mappings: { mondo: 'MONDO:0005620' } }
  - {
      id: aria,
      label: Amyloid-related imaging abnormalities,
      description: 'ARIA-E (edema, effusion) and ARIA-H (microbleeds, superficial siderosis), mostly seen under anti-amyloid antibody treatment. No MONDO or HPO term exists.',
      synonyms: [ARIA, ARIA-E, ARIA-H]
    }
  - {
      id: enlarged_perivascular_spaces,
      label: Enlarged perivascular spaces,
      description: 'Fluid-filled spaces around small brain vessels that are large enough to be seen on MRI. A marker of cerebral small vessel disease.',
      synonyms: [EPVS, PVS, dilated Virchow-Robin spaces],
      mappings: { hp: 'HP:0012520' }
    }
  - {
      id: lacunes,
      label: Lacunes of presumed vascular origin,
      description: 'Small fluid-filled cavities in deep grey or white matter, the imaging trace of a past small subcortical infarct or hemorrhage. A marker of cerebral small vessel disease. HP:0032325 (Lacunar stroke) names the clinical event, not the imaging finding, so no mapping is given.',
      synonyms: [lacune, lacunar infarct]
    }
  - {
      id: cerebral_small_vessel_disease,
      label: Cerebral small vessel disease,
      description: 'Disease of the small arteries, arterioles, capillaries and venules of the brain, seen on MRI as white matter hyperintensities, lacunes, microbleeds and enlarged perivascular spaces. MONDO has only monogenic forms (brain small vessel disease 1 to 6, HTRA1-related), so no mapping is given.',
      synonyms: [cSVD, SVD, small vessel disease]
    }
  - { id: traumatic_brain_injury, label: Traumatic brain injury, synonyms: [TBI], mappings: { mondo: 'MONDO:0858950' } }
  - {
      id: hypoxic_ischemic_encephalopathy,
      label: Hypoxic ischemic encephalopathy,
      description: 'Brain injury from reduced oxygen supply and blood flow, most often around birth in term neonates. MONDO and HPO have no matching term, so the NCIt code is given.',
      synonyms: [HIE, neonatal hypoxic-ischemic encephalopathy],
      mappings: { ncit: 'NCIT:C35549' }
    }
  - {
      id: germinal_matrix_hemorrhage,
      label: Germinal matrix-intraventricular hemorrhage,
      parent: intracranial_hemorrhage,
      description: 'Bleeding from the germinal matrix of the preterm brain, with or without extension into the ventricles, usually graded I to IV after Papile.',
      synonyms: [GMH, GMH-IVH, preterm intraventricular hemorrhage],
      mappings: { hp: 'HP:0030747' }
    }
  - { id: hydrocephalus, label: Hydrocephalus, mappings: { mondo: 'MONDO:0001150' } }
  - { id: preterm_birth, label: Preterm birth, description: 'Birth before 37 completed weeks of gestation.', synonyms: [premature birth, prematurity], mappings: { hp: 'HP:0001622' } }
  - {
      id: cerebral_cavernous_malformation,
      label: Cerebral cavernous malformation,
      synonyms: [CCM, cavernoma],
      mappings: { mondo: 'MONDO:0000820' }
    }
  - { id: epilepsy, label: Epilepsy, mappings: { mondo: 'MONDO:0005027' } }
  - {
      id: temporal_lobe_epilepsy,
      label: Temporal lobe epilepsy,
      parent: epilepsy,
      synonyms: [TLE],
      mappings: { mondo: 'MONDO:0005115' }
    }
  - { id: migraine, label: Migraine, mappings: { mondo: 'MONDO:0005277', hp: 'HP:0002076' } }
  - {
      id: focal_cortical_dysplasia,
      label: Focal cortical dysplasia,
      synonyms: [FCD],
      mappings: { mondo: 'MONDO:0019009' }
    }
  - { id: schizophrenia, label: Schizophrenia, mappings: { mondo: 'MONDO:0005090' } }
  - { id: schizoaffective_disorder, label: Schizoaffective disorder, mappings: { mondo: 'MONDO:0005487' } }
  - { id: psychotic_disorder, label: Psychotic disorder, synonyms: [psychosis], mappings: { mondo: 'MONDO:0005485' } }
  - id: clinical_high_risk_psychosis
    label: Clinical high risk for psychosis
    description: >-
      Attenuated or brief psychotic symptoms, or genetic risk with functional decline, that meet psychosis-risk
      syndrome criteria without a psychotic disorder. No MONDO or HPO term exists.
    synonyms: [CHR, CHR-P, ultra high risk, UHR, psychosis-risk syndrome, attenuated psychosis syndrome, prodrome]
  - { id: bipolar_disorder, label: Bipolar disorder, synonyms: [bipolar], mappings: { mondo: 'MONDO:0004985' } }
  - { id: autism, label: Autism spectrum disorder, synonyms: [ASD], mappings: { mondo: 'MONDO:0005258' } }
  - { id: adhd, label: ADHD, mappings: { mondo: 'MONDO:0007743' } }
  - { id: neurodevelopmental_disorder, label: Neurodevelopmental disorder, mappings: { mondo: 'MONDO:0700092' } }
  - {
      id: developmental_delay,
      label: Global developmental delay,
      parent: neurodevelopmental_disorder,
      synonyms: [developmental delay, DD],
      mappings: { hp: 'HP:0001263' }
    }
  - id: developmental_language_disorder
    label: Developmental language disorder
    description: >-
      Persistent difficulty learning and using language in childhood without a known biomedical cause. MONDO lists the
      synonym only under familial developmental dysphasia (MONDO:0010821), a narrower FOXP2-related form.
    synonyms: [DLD, specific language impairment, SLI]
    parent: neurodevelopmental_disorder
    mappings: { hp: 'HP:0002463' }
  - { id: dyslexia, label: Dyslexia, synonyms: [developmental dyslexia, reading disability], mappings: { mondo: 'MONDO:0005489' } }
  - { id: dyscalculia, label: Dyscalculia, synonyms: [developmental dyscalculia, math learning disability, mathematical learning difficulty], mappings: { mondo: 'MONDO:0001552', hp: 'HP:0002442' } }
  - { id: blindness, label: Blindness, synonyms: [congenital blindness, early blindness, visual deprivation], mappings: { hp: 'HP:0000618' } }
  - { id: hearing_loss, label: Hearing impairment, synonyms: [deafness, congenital deafness, hearing loss, auditory deprivation], mappings: { hp: 'HP:0000365' } }
  - { id: prosopagnosia, label: Prosopagnosia, synonyms: [developmental prosopagnosia, face blindness, DP], mappings: { mondo: 'MONDO:0003227' } }
  - { id: depression, label: Major depressive disorder, synonyms: [MDD], mappings: { mondo: 'MONDO:0002009' } }
  - { id: dysthymia, label: Dysthymic disorder, synonyms: [dysthymia, persistent depressive disorder], mappings: { mondo: 'MONDO:0001442' } }
  - { id: suicidal_behavior, label: Suicidal behavior, synonyms: [suicide attempt, suicide attempters], mappings: { hp: 'HP:5200330' } }
  - { id: anxiety_disorder, label: Anxiety disorder, mappings: { mondo: 'MONDO:0005618' } }
  - {
      id: generalized_anxiety_disorder,
      label: Generalized anxiety disorder,
      parent: anxiety_disorder,
      synonyms: [GAD],
      mappings: { mondo: 'MONDO:0001942' }
    }
  - {
      id: social_anxiety_disorder,
      label: Social anxiety disorder,
      parent: anxiety_disorder,
      synonyms: [social phobia],
      mappings: { mondo: 'MONDO:0001247' }
    }
  - { id: specific_phobia, label: Specific phobia, parent: anxiety_disorder, mappings: { mondo: 'MONDO:0012000' } }
  - { id: panic_disorder, label: Panic disorder, parent: anxiety_disorder, mappings: { mondo: 'MONDO:0005383' } }
  - { id: agoraphobia, label: Agoraphobia, parent: anxiety_disorder, mappings: { mondo: 'MONDO:0003709' } }
  - {
      id: separation_anxiety_disorder,
      label: Separation anxiety disorder,
      parent: anxiety_disorder,
      mappings: { mondo: 'MONDO:0001098' }
    }
  - { id: ocd, label: Obsessive-compulsive disorder, synonyms: [OCD], mappings: { mondo: 'MONDO:0008114' } }
  - {
      id: functional_neurological_disorder,
      label: Functional neurological disorder,
      synonyms: [FND, conversion disorder, functional movement disorder, FMD],
      mappings: { mondo: 'MONDO:0002104' }
    }
  - { id: ptsd, label: Post-traumatic stress disorder, synonyms: [PTSD], mappings: { mondo: 'MONDO:0005146' } }
  - {
      id: childhood_trauma,
      label: Childhood trauma exposure,
      synonyms: [childhood maltreatment, child abuse, childhood violence exposure],
      description: 'Exposure to abuse or interpersonal violence in childhood. An exposure, not a diagnosis. No MONDO or HPO term exists.',
    }
  - { id: borderline_personality_disorder, label: Borderline personality disorder, synonyms: [BPD], mappings: { mondo: 'MONDO:0001156' } }
  - { id: personality_disorder, label: Personality disorder, mappings: { mondo: 'MONDO:0002028' } }
  - {
      id: cluster_c_personality_disorder,
      label: Cluster C personality disorder,
      parent: personality_disorder,
      synonyms: [anxious-fearful personality disorder],
      description: 'Avoidant, dependent or obsessive-compulsive personality disorder (DSM cluster C). No MONDO term exists for the cluster.',
    }
  - { id: irritability, label: Irritability, mappings: { hp: 'HP:0000737' } }
  - {
      id: disruptive_mood_dysregulation_disorder,
      label: Disruptive mood dysregulation disorder,
      synonyms: [DMDD],
      description: 'DSM-5 childhood disorder of severe chronic irritability with temper outbursts. No MONDO term exists.',
    }
  - { id: eating_disorder, label: Eating disorder, mappings: { mondo: 'MONDO:0005451' } }
  - { id: anorexia_nervosa, label: Anorexia nervosa, parent: eating_disorder, mappings: { mondo: 'MONDO:0005351' } }
  - {
      id: cocaine_use_disorder,
      label: Cocaine use disorder,
      synonyms: [CUD, cocaine dependence, cocaine addiction],
      mappings: { mondo: 'MONDO:0005186' }
    }
  - {
      id: gambling_disorder,
      label: Gambling disorder,
      synonyms: [pathological gambling, problem gambling, compulsive gambling],
      mappings: { mondo: 'MONDO:0011662' }
    }
  - {
      id: social_media_addiction,
      label: Social media addiction,
      synonyms: [problematic social media use],
      description: No MONDO term exists. Mapped to the broader HPO term Addictive non-substance behaviors.,
      mappings: { hp: 'HP:5200332' }
    }
  - {
      id: alcohol_use_disorder,
      label: Alcohol use disorder,
      synonyms: [AUD, alcohol dependence, alcoholism],
      mappings: { mondo: 'MONDO:0007079' }
    }
  - {
      id: mitochondrial_disease,
      label: Mitochondrial disease,
      synonyms: [primary mitochondrial disease, mitochondrial disorder],
      mappings: { mondo: 'MONDO:0044970' }
    }
  # Tumors
  - { id: cancer, label: Cancer, description: 'Malignant neoplasm of any type or site', mappings: { mondo: 'MONDO:0004992' } }
  - { id: brain_tumor, label: Brain tumor, mappings: { mondo: 'MONDO:0021211' } }
  - { id: glioma, label: Glioma, parent: brain_tumor, mappings: { mondo: 'MONDO:0021042' } }
  - { id: glioblastoma, label: Glioblastoma, parent: glioma, synonyms: [GBM], mappings: { mondo: 'MONDO:0018177' } }
  - { id: oligodendroglioma, label: Oligodendroglioma, parent: glioma, mappings: { mondo: 'MONDO:0016695' } }
  - {
      id: astrocytoma,
      label: Astrocytoma,
      parent: glioma,
      description: 'Astrocytoma other than glioblastoma, including IDH-mutant astrocytoma of grade 2 and 3.',
      mappings: { mondo: 'MONDO:0019781' }
    }
  - {
      id: pediatric_high_grade_glioma,
      label: Pediatric high-grade glioma,
      parent: glioma,
      synonyms: [pHGG, pediatric HGG],
      description: 'High-grade glioma in children, including diffuse midline glioma and diffuse intrinsic pontine glioma (DIPG).',
      mappings: { mondo: 'MONDO:1010030' }
    }
  - { id: meningioma, label: Meningioma, parent: brain_tumor, mappings: { mondo: 'MONDO:0016642' } }
  - { id: brain_metastasis, label: Brain metastases, parent: brain_tumor, mappings: { mondo: 'MONDO:1040026' } }
  - { id: pituitary_adenoma, label: Pituitary adenoma, parent: brain_tumor, synonyms: [pituitary neuroendocrine tumor, PitNET], mappings: { mondo: 'MONDO:0006373' } }
  - {
      id: nonfunctioning_pituitary_adenoma,
      label: Non-functioning pituitary adenoma,
      parent: pituitary_adenoma,
      synonyms: [NFPA],
      mappings: { mondo: 'MONDO:0019613' }
    }
  - {
      id: vestibular_schwannoma,
      label: Vestibular schwannoma,
      synonyms: [acoustic neuroma, VS],
      description: 'Benign nerve sheath tumor of the vestibular nerve. MONDO places it under peripheral nervous system neoplasms, not under brain neoplasms.',
      mappings: { mondo: 'MONDO:0001569' }
    }
  - { id: lung_cancer, label: Lung cancer, mappings: { mondo: 'MONDO:0008903' } }
  - {
      id: nsclc,
      label: Non-small cell lung cancer,
      parent: lung_cancer,
      synonyms: [NSCLC],
      mappings: { mondo: 'MONDO:0005233' }
    }
  - { id: pulmonary_nodule, label: Pulmonary nodule, synonyms: [lung nodule], mappings: { hp: 'HP:0033608' } }
  - { id: breast_cancer, label: Breast cancer, mappings: { mondo: 'MONDO:0007254' } }
  - { id: prostate_cancer, label: Prostate cancer, mappings: { mondo: 'MONDO:0008315' } }
  - { id: ovarian_cancer, label: Ovarian cancer, mappings: { mondo: 'MONDO:0008170' } }
  - { id: liver_cancer, label: Liver cancer, mappings: { mondo: 'MONDO:0002691' } }
  - { id: gastric_cancer, label: Gastric cancer, synonyms: [stomach cancer], mappings: { mondo: 'MONDO:0001056' } }
  - {
      id: hcc,
      label: Hepatocellular carcinoma,
      parent: liver_cancer,
      synonyms: [HCC],
      mappings: { mondo: 'MONDO:0007256' }
    }
  - { id: liver_cirrhosis, label: Liver cirrhosis, synonyms: [cirrhosis of liver], mappings: { mondo: 'MONDO:0005155' } }
  - { id: ckd, label: Chronic kidney disease, synonyms: [CKD], mappings: { mondo: 'MONDO:0005300' } }
  - { id: kidney_cancer, label: Kidney cancer, mappings: { mondo: 'MONDO:0002367' } }
  - {
      id: chromophobe_renal_cell_carcinoma,
      label: Chromophobe renal cell carcinoma,
      synonyms: [chRCC, KICH],
      parent: kidney_cancer,
      mappings: { mondo: 'MONDO:0017885' }
    }
  - {
      id: ccrcc,
      label: Clear cell renal cell carcinoma,
      parent: kidney_cancer,
      synonyms: [ccRCC, clear cell renal carcinoma],
      mappings: { mondo: 'MONDO:0005005' }
    }
  - { id: sarcoma, label: Sarcoma, mappings: { mondo: 'MONDO:0005089' } }
  - {
      id: chondrosarcoma,
      label: Chondrosarcoma,
      parent: sarcoma,
      synonyms: [atypical cartilaginous tumor, ACT],
      mappings: { mondo: 'MONDO:0008977' }
    }
  - {
      id: pancreatic_cancer,
      label: Pancreatic ductal adenocarcinoma,
      synonyms: [PDAC, pancreatic cancer],
      mappings: { mondo: 'MONDO:0005184' }
    }
  - { id: bladder_cancer, label: Bladder cancer, synonyms: [urinary bladder cancer], mappings: { mondo: 'MONDO:0001187' } }
  - {
      id: bladder_urothelial_carcinoma,
      label: Bladder urothelial carcinoma,
      parent: bladder_cancer,
      synonyms: [bladder transitional cell carcinoma, BLCA],
      mappings: { mondo: 'MONDO:0005611' }
    }
  - { id: colorectal_cancer, label: Colorectal cancer, mappings: { mondo: 'MONDO:0005575' } }
  - {
      id: endometrial_carcinoma,
      label: Endometrial carcinoma,
      synonyms: [endometrial cancer, uterine corpus endometrial carcinoma, UCEC],
      mappings: { mondo: 'MONDO:0002447' }
    }
  - {
      id: head_neck_cancer,
      label: Head and neck squamous cell carcinoma,
      synonyms: [HNSCC],
      mappings: { mondo: 'MONDO:0010150' }
    }
  - { id: nasopharyngeal_carcinoma, label: Nasopharyngeal carcinoma, synonyms: [NPC], mappings: { mondo: 'MONDO:0015459' } }
  - { id: melanoma, label: Melanoma, mappings: { mondo: 'MONDO:0005105' } }
  - { id: skin_cancer, label: Skin cancer, mappings: { mondo: 'MONDO:0002898' } }
  - {
      id: melanocytic_nevus,
      label: Melanocytic nevus,
      synonyms: [nevus, naevus, mole],
      mappings: { mondo: 'MONDO:0005073' }
    }
  - { id: seborrheic_keratosis, label: Seborrheic keratosis, mappings: { mondo: 'MONDO:0008420' } }
  - { id: lymphoma, label: Lymphoma, mappings: { mondo: 'MONDO:0005062' } }
  - { id: soft_tissue_sarcoma, label: Soft tissue sarcoma, synonyms: [STS], mappings: { mondo: 'MONDO:0018078' } }
  - {
      id: pancreatic_neoplasm,
      label: Pancreatic neoplasm,
      description: 'Any pancreatic tumour or cystic neoplasm, e.g. IPMN, neuroendocrine tumour or PDAC',
      synonyms: [pancreatic mass, pancreatic tumour],
      mappings: { mondo: 'MONDO:0021040' }
    }
  - {
      id: lymph_node_metastasis,
      label: Lymph node metastasis,
      synonyms: [nodal metastasis],
      mappings: { mondo: 'MONDO:0005438' }
    }
  # Chest and other findings
  - { id: pneumonia, label: Pneumonia, mappings: { mondo: 'MONDO:0005249' } }
  - { id: covid19, label: COVID-19, mappings: { mondo: 'MONDO:0100096' } }
  - { id: respiratory_infection, label: Respiratory tract infection, synonyms: [respiratory infection], mappings: { mondo: 'MONDO:0024355' } }
  - { id: tuberculosis, label: Tuberculosis, mappings: { mondo: 'MONDO:0018076' } }
  - { id: pneumothorax, label: Pneumothorax, mappings: { mondo: 'MONDO:0002076' } }
  - { id: pleural_effusion, label: Pleural effusion, mappings: { hp: 'HP:0002202' } }
  - { id: cardiomegaly, label: Cardiomegaly, mappings: { hp: 'HP:0001640' } }
  - { id: atelectasis, label: Atelectasis, mappings: { hp: 'HP:0100750' } }
  - {
      id: consolidation,
      label: Pulmonary consolidation,
      synonyms: [consolidation, parenchymal consolidation],
      mappings: { hp: 'HP:0032177' }
    }
  - { id: pulmonary_edema, label: Pulmonary edema, synonyms: [edema, oedema], mappings: { hp: 'HP:0100598' } }
  - { id: emphysema, label: Pulmonary emphysema, synonyms: [emphysema], mappings: { mondo: 'MONDO:0004849' } }
  - { id: pulmonary_fibrosis, label: Pulmonary fibrosis, synonyms: [fibrosis], mappings: { mondo: 'MONDO:0002771' } }
  - {
      id: pulmonary_infiltrates,
      label: Pulmonary infiltrates,
      synonyms: [infiltration, infiltrate],
      mappings: { hp: 'HP:0002113' }
    }
  - { id: pulmonary_mass, label: Pulmonary mass, synonyms: [lung mass, mass], mappings: { hp: 'HP:0033821' } }
  - {
      id: lung_opacity,
      label: Pulmonary opacity,
      synonyms: [lung opacity, airspace opacity],

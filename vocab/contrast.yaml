# yaml-language-server: $schema=../schema/vocab.schema.json
# MR terms use BIDS suffixes where BIDS has one (mappings.bids). Everything else is a local term.
terms:
  # MR structural
  - { id: T1w, label: T1-weighted, group: MR, mappings: { bids: T1w } }
  - id: T1w_ce
    label: T1-weighted, contrast enhanced
    group: MR
    synonyms: [T1c, T1Gd, T1-CE, T1 post-contrast]
    description: Gadolinium-enhanced T1w. BIDS writes this as a T1w with the ce- entity.
    mappings: { bids: 'ce-<label>_T1w' }
  - { id: T2w, label: T2-weighted, group: MR, mappings: { bids: T2w } }
  - {
      id: FLAIR,
      label: FLAIR,
      group: MR,
      description: Fluid-attenuated inversion recovery,
      synonyms: [T2-FLAIR],
      mappings: { bids: FLAIR }
    }
  - { id: PDw, label: Proton density weighted, group: MR, mappings: { bids: PDw } }
  - { id: STIR, label: STIR, group: MR, description: Short tau inversion recovery (fat-suppressed), synonyms: [T2 STIR] }
  - {
      id: WMn,
      label: White-matter-nulled,
      group: MR,
      description: 'Inversion-recovery T1-weighted image with the inversion time set to null white matter, giving high contrast between deep gray matter nuclei such as the thalamic nuclei',
      synonyms: [white matter nulled, WMn-MPRAGE, FGATIR]
    }
  - {
      id: dixon,
      label: Dixon fat-water,
      group: MR,
      description: 'Chemical-shift imaging that gives in-phase, opposed-phase, fat and water images from one acquisition. BIDS has no suffix for it.',
      synonyms: [Dixon, in-phase, opposed-phase, fat-water]
    }
  - { id: T2starw, label: T2*-weighted, group: MR, synonyms: [GRE, T2*-GRE], mappings: { bids: T2starw } }
  - {
      id: swi,
      label: Susceptibility-weighted,
      group: MR,
      parent: T2starw,
      description: 'Susceptibility-weighted imaging built from magnitude and phase of a gradient echo. BIDS has no suffix for it.',
      synonyms: [SWI, SWAN]
    }
  - { id: Chimap, label: QSM susceptibility map, group: MR, synonyms: [QSM], mappings: { bids: Chimap } }
  - { id: MEGRE, label: Multi-echo gradient echo, group: MR, description: 'Multi-echo gradient-echo magnitude and phase images, e.g. for QSM or R2* mapping', synonyms: [ME-GRE, multi-echo GRE], mappings: { bids: MEGRE } }
  - { id: MESE, label: Multi-echo spin echo, group: MR, description: 'Multi-echo spin-echo images, e.g. for T2 mapping', synonyms: [ME-SE, multi-echo SE, multi-echo spin-echo], mappings: { bids: MESE } }
  - { id: MP2RAGE, label: MP2RAGE, group: MR, mappings: { bids: MP2RAGE } }
  - { id: T1map, label: T1 map, group: MR, mappings: { bids: T1map } }
  - { id: T2map, label: T2 map, group: MR, mappings: { bids: T2map } }
  - { id: T2starmap, label: T2* map, group: MR, description: Quantitative T2* relaxation time map, mappings: { bids: T2starmap } }
  - id: MTR
    label: Magnetization transfer
    group: MR
    description: Paired images acquired with and without a magnetization transfer pulse (mt-on, mt-off), used for magnetization transfer ratio maps.
    synonyms: [MT, MTI, magnetization transfer ratio]
    mappings: { bids: MTR }
  - id: ihMTw
    label: Inhomogeneous magnetization transfer
    group: MR
    description: Gradient echo images with single- and dual-frequency magnetization transfer saturation, used for myelin-sensitive ihMT ratio maps.
    synonyms: [ihMT]
    mappings: { bids: ihMTw }
  - id: VFA
    label: Variable flip angle
    group: MR
    description: Spoiled gradient echo and/or balanced SSFP images at several flip angles for T1, T2 or myelin water mapping.
    synonyms: [mcDESPOT, DESPOT1, DESPOT2]
    mappings: { bids: VFA }
  - { id: angio, label: MR angiography, group: MR, synonyms: [TOF, MRA], mappings: { bids: angio } }
  # MR diffusion, function, perfusion
  - { id: dwi, label: Diffusion-weighted, group: MR, synonyms: [DWI, DTI], mappings: { bids: dwi } }
  - { id: ADC, label: ADC map, group: MR, description: Apparent diffusion coefficient map, mappings: { bids: ADC } }
  - { id: bold, label: BOLD fMRI, group: MR, synonyms: [fMRI, rs-fMRI], mappings: { bids: bold } }
  - { id: asl, label: Arterial spin labeling, group: MR, mappings: { bids: asl } }
  - { id: dce, label: DCE perfusion, group: MR, description: Dynamic contrast-enhanced MRI }
  - { id: dsc, label: DSC perfusion, group: MR, description: Dynamic susceptibility contrast MRI }
  - { id: cine, label: Cine MRI, group: MR, description: 'Cardiac cine imaging, e.g. balanced SSFP' }
  - { id: lge, label: Late gadolinium enhancement, group: MR, synonyms: [LGE] }
  - id: tagging
    label: Myocardial tagging
    group: MR
    parent: cine
    description: Cine imaging with a saturation grid or lines laid on the myocardium to track its deformation
    synonyms: [grid tagging, SPAMM, tagged MRI]
  - id: dense
    label: DENSE
    group: MR
    parent: cine
    description: Displacement encoding with stimulated echoes, cine phase images that encode myocardial displacement
    synonyms: [cine DENSE, displacement encoding with stimulated echoes]
  # MR spectroscopy
  - id: MRS
    label: MR spectroscopy
    group: MR
    description: 'Proton or other nuclear magnetic resonance spectra from a single voxel (SVS, e.g. PRESS, STEAM, MEGA-PRESS) or a spectroscopic imaging grid (MRSI). BIDS stores these with the svs and mrsi suffixes.'
    synonyms: [MR spectroscopy, 1H-MRS, SVS, MRSI, PRESS, STEAM, MEGA-PRESS]
  # CT phases
  - { id: ct_noncontrast, label: Non-contrast CT, group: CT, synonyms: [native CT, NCCT] }
  - {
      id: ct_contrast,
      label: Contrast CT,
      group: CT,
      description: Contrast-enhanced CT where the phase is not specified
    }
  - { id: ct_arterial, label: Arterial phase CT, group: CT }
  - { id: ct_venous, label: Portal venous phase CT, group: CT }
  - { id: ct_delayed, label: Delayed phase CT, group: CT }
  - { id: ct_angio, label: CT angiography, group: CT, synonyms: [CTA] }
  - { id: ct_lowdose, label: Low-dose CT, group: CT, synonyms: [LDCT] }
  # Pathology stains
  - { id: he, label: H&E stain, group: SM, synonyms: [hematoxylin and eosin] }
  - { id: ihc, label: Immunohistochemistry, group: SM, synonyms: [IHC] }
  - id: multiplex_if
    label: Multiplexed immunofluorescence
    group: SM
    synonyms: [mIF, mxIF, CyCIF, cyclic immunofluorescence, highly multiplexed tissue imaging]
    description: Immunofluorescence imaging of many protein markers on one tissue section, e.g. by cyclic staining rounds
  # Ultrasound
  - { id: b_mode, label: B-mode, group: US }
  - { id: doppler, label: Doppler, group: US }
  - { id: phase_contrast, label: Phase-contrast flow MRI, group: MR, description: 'Velocity-encoded phase-contrast imaging of blood flow', synonyms: [PC-MRI, flow, velocity encoding] }
